<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5eff">
<title>一建每日刷题</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="一建刷题">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1d2433;--sub:#6b7385;--line:#e6e9f0;--pri:#1f5eff;--pri2:#e8efff;--ok:#16a34a;--ok2:#e7f7ec;--bad:#dc2626;--bad2:#fdecec;--warn:#d97706;--warn2:#fff4e0;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(76px + env(safe-area-inset-bottom))}
.sync{font-size:11px;color:var(--sub);margin-left:6px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 10px}
header.top h1{font-size:19px;margin:0;font-weight:700}
header.top .date{color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.row{display:flex;gap:12px}.row>*{flex:1}
.muted{color:var(--sub);font-size:13px}
.big{font-size:30px;font-weight:700;line-height:1.2}
.stat{text-align:center;padding:12px 6px}
.stat .lbl{color:var(--sub);font-size:12px;margin-top:2px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;background:var(--pri);color:#fff;cursor:pointer}
.btn:active{opacity:.85}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:7px 14px;font-size:14px;border-radius:10px}
.btn:disabled{background:#c9cfdb;color:#fff}
.bar{height:8px;background:#edf0f5;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:6px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:#eef1f6;color:var(--sub);margin-right:6px}
.tag.jj{background:#e8efff;color:#1f5eff}.tag.gl{background:#e9f8ef;color:#15803d}.tag.fg{background:#fdf0e6;color:#c2410c}.tag.sw{background:#f2ecfe;color:#6d28d9}.tag.gs{background:#e6f6f8;color:#0e7490}
.tag.d3{background:var(--bad2);color:var(--bad)}.tag.d2{background:var(--warn2);color:var(--warn)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--sub);cursor:pointer}
nav.tabs button b{display:block;font-size:19px;line-height:1.2;font-weight:400}
nav.tabs button.on{color:var(--pri);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal span{height:34px;border-radius:6px;background:#eef1f6;font-size:10px;color:#9aa1b2;display:flex;align-items:center;justify-content:center}
.cal span.p{background:#cfdcff;color:#3b5bdb}.cal span.d{background:var(--pri);color:#fff}.cal span.t{outline:2px solid var(--pri);outline-offset:-2px}
/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
.qhead .x{border:0;background:none;font-size:15px;color:var(--sub);padding:4px 0;cursor:pointer}
.qtext{font-size:17px;line-height:1.7;margin:10px 0 14px;font-weight:500}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-bottom:9px;font-size:15px;color:var(--ink);cursor:pointer;line-height:1.55}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #c8cedb;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--sub)}
.opt.multi .k{border-radius:7px}
.opt.sel{border-color:var(--pri);background:var(--pri2)}.opt.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok2)}.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad2)}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.miss{border-color:var(--ok);border-style:dashed}.opt.miss .k{border-color:var(--ok);color:var(--ok)}
.res{border-radius:12px;padding:12px 14px;margin:6px 0 10px;font-weight:600}
.res.ok{background:var(--ok2);color:var(--ok)}.res.bad{background:var(--bad2);color:var(--bad)}.res.part{background:var(--warn2);color:var(--warn)}
.exp{background:#f8f9fc;border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14.5px}
.exp h4{margin:0 0 4px;font-size:13px;color:var(--sub);font-weight:600}
.kpbox{border-left:3px solid var(--pri);padding:8px 12px;background:#f7f9ff;border-radius:0 10px 10px 0;font-size:14px;margin-bottom:12px}
.kpbox b{display:block;font-size:13px;color:var(--pri);margin-bottom:2px}
.actions{display:flex;gap:10px;position:sticky;bottom:env(safe-area-inset-bottom);padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.actions .btn{flex:1}
.list .it{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .t{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seg{display:flex;background:#e9ecf3;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;font-size:13.5px;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kprow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;cursor:pointer}
.kprow .n{flex:1}.kprow .bar{width:70px;flex:none}
.dots{display:flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:#e1e5ee}.dots i.f{background:var(--ok)}
label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
select,input[type=date],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:90px;font-size:13px}
.mask{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 8px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(20,25,40,.9);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:30}
.celebrate{text-align:center;padding:22px 10px}
.celebrate .e{font-size:46px}
.subhd{font-size:13px;color:var(--sub);margin:16px 2px 8px;font-weight:600}
.flag{border:0;background:none;color:var(--sub);font-size:13px;cursor:pointer;padding:4px 0}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
body.quiz nav.tabs{display:none}
body.quiz #app{padding-bottom:20px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs"><div class="in">
<button data-tab="home"><b>☀</b>今日</button>
<button data-tab="practice"><b>✎</b>练习</button>
<button data-tab="wrong"><b>✗</b>错题</button>
<button data-tab="stats"><b>▤</b>统计</button>
<button data-tab="settings"><b>⚙</b>设置</button>
</div></nav>
<script>
var KP=[],QB=[],BANKVER='20261101-1829';
// 建设工程法规及相关知识
KP.push(
{id:'fg01',s:'fg',n:'法的形式与效力层级',imp:0,tip:'宪法>法律>行政法规>地方性法规>本级和下级地方政府规章；部门规章与地方政府规章效力同等，冲突时由国务院裁决；地方性法规与部门规章冲突，由国务院提出意见，国务院认为应适用部门规章的，提请全国人大常委会裁决。'},
{id:'fg02',s:'fg',n:'代理制度',imp:1,tip:'无权代理：相对人可催告被代理人自收到通知之日起30日内予以追认，未作表示视为拒绝。表见代理：相对人有理由相信行为人有代理权的，代理行为有效。'},
{id:'fg03',s:'fg',n:'物权与担保',imp:1,tip:'不动产抵押自登记时设立；动产抵押自合同生效时设立，未经登记不得对抗善意第三人；质权自出质人交付质押财产时设立。定金不超过主合同标的额20%，自实际交付时成立；定金与违约金只能选择其一。'},
{id:'fg04',s:'fg',n:'诉讼时效',imp:1,tip:'普通诉讼时效3年，自知道或应当知道权利受损及义务人之日起算；最长保护期20年。时效期间最后6个月内因不可抗力等障碍不能行使请求权的，时效中止，障碍消除之日起满6个月届满；提起诉讼、申请仲裁、权利人提出请求、义务人同意履行，时效中断，重新计算。'},
{id:'fg05',s:'fg',n:'合同的订立（要约与承诺）',imp:1,tip:'招标公告、拍卖公告、商业广告和宣传、寄送的价目表为要约邀请；投标为要约；中标通知书为承诺。承诺通知到达要约人时生效。'},
{id:'fg06',s:'fg',n:'合同效力（无效与可撤销）',imp:1,tip:'可撤销：重大误解、欺诈、胁迫、显失公平。撤销权：知道或应当知道撤销事由之日起1年内行使，重大误解为90日；自民事法律行为发生之日起5年内未行使的，撤销权消灭。'},
{id:'fg07',s:'fg',n:'施工合同司法解释',imp:1,tip:'实际竣工日期：验收合格之日；发包人拖延验收的，以承包人提交验收报告之日；未经验收擅自使用的，以转移占有之日。施工合同无效但验收合格的，可参照合同关于工程价款的约定折价补偿。承包人建设工程价款优先受偿权期限最长不超过18个月，自发包人应当给付工程价款之日起算。'},
{id:'fg08',s:'fg',n:'违约责任',imp:0,tip:'约定的违约金低于造成的损失的，可请求人民法院或仲裁机构增加；过分高于损失的，可请求适当减少（一般以超过损失30%为标准）。一方违约后，对方应当采取适当措施防止损失扩大，否则不得就扩大的损失请求赔偿。'},
{id:'fg09',s:'fg',n:'施工许可制度',imp:1,tip:'工程投资额30万元以下或建筑面积300m²以下可不申请施工许可证。领证后3个月内开工，可延期2次，每次不超过3个月；中止施工的，自中止之日起1个月内报告；恢复施工时，中止满1年的应报发证机关核验施工许可证。'},
{id:'fg10',s:'fg',n:'注册建造师执业',imp:0,tip:'注册证书和执业印章有效期3年，延续注册应在有效期届满30日前申请。建造师不得同时担任两个及以上建设工程施工项目负责人（同一工程相邻分段或分期施工、合同约定工程验收合格、非承包方原因停工超过120天经建设单位同意等情形除外）。'},
{id:'fg11',s:'fg',n:'发包承包与分包',imp:1,tip:'主体结构必须由总承包单位自行完成（钢结构工程除外）；分包须经建设单位认可（合同中约定或建设单位同意）；分包单位不得将其承包的工程再分包（专业分包单位将劳务作业分包给劳务单位除外）；总承包单位与分包单位就分包工程对建设单位承担连带责任。'},
{id:'fg12',s:'fg',n:'招标投标时限与保证金',imp:1,tip:'招标文件发出至投标截止不少于20日；澄清修改须在投标截止前15日；资格预审文件/招标文件发售期不少于5日；投标保证金不超过估算价2%；中标候选人公示不少于3日；中标通知书发出30日内订立合同；履约保证金不超过中标合同金额10%；合同签订后5日内退还投标保证金及利息。'},
{id:'fg13',s:'fg',n:'投标、开标与否决投标',imp:1,tip:'应否决投标：未经投标单位盖章和单位负责人签字；投标人不符合资格条件；同一项目报两个以上报价（要求备选投标的除外）；报价低于成本或高于最高投标限价；未实质性响应招标文件；有串通投标、弄虚作假、行贿等违法行为。联合体由同一专业单位组成的，按资质等级较低的单位确定资质等级；联合体各方承担连带责任。'},
{id:'fg14',s:'fg',n:'施工单位与建设单位的质量责任',imp:1,tip:'施工单位必须按图纸和标准施工，不得擅自修改设计；必须对材料设备进行检验，未经检验或检验不合格的不得使用；隐蔽工程隐蔽前应通知建设单位和质量监督机构；涉及结构安全的试块试件应在监督下现场取样送检。建设单位不得明示或暗示施工单位使用不合格材料，不得任意压缩合理工期。'},
{id:'fg15',s:'fg',n:'质量保修',imp:1,tip:'最低保修期限：基础设施工程、房屋建筑的地基基础和主体结构为设计文件规定的合理使用年限；屋面防水、有防水要求的卫生间房间和外墙面防渗漏为5年；供热与供冷系统为2个采暖期、供冷期；电气管线、给排水管道、设备安装和装修为2年。保修期自竣工验收合格之日起计算。'},
{id:'fg16',s:'fg',n:'竣工验收与备案',imp:0,tip:'竣工验收条件：完成设计和合同约定内容；有完整技术档案和施工管理资料；有主要材料设备进场试验报告；有勘察、设计、施工、监理分别签署的质量合格文件；有施工单位签署的工程保修书。建设单位应自竣工验收合格之日起15日内备案。'},
{id:'fg17',s:'fg',n:'安全生产责任',imp:1,tip:'生产经营单位主要负责人是本单位安全生产第一责任人；施工单位项目负责人对项目安全施工负责；安全生产费用不得挪作他用；施工单位应向作业人员书面告知危险岗位的操作规程和违章操作的危害；作业人员有权拒绝违章指挥和强令冒险作业。'},
{id:'fg18',s:'fg',n:'危大工程专项施工方案',imp:1,tip:'专项施工方案由施工单位技术负责人审核签字、加盖单位公章，并由总监理工程师审查签字、加盖执业印章后方可实施；实行总承包的，由总承包单位技术负责人及分包单位技术负责人共同审核签字。超过一定规模的危大工程由施工单位组织召开专家论证会，专家不少于5名，本项目参建各方人员不得以专家身份参加。'},
{id:'fg19',s:'fg',n:'生产安全事故等级与报告',imp:1,tip:'特别重大：30人以上死亡、100人以上重伤或1亿元以上直接经济损失；重大：10~30人、50~100人、5000万~1亿元；较大：3~10人、10~50人、1000万~5000万元；一般：3人以下死亡、10人以下重伤、1000万元以下（以上含本数，以下不含）。事故发生后现场人员立即报告本单位负责人，单位负责人1小时内报告县级以上政府有关部门。自事故发生之日起30日内伤亡人数变化应及时补报（道路交通、火灾事故为7日内）。'},
{id:'fg20',s:'fg',n:'劳动合同',imp:1,tip:'试用期：合同期3个月以上不满1年不超过1个月；1年以上不满3年不超过2个月；3年以上及无固定期限不超过6个月；同一单位与同一劳动者只能约定一次。用工之日起超过1个月不满1年未订书面合同的，应支付二倍工资。经济补偿每满1年支付1个月工资，6个月以上不满1年按1年计，不满6个月支付半个月。劳动争议仲裁时效1年。'},
{id:'fg21',s:'fg',n:'仲裁与民事诉讼',imp:1,tip:'仲裁实行或裁或审、一裁终局；申请撤销仲裁裁决应自收到裁决书之日起6个月内提出。建设工程施工合同纠纷按不动产纠纷由不动产所在地法院专属管辖。不服一审判决上诉期15日，不服裁定上诉期10日。申请执行期间2年。'},
{id:'fg22',s:'fg',n:'行政复议与行政诉讼',imp:0,tip:'自知道或应当知道行政行为之日起60日内可申请行政复议；直接提起行政诉讼的，应自知道或应当知道作出行政行为之日起6个月内提出。行政复议期间行政行为原则上不停止执行。'},
{id:'fg23',s:'fg',n:'农民工工资支付保障',imp:1,tip:'施工总承包单位应开设农民工工资专用账户，存储工资保证金；分包单位按月考核工作量编制工资支付表，经农民工本人签字确认后交总承包单位，由总承包单位通过专用账户直接支付到农民工本人银行账户。分包单位拖欠工资的，由施工总承包单位先行清偿，再依法追偿。'},
{id:'fg24',s:'fg',n:'环境保护（施工噪声）',imp:0,tip:'《噪声污染防治法》中“夜间”指晚上22点至次日早晨6点（设区的市级以上政府可另行规定）；在噪声敏感建筑物集中区域，禁止夜间进行产生噪声的建筑施工作业，但抢修、抢险或因生产工艺要求等必须连续施工的除外，后者须取得地方政府住建等部门的证明并公告附近居民。'}
);
QB.push(
{id:'fg001',kp:'fg01',t:1,d:1,q:'下列规范性文件中，效力最高的是（ ）。',o:['行政法规','地方性法规','部门规章','地方政府规章'],a:'A',e:'效力层级：宪法>法律>行政法规>地方性法规>本级和下级地方政府规章。行政法规由国务院制定，效力高于地方性法规和规章。'},
{id:'fg002',kp:'fg01',t:1,d:2,q:'部门规章与地方政府规章之间对同一事项的规定不一致时，由（ ）裁决。',o:['全国人民代表大会常务委员会','国务院','省级人民代表大会常务委员会','最高人民法院'],a:'B',e:'部门规章之间、部门规章与地方政府规章之间对同一事项的规定不一致时，由国务院裁决。'},
{id:'fg003',kp:'fg01',t:1,d:3,q:'地方性法规与部门规章之间对同一事项的规定不一致、不能确定如何适用时，正确的处理程序是（ ）。',o:['由国务院直接裁决','由全国人大常委会直接裁决','由国务院提出意见，国务院认为应适用地方性法规的，决定在该地方适用地方性法规；认为应适用部门规章的，提请全国人大常委会裁决','由制定机关协商解决'],a:'C',e:'《立法法》规定：地方性法规与部门规章不一致时，由国务院提出意见，国务院认为应当适用地方性法规的，应当决定在该地方适用地方性法规的规定；认为应当适用部门规章的，应当提请全国人大常委会裁决。'},
{id:'fg004',kp:'fg02',t:1,d:2,q:'甲公司员工乙未经授权以甲公司名义与丙公司签订材料采购合同。丙公司催告甲公司追认，根据《民法典》，甲公司应在收到通知之日起（ ）内予以追认，未作表示的视为（ ）。',o:['30日；拒绝追认','30日；追认','1个月；追认','15日；拒绝追认'],a:'A',e:'相对人可以催告被代理人自收到通知之日起30日内予以追认。被代理人未作表示的，视为拒绝追认。'},
{id:'fg005',kp:'fg02',t:1,d:2,q:'某项目经理被公司解聘后，仍持有盖有公司公章的空白合同书，以公司名义与不知情的供应商签订采购合同。该合同的效力通常为（ ）。',o:['无效','效力待定','构成表见代理，对公司有效','可撤销'],a:'C',e:'行为人代理权终止后仍以被代理人名义订立合同，相对人有理由相信其有代理权（持有空白合同书、公章等）的，构成表见代理，代理行为有效，被代理人承担责任后可向行为人追偿。'},
{id:'fg006',kp:'fg03',t:1,d:1,q:'以建筑物设定抵押的，抵押权自（ ）时设立。',o:['抵押合同签订','抵押合同生效','办理抵押登记','交付抵押物'],a:'C',e:'以建筑物和其他土地附着物、建设用地使用权、正在建造的建筑物等不动产抵押的，应当办理抵押登记，抵押权自登记时设立。'},
{id:'fg007',kp:'fg03',t:1,d:2,q:'甲乙签订合同，标的额100万元，约定定金30万元，甲实际交付定金25万元。乙违约后，甲可请求返还的定金数额最多为（ ）万元。',o:['20','40','50','60'],a:'B',e:'定金不得超过主合同标的额的20%，超过部分不产生定金效力，有效定金为20万元。实际交付25万元中，20万元为定金，适用定金罚则双倍返还40万元；超出的5万元应作为预付款返还，不属于“定金”返还。'},
{id:'fg008',kp:'fg03',t:1,d:2,q:'当事人既约定违约金又约定定金的，一方违约时，对方（ ）。',o:['可以同时适用违约金和定金条款','可以选择适用违约金或者定金条款','只能适用违约金条款','只能适用定金条款'],a:'B',e:'《民法典》第588条：当事人既约定违约金，又约定定金的，一方违约时，对方可以选择适用违约金或者定金条款。'},
{id:'fg009',kp:'fg04',t:1,d:1,q:'根据《民法典》，向人民法院请求保护民事权利的普通诉讼时效期间为（ ）。',o:['1年','2年','3年','4年'],a:'C',e:'普通诉讼时效期间为3年；自权利受到损害之日起超过20年的，人民法院不予保护（特殊情况可延长）。'},
{id:'fg010',kp:'fg04',t:1,d:2,q:'下列情形中，能够引起诉讼时效中断的是（ ）。',o:['发生不可抗力','权利人被义务人控制','权利人向义务人提出履行请求','继承开始后未确定继承人'],a:'C',e:'诉讼时效中断事由：权利人向义务人提出履行请求；义务人同意履行义务；提起诉讼或申请仲裁等。A、B、D在时效期间最后6个月内发生时引起诉讼时效中止。'},
{id:'fg011',kp:'fg04',t:1,d:3,q:'某债权诉讼时效期间届满前第4个月，该地区发生特大地震导致权利人无法行使请求权，障碍持续2个月后消除。则诉讼时效期间应于（ ）届满。',o:['障碍消除之日起满2个月','障碍消除之日起满4个月','障碍消除之日起满6个月','原时效届满之日'],a:'C',e:'在诉讼时效期间最后6个月内因不可抗力不能行使请求权的，诉讼时效中止；自中止时效的原因消除之日起满6个月，诉讼时效期间届满。'},
{id:'fg012',kp:'fg05',t:1,d:1,q:'在建设工程招标投标活动中，招标人发布招标公告的行为属于（ ）。',o:['要约','要约邀请','承诺','新要约'],a:'B',e:'招标公告是要约邀请；投标是要约；中标通知书是承诺。'},
{id:'fg013',kp:'fg05',t:2,d:1,q:'下列行为中，属于要约邀请的有（ ）。',o:['寄送的价目表','拍卖公告','招标公告','投标文件','一般商业广告'],a:'ABCE',e:'拍卖公告、招标公告、招股说明书、债券募集办法、基金招募说明书、商业广告和宣传、寄送的价目表等为要约邀请。投标文件属于要约。'},
{id:'fg014',kp:'fg06',t:1,d:2,q:'因重大误解订立的合同，当事人应当自知道或者应当知道撤销事由之日起（ ）内行使撤销权。',o:['30日','90日','6个月','1年'],a:'B',e:'重大误解的撤销权行使期间为90日；其他可撤销事由（欺诈、显失公平等）为1年；受胁迫的自胁迫行为终止之日起1年；自民事法律行为发生之日起5年内未行使的，撤销权消灭。'},
{id:'fg015',kp:'fg06',t:2,d:2,q:'根据《民法典》，下列民事法律行为中，属于可撤销的有（ ）。',o:['基于重大误解实施的','一方以欺诈手段使对方在违背真实意思的情况下实施的','行为人与相对人以虚假的意思表示实施的','一方利用对方处于危困状态致使成立时显失公平的','违背公序良俗的'],a:'ABD',e:'以虚假意思表示实施的民事法律行为无效（C）；违背公序良俗的无效（E）。'},
{id:'fg016',kp:'fg07',t:1,d:2,q:'承包人已提交竣工验收报告，发包人拖延验收的，根据最高人民法院司法解释，工程实际竣工日期为（ ）。',o:['竣工验收合格之日','承包人提交验收报告之日','发包人实际组织验收之日','合同约定的竣工日期'],a:'B',e:'建设工程经竣工验收合格的，以验收合格之日为竣工日期；承包人已提交验收报告，发包人拖延验收的，以承包人提交验收报告之日为竣工日期；未经竣工验收发包人擅自使用的，以转移占有建设工程之日为竣工日期。'},
{id:'fg017',kp:'fg07',t:1,d:2,q:'建设工程施工合同无效，但建设工程经验收合格的，承包人可以（ ）。',o:['请求参照合同关于工程价款的约定折价补偿','不能请求支付任何工程价款','只能按照实际成本请求支付','请求按照市场价格另行结算并赔偿利润损失'],a:'A',e:'《民法典》第793条：建设工程施工合同无效，但是建设工程经验收合格的，可以参照合同关于工程价款的约定折价补偿承包人。'},
{id:'fg018',kp:'fg07',t:1,d:3,q:'根据最高人民法院《关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》，承包人行使建设工程价款优先受偿权的期限最长不得超过（ ），自发包人应当给付建设工程价款之日起算。',o:['6个月','12个月','18个月','24个月'],a:'C',e:'承包人应当在合理期限内行使建设工程价款优先受偿权，但最长不得超过18个月，自发包人应当给付建设工程价款之日起算。'},
{id:'fg019',kp:'fg08',t:1,d:2,q:'合同约定的违约金过分高于造成的损失时，当事人可以请求人民法院或者仲裁机构适当减少。一般认为，违约金超过造成损失的（ ）的，可以认定为“过分高于造成的损失”。',o:['10%','20%','30%','50%'],a:'C',e:'根据司法解释，当事人约定的违约金超过造成损失的30%的，一般可以认定为过分高于造成的损失。'},
{id:'fg020',kp:'fg08',t:1,d:1,q:'一方违约后，对方没有采取适当措施致使损失扩大的，关于扩大的损失的说法，正确的是（ ）。',o:['由违约方全部承担','不得就扩大的损失请求赔偿','由双方平均分担','由违约方承担一半'],a:'B',e:'《民法典》第591条：当事人一方违约后，对方应当采取适当措施防止损失的扩大；没有采取适当措施致使损失扩大的，不得就扩大的损失请求赔偿。防止损失扩大而支出的合理费用由违约方负担。'},
{id:'fg021',kp:'fg09',t:1,d:1,q:'建设单位领取施工许可证后，应当自领取之日起（ ）内开工；因故不能按期开工的，可以延期，延期以（ ）为限，每次不超过3个月。',o:['1个月；一次','3个月；两次','3个月；三次','6个月；两次'],a:'B',e:'应当自领取施工许可证之日起3个月内开工；因故不能按期开工的，应向发证机关申请延期，延期以两次为限，每次不超过3个月。既不开工又不申请延期或超过延期时限的，施工许可证自行废止。'},
{id:'fg022',kp:'fg09',t:1,d:2,q:'在建工程因故中止施工的，建设单位应当自中止施工之日起（ ）内向发证机关报告；恢复施工时，中止施工满（ ）的工程，应当报发证机关核验施工许可证。',o:['1个月；1年','1个月；6个月','3个月；1年','15日；6个月'],a:'A',e:'中止施工的，建设单位应自中止施工之日起1个月内报告，并做好维护管理工作；中止施工满1年的工程恢复施工前，应报发证机关核验施工许可证。'},
{id:'fg023',kp:'fg09',t:1,d:2,q:'根据《建筑工程施工许可管理办法》，下列工程可以不申请办理施工许可证的是（ ）。',o:['工程投资额50万元的办公楼','建筑面积280m²的建筑工程','工程投资额100万元的厂房','建筑面积500m²的住宅'],a:'B',e:'工程投资额在30万元以下或者建筑面积在300m²以下的建筑工程，可以不申请办理施工许可证（省级住建部门可据实际调整限额）。'},
{id:'fg024',kp:'fg10',t:1,d:1,q:'注册建造师的注册证书与执业印章有效期为（ ）年，需要延续注册的，应在有效期届满（ ）日前申请。',o:['3；30','2；30','3；60','5；30'],a:'A',e:'注册证书与执业印章有效期为3年；有效期届满需要继续执业的，应当在注册有效期届满30日前申请延续注册。'},
{id:'fg025',kp:'fg10',t:1,d:2,q:'注册建造师原则上不得同时担任两个及以上建设工程施工项目负责人。下列情形中，可以例外的是（ ）。',o:['两个工程由同一建设单位发包','因非承包方原因致使工程项目停工超过120天（含），经建设单位同意','两个工程位于同一城市','两个工程规模都较小'],a:'B',e:'例外情形包括：同一工程相邻分段发包或分期施工的；合同约定的工程验收合格的；因非承包方原因致使工程项目停工超过120天（含），经建设单位同意的。'},
{id:'fg026',kp:'fg11',t:1,d:1,q:'施工总承包的，建筑工程（ ）的施工必须由总承包单位自行完成。',o:['装饰装修','主体结构','机电安装','幕墙'],a:'B',e:'《建筑法》规定，施工总承包的，建筑工程主体结构的施工必须由总承包单位自行完成。根据有关规定，钢结构工程除外。'},
{id:'fg027',kp:'fg11',t:2,d:2,q:'下列行为中，属于违法分包的有（ ）。',o:['承包单位将工程分包给不具备相应资质的单位','施工合同中没有约定，又未经建设单位认可，承包单位将其承包的部分专业工程交由其他单位完成','施工总承包单位将房屋建筑工程的主体结构（钢结构除外）分包给其他单位','专业分包单位将其承包的专业工程中的劳务作业分包给劳务单位','专业分包单位将其承包的专业工程中非劳务作业部分再分包'],a:'ABCE',e:'专业分包单位将其承包工程中的劳务作业分包给具有相应资质的劳务分包企业是合法的（D）。专业分包单位将非劳务作业部分再分包属违法分包。'},
{id:'fg028',kp:'fg11',t:1,d:1,q:'总承包单位依法将工程分包后，就分包工程对建设单位承担（ ）责任。',o:['按份','连带','补充','不承担'],a:'B',e:'总承包单位和分包单位就分包工程对建设单位承担连带责任。'},
{id:'fg029',kp:'fg12',t:1,d:1,q:'依法必须进行招标的项目，自招标文件开始发出之日起至投标人提交投标文件截止之日止，最短不得少于（ ）日。',o:['10','15','20','30'],a:'C',e:'《招标投标法》规定该期限最短不得少于20日。'},
{id:'fg030',kp:'fg12',t:1,d:2,q:'依法必须招标的工程，招标人对已发出的招标文件进行必要的澄清或者修改，可能影响投标文件编制的，应当在投标截止时间至少（ ）日前，以书面形式通知所有获取招标文件的潜在投标人。',o:['5','10','15','20'],a:'C',e:'澄清或修改应在投标截止时间至少15日前书面通知；不足15日的，招标人应当顺延提交投标文件的截止时间。'},
{id:'fg031',kp:'fg12',t:1,d:1,q:'招标人在招标文件中要求投标人提交投标保证金的，投标保证金不得超过招标项目估算价的（ ）。',o:['1%','2%','5%','10%'],a:'B',e:'投标保证金不得超过招标项目估算价的2%；履约保证金不得超过中标合同金额的10%。'},
{id:'fg032',kp:'fg12',t:1,d:2,q:'招标人和中标人应当自中标通知书发出之日起（ ）日内订立书面合同；招标人最迟应当在书面合同签订后（ ）日内退还投标保证金及银行同期存款利息。',o:['30；5','30；15','15；5','20；10'],a:'A',e:'自中标通知书发出之日起30日内订立书面合同；书面合同签订后5日内向中标人和未中标的投标人退还投标保证金及银行同期存款利息。'},
{id:'fg033',kp:'fg12',t:1,d:2,q:'依法必须进行招标的项目，招标人应当自收到评标报告之日起3日内公示中标候选人，公示期不得少于（ ）日。',o:['3','5','7','10'],a:'A',e:'中标候选人公示期不得少于3日。投标人对评标结果有异议的，应在公示期间提出，招标人应自收到异议之日起3日内答复。'},
{id:'fg034',kp:'fg13',t:2,d:2,q:'根据《招标投标法实施条例》，评标委员会应当否决投标的情形有（ ）。',o:['投标文件未经投标单位盖章和单位负责人签字','投标联合体没有提交共同投标协议','投标报价低于成本或者高于招标文件设定的最高投标限价','投标文件中有含义不明确的内容','同一投标人提交两个以上不同的投标报价，且招标文件未要求提交备选投标'],a:'ABCE',e:'投标文件中有含义不明确的内容、明显文字或计算错误的，评标委员会认为需要的，可以书面要求投标人澄清、说明，而非直接否决（D）。'},
{id:'fg035',kp:'fg13',t:1,d:2,q:'由同一专业的单位组成的联合体，应按照（ ）确定资质等级。',o:['资质等级较高的单位','资质等级较低的单位','牵头单位','承担工作量最大的单位'],a:'B',e:'由同一专业的单位组成的联合体，按照资质等级较低的单位确定资质等级。联合体各方就中标项目向招标人承担连带责任。'},
{id:'fg036',kp:'fg13',t:1,d:1,q:'投标人对开标有异议的，应当（ ）。',o:['在开标现场提出，招标人应当当场作出答复','在开标后3日内提出','在中标候选人公示期间提出','在投标截止时间10日前提出'],a:'A',e:'对开标有异议的应当在开标现场提出，招标人应当当场作出答复并制作记录。对资格预审文件的异议在提交资格预审申请文件截止前2日提出，对招标文件的异议在投标截止前10日提出。'},
{id:'fg037',kp:'fg14',t:1,d:1,q:'根据《建设工程质量管理条例》，隐蔽工程在隐蔽前，施工单位应当通知（ ）。',o:['建设单位和建设工程质量监督机构','设计单位和监理单位','勘察单位和设计单位','建设行政主管部门'],a:'A',e:'隐蔽工程在隐蔽前，施工单位应当通知建设单位和建设工程质量监督机构。'},
{id:'fg038',kp:'fg14',t:1,d:2,q:'施工单位在施工中发现设计文件和图纸有差错的，应当（ ）。',o:['按照规范自行修改后施工','继续按图施工，由设计单位负责','及时提出意见和建议','停止施工并通知质量监督机构'],a:'C',e:'施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料；施工中发现设计文件和图纸有差错的，应当及时提出意见和建议。'},
{id:'fg039',kp:'fg14',t:2,d:2,q:'根据《建设工程质量管理条例》，建设单位的质量责任和义务包括（ ）。',o:['不得明示或者暗示施工单位使用不合格的建筑材料','不得任意压缩合理工期','应当按规定将施工图设计文件报有关部门审查','组织竣工验收','对建筑材料进行检验，未经检验不得使用'],a:'ABCD',e:'对建筑材料、构配件、设备进行检验，未经检验或检验不合格的不得使用，是施工单位的义务（E）。'},
{id:'fg040',kp:'fg15',t:1,d:1,q:'在正常使用条件下，屋面防水工程、有防水要求的卫生间、房间和外墙面的防渗漏，最低保修期限为（ ）年。',o:['2','3','5','10'],a:'C',e:'屋面防水工程、有防水要求的卫生间、房间和外墙面的防渗漏，最低保修期限为5年。'},
{id:'fg041',kp:'fg15',t:1,d:2,q:'在正常使用条件下，电气管线、给排水管道、设备安装和装修工程的最低保修期限为（ ）。',o:['1年','2年','2个采暖期','5年'],a:'B',e:'电气管线、给排水管道、设备安装和装修工程为2年；供热与供冷系统为2个采暖期、供冷期。'},
{id:'fg042',kp:'fg15',t:1,d:2,q:'建设工程的保修期，自（ ）之日起计算。',o:['工程实际完工','竣工验收合格','竣工结算完成','交付使用'],a:'B',e:'建设工程的保修期，自竣工验收合格之日起计算。'},
{id:'fg043',kp:'fg16',t:1,d:1,q:'建设单位应当自建设工程竣工验收合格之日起（ ）日内，将竣工验收报告和有关文件报建设行政主管部门或其他有关部门备案。',o:['7','15','30','60'],a:'B',e:'建设单位应当自工程竣工验收合格之日起15日内备案。'},
{id:'fg044',kp:'fg16',t:2,d:2,q:'根据《建设工程质量管理条例》，建设工程竣工验收应当具备的条件有（ ）。',o:['完成建设工程设计和合同约定的各项内容','有完整的技术档案和施工管理资料','有工程使用的主要建筑材料、构配件和设备的进场试验报告','有施工单位签署的工程保修书','已付清全部工程款'],a:'ABCD',e:'此外还需有勘察、设计、施工、工程监理等单位分别签署的质量合格文件。付清工程款不是竣工验收条件。'},
{id:'fg045',kp:'fg17',t:1,d:1,q:'根据《安全生产法》，生产经营单位的（ ）是本单位安全生产第一责任人，对本单位的安全生产工作全面负责。',o:['安全生产管理机构负责人','主要负责人','分管安全的副职','技术负责人'],a:'B',e:'生产经营单位的主要负责人是本单位安全生产第一责任人，对本单位的安全生产工作全面负责；其他负责人对职责范围内的安全生产工作负责。'},
{id:'fg046',kp:'fg17',t:1,d:2,q:'根据《建设工程安全生产管理条例》，施工单位的（ ）对建设工程项目的安全施工负责。',o:['主要负责人','项目负责人','专职安全生产管理人员','技术负责人'],a:'B',e:'施工单位主要负责人依法对本单位的安全生产工作全面负责；施工单位的项目负责人对建设工程项目的安全施工负责，落实安全生产责任制度等。'},
{id:'fg047',kp:'fg17',t:2,d:1,q:'根据《安全生产法》，从业人员享有的权利包括（ ）。',o:['了解作业场所和工作岗位存在的危险因素及防范措施的权利','拒绝违章指挥和强令冒险作业的权利','发现直接危及人身安全的紧急情况时停止作业或撤离的权利','因生产安全事故受到损害时依法获得赔偿的权利','自行决定是否佩戴劳动防护用品的权利'],a:'ABCD',e:'从业人员应当正确佩戴和使用劳动防护用品，这是其义务而非可自行决定的权利（E）。'},
{id:'fg048',kp:'fg18',t:1,d:2,q:'根据《危险性较大的分部分项工程安全管理规定》，专项施工方案应当由（ ）审核签字、加盖单位公章，并由总监理工程师审查签字、加盖执业印章后方可实施。',o:['施工单位技术负责人','项目技术负责人','项目经理','施工单位安全负责人'],a:'A',e:'专项施工方案应由施工单位技术负责人审核签字、加盖单位公章，并由总监理工程师审查签字、加盖执业印章后方可实施。实行总承包的，由总承包单位技术负责人及分包单位技术负责人共同审核签字并加盖单位公章。'},
{id:'fg049',kp:'fg18',t:1,d:2,q:'对于超过一定规模的危险性较大的分部分项工程，施工单位应当组织召开专家论证会。关于专家论证的说法，正确的是（ ）。',o:['专家由建设单位从本项目参建单位中选取','专家人数不得少于5名，本项目参建各方人员不得以专家身份参加','专家论证会应由监理单位组织','专家论证不通过的，可直接按原方案实施'],a:'B',e:'专家论证会由施工单位组织（实行总承包的由总承包单位组织）；专家应从专家库中选取，不得少于5名，本项目参建各方的人员不得以专家身份参加；论证不通过的，应修改后重新组织专家论证。'},
{id:'fg050',kp:'fg19',t:1,d:1,q:'某生产安全事故造成8人死亡，30人重伤，根据《生产安全事故报告和调查处理条例》，该事故属于（ ）。',o:['一般事故','较大事故','重大事故','特别重大事故'],a:'B',e:'较大事故：3人以上10人以下死亡，或10人以上50人以下重伤，或1000万元以上5000万元以下直接经济损失。8人死亡、30人重伤均属较大事故。'},
{id:'fg051',kp:'fg19',t:1,d:2,q:'某工程坍塌事故造成10人死亡，根据《生产安全事故报告和调查处理条例》，该事故等级为（ ）。',o:['一般事故','较大事故','重大事故','特别重大事故'],a:'C',e:'重大事故为10人以上30人以下死亡。“以上”包括本数，10人死亡属于重大事故。'},
{id:'fg052',kp:'fg19',t:1,d:2,q:'事故发生后，事故现场有关人员应当立即向本单位负责人报告；单位负责人接到报告后，应当于（ ）内向事故发生地县级以上人民政府安全生产监督管理部门和负有安全生产监督管理职责的有关部门报告。',o:['30分钟','1小时','2小时','24小时'],a:'B',e:'单位负责人接到报告后，应当于1小时内报告。情况紧急时，事故现场有关人员可以直接向县级以上政府有关部门报告。'},
{id:'fg053',kp:'fg19',t:1,d:3,q:'自事故发生之日起（ ）日内，事故造成的伤亡人数发生变化的，应当及时补报；道路交通事故、火灾事故自发生之日起（ ）日内伤亡人数发生变化的，应当及时补报。',o:['30；7','30；15','15；7','7；30'],a:'A',e:'一般事故30日内伤亡人数变化应补报；道路交通事故、火灾事故为7日内。'},
{id:'fg054',kp:'fg20',t:1,d:1,q:'劳动合同期限为2年的，试用期最长不得超过（ ）。',o:['1个月','2个月','3个月','6个月'],a:'B',e:'劳动合同期限1年以上不满3年的，试用期不得超过2个月；3个月以上不满1年的不超过1个月；3年以上固定期限和无固定期限的不超过6个月。'},
{id:'fg055',kp:'fg20',t:1,d:2,q:'用人单位自用工之日起超过1个月不满1年未与劳动者订立书面劳动合同的，应当向劳动者每月支付（ ）。',o:['1.5倍工资','2倍工资','3倍工资','经济补偿金'],a:'B',e:'用人单位自用工之日起超过1个月不满1年未与劳动者订立书面劳动合同的，应当向劳动者每月支付二倍的工资。满1年仍未订立的，视为已订立无固定期限劳动合同。'},
{id:'fg056',kp:'fg20',t:1,d:3,q:'某劳动者在单位工作了3年8个月后，单位依法与其解除劳动合同并应支付经济补偿，补偿标准为（ ）个月工资。',o:['3','3.5','4','4.5'],a:'C',e:'经济补偿按工作年限每满1年支付1个月工资；6个月以上不满1年的，按1年计算；不满6个月的，支付半个月工资。3年8个月中8个月按1年计，共4个月。'},
{id:'fg057',kp:'fg21',t:1,d:1,q:'关于仲裁的说法，正确的是（ ）。',o:['仲裁裁决作出后，当事人不服可以向人民法院起诉','仲裁实行一裁终局制度','仲裁委员会由当事人所在地法定确定','仲裁必须公开进行'],a:'B',e:'仲裁实行或裁或审、一裁终局。裁决作出后，当事人就同一纠纷再申请仲裁或向法院起诉的，不予受理。仲裁不实行级别和地域管辖，原则上不公开进行。'},
{id:'fg058',kp:'fg21',t:1,d:2,q:'当事人申请撤销仲裁裁决的，应当自收到裁决书之日起（ ）内提出。',o:['15日','30日','3个月','6个月'],a:'D',e:'当事人申请撤销裁决的，应当自收到裁决书之日起6个月内提出，向仲裁委员会所在地的中级人民法院申请。'},
{id:'fg059',kp:'fg21',t:1,d:2,q:'建设工程施工合同纠纷的民事诉讼管辖法院应为（ ）。',o:['被告住所地人民法院','原告住所地人民法院','合同签订地人民法院','工程所在地人民法院'],a:'D',e:'根据民事诉讼法司法解释，建设工程施工合同纠纷按照不动产纠纷确定管辖，由不动产所在地（工程所在地）人民法院专属管辖。'},
{id:'fg060',kp:'fg21',t:1,d:2,q:'当事人不服地方人民法院第一审判决的，有权在判决书送达之日起（ ）内向上一级人民法院提起上诉。',o:['10日','15日','20日','30日'],a:'B',e:'不服一审判决的上诉期为15日；不服一审裁定的上诉期为10日。'},
{id:'fg061',kp:'fg22',t:1,d:1,q:'公民、法人或者其他组织认为行政行为侵犯其合法权益的，可以自知道或者应当知道该行政行为之日起（ ）内提出行政复议申请。',o:['15日','30日','60日','6个月'],a:'C',e:'行政复议申请期限为60日（法律规定超过60日的除外）。直接向法院提起行政诉讼的期限为6个月。'},
{id:'fg062',kp:'fg22',t:1,d:2,q:'关于行政复议的说法，正确的是（ ）。',o:['行政复议期间，行政行为一律停止执行','行政复议期间，行政行为原则上不停止执行','对行政复议决定不服的，不得提起行政诉讼','行政复议只能书面申请'],a:'B',e:'行政复议期间行政行为不停止执行（法定情形除外）。对复议决定不服的，一般可依法提起行政诉讼。复议申请可以书面，也可以口头提出。'},
{id:'fg063',kp:'fg23',t:1,d:2,q:'根据《保障农民工工资支付条例》，分包单位拖欠农民工工资的，由（ ）先行清偿，再依法进行追偿。',o:['建设单位','施工总承包单位','监理单位','劳务派遣单位'],a:'B',e:'施工总承包单位对所承包工程的农民工工资支付负总责；分包单位拖欠农民工工资的，由施工总承包单位先行清偿，再依法追偿。'},
{id:'fg064',kp:'fg23',t:1,d:2,q:'根据《保障农民工工资支付条例》，关于工程建设领域农民工工资支付的说法，正确的是（ ）。',o:['分包单位应开设农民工工资专用账户','农民工工资由分包单位以现金方式发放','施工总承包单位应开设农民工工资专用账户，通过专用账户直接将工资支付到农民工本人的银行账户','农民工工资可以由班组长代领'],a:'C',e:'施工总承包单位应当开设农民工工资专用账户；分包单位编制工资支付表经农民工本人签字确认后交总承包单位，总承包单位通过专用账户直接支付到农民工本人银行账户，并向分包单位提供代发工资凭证。'},
{id:'fg065',kp:'fg24',t:1,d:2,q:'根据《噪声污染防治法》，除另有规定外，“夜间”是指（ ）之间的期间。',o:['晚上20点至次日早晨6点','晚上22点至次日早晨6点','晚上22点至次日早晨7点','晚上23点至次日早晨6点'],a:'B',e:'“夜间”是指晚上十点至次日早晨六点之间的期间，设区的市级以上人民政府可以另行规定本行政区域夜间的起止时间。'},
{id:'fg066',kp:'fg24',t:1,d:2,q:'在噪声敏感建筑物集中区域，因生产工艺要求必须夜间连续施工作业的，根据《噪声污染防治法》，施工单位应当（ ）。',o:['取得地方人民政府住房和城乡建设、生态环境主管部门或者地方人民政府指定部门的证明，并公示或公告附近居民','告知建设单位后即可施工','向当地公安机关备案','与附近居民协商给予经济补偿后即可施工'],a:'A',e:'因特殊需要必须连续施工作业的，应当取得地方人民政府住建、生态环境主管部门或者地方政府指定部门的证明，并在施工现场显著位置公示或以其他方式公告附近居民。'}
);

// 法规 第二批
KP.push(
{id:'fg25',s:'fg',n:'项目经理部的法律地位',imp:0,tip:'项目经理部是施工企业为完成某项工程设立的一次性组织机构，不具备法人资格，其行为的法律后果由施工企业承担。'},
{id:'fg26',s:'fg',n:'保证',imp:1,tip:'保证方式分一般保证和连带责任保证；当事人对保证方式没有约定或约定不明确的，按一般保证承担责任。一般保证人享有先诉抗辩权。未约定保证期间或约定不明的，保证期间为主债务履行期限届满之日起6个月。'},
{id:'fg27',s:'fg',n:'合同履行中的抗辩权',imp:1,tip:'同时履行抗辩权：无先后履行顺序，一方在对方履行前有权拒绝其履行请求。先履行抗辩权：应先履行一方未履行，后履行一方有权拒绝其履行请求。不安抗辩权：应先履行一方有确切证据证明对方经营状况严重恶化、转移财产抽逃资金以逃避债务、丧失商业信誉等，可以中止履行，并应及时通知对方。'},
{id:'fg28',s:'fg',n:'债权转让与债务转移',imp:0,tip:'债权人转让债权，未通知债务人的，该转让对债务人不发生效力；债务人将债务全部或部分转移给第三人，应当经债权人同意。'},
{id:'fg29',s:'fg',n:'合同解除',imp:1,tip:'法定解除：不可抗力致使不能实现合同目的；履行期限届满前一方明确表示或以行为表明不履行主要债务；一方迟延履行主要债务经催告后在合理期限内仍未履行；一方迟延履行或有其他违约行为致使不能实现合同目的等。解除权无约定期限的，自解除权人知道或应当知道解除事由之日起1年内不行使则消灭。'},
{id:'fg30',s:'fg',n:'施工合同的解除与质量责任分担',imp:1,tip:'承包人将工程转包、违法分包的，发包人可以解除合同；发包人提供的主要建筑材料不符合强制性标准或不履行协助义务，致使承包人无法施工，经催告后在合理期限内仍未履行的，承包人可以解除合同。发包人提供的设计有缺陷、提供或指定购买的材料设备不符合强制性标准、直接指定分包人分包专业工程，造成质量缺陷的，发包人应承担过错责任。'},
{id:'fg31',s:'fg',n:'欠付工程款利息与结算',imp:0,tip:'利息从应付工程价款之日开始计付。没有约定或约定不明的：建设工程已实际交付的，为交付之日；没有交付的，为提交竣工结算文件之日；未交付且未结算的，为当事人起诉之日。'},
{id:'fg32',s:'fg',n:'工程建设标准',imp:0,tip:'按《标准化法》，标准分国家标准、行业标准、地方标准、团体标准、企业标准。国家标准分强制性标准和推荐性标准，行业标准、地方标准是推荐性标准。强制性标准必须执行；推荐性标准国家鼓励采用，一旦被合同约定采用即对当事人有约束力。'},
{id:'fg33',s:'fg',n:'应急救援预案',imp:0,tip:'施工单位应当制定本单位生产安全事故应急救援预案，建立应急救援组织或配备应急救援人员，配备必要的器材设备并定期演练。实行施工总承包的，由总承包单位统一组织编制建设工程生产安全事故应急救援预案，总承包单位和分包单位按照预案各自建立应急救援组织或配备人员。'},
{id:'fg34',s:'fg',n:'安全生产许可证',imp:1,tip:'安全生产许可证有效期为3年；需要延期的，应于期满前3个月向原发证机关办理延期手续。有效期内严格遵守法律法规、未发生死亡事故的，经原发证机关同意，不再审查，有效期延期3年。'},
{id:'fg35',s:'fg',n:'建设单位的安全责任',imp:0,tip:'建设单位不得对施工单位提出不符合法律法规和强制性标准的要求，不得压缩合同约定的工期；应将拆除工程发包给有相应资质的施工单位，并在拆除工程施工15日前，将有关资料报送建设行政主管部门或其他有关部门备案。'},
{id:'fg36',s:'fg',n:'工伤保险与意外伤害保险',imp:1,tip:'职工发生事故伤害，用人单位应自事故伤害发生之日起30日内提出工伤认定申请；用人单位未提出的，工伤职工或其近亲属、工会组织在事故伤害发生之日起1年内可直接提出。在工作时间和工作岗位突发疾病死亡或在48小时之内经抢救无效死亡的，视同工伤。《建筑法》规定建筑施工企业应依法为职工参加工伤保险，鼓励为从事危险作业的职工办理意外伤害保险。'},
{id:'fg37',s:'fg',n:'民事诉讼证据与审理期限',imp:0,tip:'证据种类：当事人陈述、书证、物证、视听资料、电子数据、证人证言、鉴定意见、勘验笔录。一审普通程序审限6个月，简易程序3个月；二审对判决的上诉审限3个月。'},
{id:'fg38',s:'fg',n:'调解与和解',imp:0,tip:'经人民调解委员会调解达成的调解协议，双方可自调解协议生效之日起30日内共同向人民法院申请司法确认，确认有效后一方拒绝履行的，对方可申请强制执行。'},
{id:'fg39',s:'fg',n:'必须招标的范围和规模标准',imp:1,tip:'依法必须招标的项目，达到以下标准之一的必须招标：施工单项合同估算价400万元以上；重要设备、材料等货物采购单项合同估算价200万元以上；勘察、设计、监理等服务采购单项合同估算价100万元以上。'},
{id:'fg40',s:'fg',n:'招标方式与可以不招标的情形',imp:1,tip:'国有资金占控股或主导地位的依法必须招标的项目应公开招标；技术复杂、有特殊要求或受自然环境限制只有少量潜在投标人可选，或公开招标费用占合同金额比例过大的，可邀请招标，邀请不少于3个。可以不招标：需要采用不可替代的专利或专有技术；采购人依法能够自行建设、生产或提供；需要向原中标人采购工程、货物或服务，否则将影响施工或功能配套要求等。'},
{id:'fg41',s:'fg',n:'评标委员会与确定中标人',imp:1,tip:'评标委员会由招标人代表和技术、经济方面的专家组成，成员为5人以上单数，其中技术、经济专家不少于成员总数的2/3。评标委员会推荐的中标候选人应不超过3个，并标明排序。国有资金占控股或主导地位的依法必须招标项目，招标人应确定排名第一的中标候选人为中标人。'},
{id:'fg42',s:'fg',n:'投标文件的撤回与撤销',imp:0,tip:'投标截止时间前投标人书面撤回投标文件的，招标人应自收到撤回通知之日起5日内退还投标保证金；投标截止后投标人撤销投标文件的，招标人可以不退还投标保证金。'},
{id:'fg43',s:'fg',n:'串通投标的认定',imp:1,tip:'视为投标人相互串通：不同投标人的投标文件由同一单位或个人编制；委托同一单位或个人办理投标事宜；投标文件载明的项目管理成员为同一人；投标文件异常一致或投标报价呈规律性差异；投标文件相互混装；投标保证金从同一单位或个人账户转出。'},
{id:'fg44',s:'fg',n:'工程监理制度',imp:0,tip:'必须实行监理：国家重点建设工程；大中型公用事业工程；成片开发建设的住宅小区工程；利用外国政府或国际组织贷款、援助资金的工程；国家规定必须实行监理的其他工程。工程监理单位与承包单位串通，为承包单位谋取非法利益，给建设单位造成损失的，应当与承包单位承担连带赔偿责任。'},
{id:'fg45',s:'fg',n:'设计单位的质量责任',imp:0,tip:'设计单位在设计文件中选用的建筑材料、构配件和设备，应当注明规格、型号、性能等技术指标；除有特殊要求的建筑材料、专用设备、工艺生产线等外，不得指定生产厂、供应商。设计单位应当参与建设工程质量事故分析。'},
{id:'fg46',s:'fg',n:'建设工程档案与文物保护',imp:0,tip:'建设单位应在工程竣工验收后3个月内，向城建档案馆报送一套符合规定的建设工程档案。施工中发现文物，应保护现场并立即报告当地文物行政部门，文物行政部门接到报告后，如无特殊情况，应在24小时内赶赴现场，并在7日内提出处理意见。'},
{id:'fg47',s:'fg',n:'法律责任（行政与刑事）',imp:1,tip:'行政处罚种类包括警告、通报批评，罚款、没收违法所得，暂扣许可证件、降低资质等级、吊销许可证件，限制开展生产经营活动、责令停产停业、责令关闭、限制从业，行政拘留等。刑事：工程重大安全事故罪（建设、设计、施工、监理单位违反国家规定降低工程质量标准，造成重大安全事故）；重大责任事故罪（在生产作业中违反有关安全管理规定发生重大伤亡事故）；重大劳动安全事故罪（安全生产设施或安全生产条件不符合国家规定）。'}
);
QB.push(
{id:'fg101',kp:'fg25',t:1,d:1,q:'关于施工企业项目经理部的说法，正确的是（ ）。',o:['项目经理部具备法人资格','项目经理部行为的法律后果由施工企业承担','项目经理部可以独立对外承担民事责任','项目经理部是常设机构'],a:'B',e:'项目经理部是施工企业为完成特定工程设立的一次性组织机构，不具备法人资格，其行为的法律后果由施工企业承担。'},
{id:'fg102',kp:'fg25',t:1,d:2,q:'某项目经理部以自己的名义与材料供应商签订采购合同，后因拖欠货款被起诉，承担付款责任的应是（ ）。',o:['项目经理个人','项目经理部','项目经理部所属的施工企业','建设单位'],a:'C',e:'项目经理部不具备法人资格，其对外行为的法律后果由施工企业承担。'},
{id:'fg103',kp:'fg26',t:1,d:1,q:'当事人在保证合同中对保证方式没有约定或者约定不明确的，按照（ ）承担保证责任。',o:['连带责任保证','一般保证','按份保证','最高额保证'],a:'B',e:'《民法典》规定，当事人对保证方式没有约定或约定不明确的，按照一般保证承担保证责任。（原《担保法》规定为连带责任保证，注意新旧区别。）'},
{id:'fg104',kp:'fg26',t:1,d:2,q:'债权人与保证人没有约定保证期间的，保证期间为主债务履行期限届满之日起（ ）。',o:['3个月','6个月','1年','2年'],a:'B',e:'没有约定或约定不明确的，保证期间为主债务履行期限届满之日起6个月。'},
{id:'fg105',kp:'fg26',t:1,d:2,q:'一般保证的保证人在主合同纠纷未经审判或者仲裁，并就债务人财产依法强制执行仍不能履行债务前，有权拒绝向债权人承担保证责任，这种权利称为（ ）。',o:['不安抗辩权','先诉抗辩权','同时履行抗辩权','代位权'],a:'B',e:'一般保证人享有先诉抗辩权；连带责任保证人不享有该权利。'},
{id:'fg106',kp:'fg27',t:1,d:2,q:'施工合同约定发包人先支付预付款，承包人再进场施工。发包人有确切证据证明承包人已丧失商业信誉，发包人可以行使（ ）。',o:['同时履行抗辩权','先履行抗辩权','不安抗辩权','撤销权'],a:'C',e:'应当先履行债务的一方有确切证据证明对方丧失商业信誉等情形的，可以行使不安抗辩权，中止履行，但应及时通知对方。'},
{id:'fg107',kp:'fg27',t:1,d:2,q:'合同约定甲方先付款、乙方后交货。甲方到期未付款，乙方因此拒绝交货，乙方行使的是（ ）。',o:['同时履行抗辩权','先履行抗辩权','不安抗辩权','解除权'],a:'B',e:'当事人互负债务有先后履行顺序，应先履行一方未履行的，后履行一方有权拒绝其履行请求，这是先履行抗辩权（后履行抗辩权）。'},
{id:'fg108',kp:'fg27',t:1,d:3,q:'关于不安抗辩权的说法，正确的是（ ）。',o:['后履行一方享有不安抗辩权','行使不安抗辩权中止履行时，无需通知对方','对方提供适当担保的，应当恢复履行','只要怀疑对方履约能力即可行使'],a:'C',e:'不安抗辩权由应先履行一方享有，须有确切证据，中止履行应及时通知对方；对方提供适当担保的，应当恢复履行。对方在合理期限内未恢复履行能力且未提供担保的，可以解除合同。'},
{id:'fg109',kp:'fg28',t:1,d:2,q:'债权人将合同债权转让给第三人，未通知债务人，该转让（ ）。',o:['无效','对债务人不发生效力','须经债务人同意才生效','对债权人不发生效力'],a:'B',e:'债权转让无需债务人同意，但应当通知债务人；未经通知，该转让对债务人不发生效力。'},
{id:'fg110',kp:'fg28',t:1,d:1,q:'债务人将合同债务转移给第三人，应当（ ）。',o:['通知债权人','经债权人同意','经公证','报主管部门备案'],a:'B',e:'债务人将债务的全部或部分转移给第三人的，应当经债权人同意。'},
{id:'fg111',kp:'fg29',t:2,d:2,q:'根据《民法典》，当事人可以解除合同的法定情形有（ ）。',o:['因不可抗力致使不能实现合同目的','在履行期限届满前，一方明确表示不履行主要债务','一方迟延履行主要债务，经催告后在合理期限内仍未履行','一方迟延履行债务致使不能实现合同目的','对方的履行存在轻微瑕疵'],a:'ABCD',e:'轻微瑕疵不影响合同目的实现，不构成法定解除事由。'},
{id:'fg112',kp:'fg29',t:1,d:3,q:'法律没有规定或者当事人没有约定解除权行使期限的，自解除权人知道或者应当知道解除事由之日起（ ）内不行使，该权利消灭。',o:['3个月','6个月','1年','3年'],a:'C',e:'《民法典》第564条规定为1年；经对方催告后在合理期限内不行使的，该权利也消灭。'},
{id:'fg113',kp:'fg30',t:1,d:2,q:'下列情形中，发包人可以解除施工合同的是（ ）。',o:['承包人将承包的工程转包','承包人的工期延误了3天','承包人更换了一名施工员','承包人未参加一次工地例会'],a:'A',e:'承包人将建设工程转包、违法分包的，发包人可以解除合同。'},
{id:'fg114',kp:'fg30',t:2,d:3,q:'根据最高人民法院司法解释，因发包人的下列过错造成建设工程质量缺陷的，发包人应当承担过错责任的有（ ）。',o:['提供的设计有缺陷','提供的建筑材料不符合强制性标准','直接指定分包人分包专业工程','指定购买的建筑构配件不符合强制性标准','承包人自行采购的钢筋不合格'],a:'ABCD',e:'承包人自行采购材料不合格造成的质量缺陷由承包人负责（E）。承包人有过错的，也应承担相应的过错责任。'},
{id:'fg115',kp:'fg31',t:1,d:2,q:'当事人对欠付工程价款利息计付标准有约定但对付款时间没有约定，建设工程已实际交付的，利息从（ ）起计付。',o:['工程开工之日','建设工程交付之日','提交竣工结算文件之日','当事人起诉之日'],a:'B',e:'已实际交付的，为交付之日；没有交付的，为提交竣工结算文件之日；未交付且未结算的，为当事人起诉之日。'},
{id:'fg116',kp:'fg31',t:1,d:3,q:'某工程未交付，工程价款也未结算，当事人对付款时间没有约定，则欠付工程款的利息应自（ ）起计付。',o:['竣工验收合格之日','合同约定的竣工日期','提交竣工结算文件之日','当事人起诉之日'],a:'D',e:'建设工程未交付、工程价款也未结算的，以当事人起诉之日为应付款时间。'},
{id:'fg117',kp:'fg32',t:1,d:2,q:'根据《标准化法》，下列标准中，属于强制性标准的是（ ）。',o:['强制性国家标准','行业标准','地方标准','团体标准'],a:'A',e:'国家标准分为强制性标准和推荐性标准；行业标准、地方标准是推荐性标准；团体标准、企业标准由市场主体自主制定。'},
{id:'fg118',kp:'fg32',t:1,d:2,q:'关于推荐性标准的说法，正确的是（ ）。',o:['推荐性标准任何情况下都没有约束力','推荐性标准被合同约定采用后，对合同当事人具有约束力','推荐性标准的技术要求不得低于强制性标准，但无需执行','推荐性标准只适用于政府投资项目'],a:'B',e:'推荐性标准国家鼓励采用；一旦在合同中约定采用，即成为合同义务，对当事人具有约束力。'},
{id:'fg119',kp:'fg33',t:1,d:2,q:'实行施工总承包的建设工程，生产安全事故应急救援预案应由（ ）统一组织编制。',o:['建设单位','总承包单位','分包单位','监理单位'],a:'B',e:'实行施工总承包的，由总承包单位统一组织编制建设工程生产安全事故应急救援预案，总承包单位和分包单位按照应急救援预案，各自建立应急救援组织或配备应急救援人员。'},
{id:'fg120',kp:'fg34',t:1,d:1,q:'安全生产许可证的有效期为（ ）年。',o:['1','2','3','5'],a:'C',e:'安全生产许可证有效期为3年。'},
{id:'fg121',kp:'fg34',t:1,d:2,q:'安全生产许可证有效期满需要延期的，企业应当于期满前（ ）向原发证机关办理延期手续。',o:['1个月','2个月','3个月','6个月'],a:'C',e:'应于期满前3个月办理延期手续。有效期内严格遵守法律法规、未发生死亡事故的，经原发证机关同意，不再审查，有效期延期3年。'},
{id:'fg122',kp:'fg35',t:1,d:2,q:'建设单位应当在拆除工程施工（ ）日前，将拆除施工单位资质等级证明、拆除施工组织方案等资料报送建设行政主管部门或其他有关部门备案。',o:['7','10','15','30'],a:'C',e:'《建设工程安全生产管理条例》规定为15日前。'},
{id:'fg123',kp:'fg35',t:1,d:1,q:'根据《建设工程安全生产管理条例》，建设单位不得压缩（ ）。',o:['定额工期','合同约定的工期','施工单位的计划工期','监理单位确认的工期'],a:'B',e:'建设单位不得对勘察、设计、施工、监理等单位提出不符合法律法规和强制性标准的要求，不得压缩合同约定的工期。'},
{id:'fg124',kp:'fg36',t:1,d:1,q:'职工发生事故伤害，所在单位应当自事故伤害发生之日起（ ）内，向统筹地区社会保险行政部门提出工伤认定申请。',o:['15日','30日','60日','1年'],a:'B',e:'用人单位应在30日内提出（遇特殊情况经批准可适当延长）；用人单位未提出的，工伤职工或其近亲属、工会组织可在1年内直接提出。'},
{id:'fg125',kp:'fg36',t:1,d:2,q:'职工在工作时间和工作岗位突发疾病，在（ ）之内经抢救无效死亡的，视同工伤。',o:['24小时','48小时','72小时','7日'],a:'B',e:'《工伤保险条例》第15条：在工作时间和工作岗位，突发疾病死亡或者在48小时之内经抢救无效死亡的，视同工伤。'},
{id:'fg126',kp:'fg36',t:1,d:2,q:'根据《建筑法》，关于建筑施工企业办理保险的说法，正确的是（ ）。',o:['应当为从事危险作业的职工办理意外伤害保险','鼓励为从事危险作业的职工办理意外伤害保险','工伤保险可以由意外伤害保险替代','意外伤害保险费由职工个人支付'],a:'B',e:'《建筑法》第48条：建筑施工企业应当依法为职工参加工伤保险缴纳工伤保险费；鼓励企业为从事危险作业的职工办理意外伤害保险，支付保险费。工伤保险是强制的，意外伤害保险是鼓励的。'},
{id:'fg127',kp:'fg37',t:1,d:2,q:'人民法院适用普通程序审理的民事案件，应当在立案之日起（ ）内审结。',o:['3个月','6个月','1年','30日'],a:'B',e:'普通程序审限6个月，有特殊情况需要延长的，经本院院长批准可以延长6个月。简易程序审限3个月。'},
{id:'fg128',kp:'fg37',t:1,d:2,q:'下列证据中，属于电子数据的是（ ）。',o:['施工合同原件','施工现场的录像带','工程项目部人员之间的微信聊天记录','鉴定机构出具的鉴定报告'],a:'C',e:'电子数据包括电子邮件、即时通信信息（如微信、短信）、电子交易记录等。合同原件为书证；录像带传统上归为视听资料；鉴定报告为鉴定意见。'},
{id:'fg129',kp:'fg38',t:1,d:2,q:'经人民调解委员会调解达成调解协议后，双方当事人认为有必要的，可以自调解协议生效之日起（ ）内共同向人民法院申请司法确认。',o:['15日','30日','60日','6个月'],a:'B',e:'《人民调解法》规定为30日内。经司法确认有效的，一方拒绝履行或未全部履行的，对方可申请人民法院强制执行。'},
{id:'fg130',kp:'fg39',t:1,d:1,q:'根据《必须招标的工程项目规定》，依法必须招标的项目，施工单项合同估算价在（ ）以上的，必须招标。',o:['100万元','200万元','400万元','3000万元'],a:'C',e:'施工单项合同估算价400万元以上；重要设备、材料采购200万元以上；勘察、设计、监理等服务100万元以上。'},
{id:'fg131',kp:'fg39',t:1,d:2,q:'某依法必须招标的项目中，监理服务的单项合同估算价为150万元，重要材料采购的单项合同估算价为180万元，则（ ）。',o:['监理和材料采购都必须招标','监理必须招标，材料采购可以不招标','材料采购必须招标，监理可以不招标','都可以不招标'],a:'B',e:'监理服务达到100万元即须招标；重要材料采购须达到200万元，180万元未达标准。'},
{id:'fg132',kp:'fg40',t:1,d:2,q:'下列情形中，可以邀请招标的是（ ）。',o:['国有资金控股的大型项目','技术复杂、有特殊要求，只有少量潜在投标人可供选择','招标人希望缩短招标时间','招标人与某投标人长期合作'],a:'B',e:'技术复杂、有特殊要求或受自然环境限制只有少量潜在投标人可供选择的，或采用公开招标方式的费用占合同金额比例过大的，可以邀请招标。'},
{id:'fg133',kp:'fg40',t:1,d:2,q:'采用邀请招标方式的，招标人应当向（ ）个以上具备承担招标项目能力、资信良好的特定法人或其他组织发出投标邀请书。',o:['2','3','5','7'],a:'B',e:'《招标投标法》规定邀请招标应向3个以上特定的法人或其他组织发出投标邀请书。'},
{id:'fg134',kp:'fg40',t:2,d:3,q:'根据《招标投标法实施条例》，有下列情形之一的，可以不进行招标的有（ ）。',o:['需要采用不可替代的专利或者专有技术','采购人依法能够自行建设、生产或者提供','需要向原中标人采购工程，否则将影响施工或者功能配套要求','施工主要技术采用特定的专利，且潜在投标人只有3家','招标人认为招标费用过高'],a:'ABC',e:'D项有3家潜在投标人，可以邀请招标但不属于可以不招标的情形；E项不是法定情形。'},
{id:'fg135',kp:'fg41',t:1,d:1,q:'依法必须进行招标的项目，评标委员会成员人数为（ ）以上单数，其中技术、经济等方面的专家不得少于成员总数的（ ）。',o:['3人；1/2','5人；2/3','5人；1/2','7人；2/3'],a:'B',e:'评标委员会成员为5人以上单数，技术、经济专家不少于成员总数的2/3。'},
{id:'fg136',kp:'fg41',t:1,d:2,q:'国有资金占控股或者主导地位的依法必须进行招标的项目，招标人应当确定（ ）为中标人。',o:['投标报价最低的投标人','排名第一的中标候选人','招标人认为最合适的中标候选人','评标委员会投票最多的投标人'],a:'B',e:'应确定排名第一的中标候选人为中标人；排名第一的放弃中标、因不可抗力不能履行、未按要求提交履约保证金或被查实存在影响中标结果的违法行为的，招标人可按排序依次确定其他候选人，也可重新招标。'},
{id:'fg137',kp:'fg42',t:1,d:2,q:'投标人在投标截止时间前书面撤回已提交的投标文件，招标人应当自收到投标人书面撤回通知之日起（ ）日内退还已收取的投标保证金。',o:['3','5','7','10'],a:'B',e:'投标截止前撤回的，招标人应在5日内退还投标保证金；投标截止后撤销投标文件的，招标人可以不退还投标保证金。'},
{id:'fg138',kp:'fg42',t:1,d:2,q:'投标截止时间后，投标人撤销其投标文件的，招标人（ ）。',o:['应当全额退还投标保证金','可以不退还投标保证金','应当退还投标保证金的一半','应当退还投标保证金并支付利息'],a:'B',e:'投标截止后投标人撤销投标文件的，招标人可以不退还投标保证金。'},
{id:'fg139',kp:'fg43',t:2,d:2,q:'根据《招标投标法实施条例》，下列情形中，视为投标人相互串通投标的有（ ）。',o:['不同投标人的投标文件由同一单位编制','不同投标人委托同一单位办理投标事宜','不同投标人的投标文件载明的项目管理成员为同一人','不同投标人的投标保证金从同一单位的账户转出','不同投标人的投标报价相差较大'],a:'ABCD',e:'此外，投标文件异常一致或投标报价呈规律性差异、投标文件相互混装也视为串通投标。报价相差较大属正常现象。'},
{id:'fg140',kp:'fg44',t:1,d:2,q:'下列工程中，不属于必须实行监理的是（ ）。',o:['国家重点建设工程','大中型公用事业工程','成片开发建设的住宅小区工程','私人投资建设的小型自用仓库'],a:'D',e:'必须实行监理的包括国家重点建设工程、大中型公用事业工程、成片开发建设的住宅小区工程、利用外国政府或国际组织贷款援助资金的工程等。'},
{id:'fg141',kp:'fg44',t:1,d:2,q:'工程监理单位与承包单位串通，为承包单位谋取非法利益，给建设单位造成损失的，应当（ ）。',o:['由监理单位单独承担赔偿责任','由承包单位单独承担赔偿责任','与承包单位承担连带赔偿责任','按过错比例承担按份责任'],a:'C',e:'《建筑法》规定，工程监理单位与承包单位串通，为承包单位谋取非法利益，给建设单位造成损失的，应当与承包单位承担连带赔偿责任。'},
{id:'fg142',kp:'fg45',t:1,d:2,q:'关于设计单位选用建筑材料的说法，正确的是（ ）。',o:['设计单位可以指定生产厂和供应商','设计单位不得注明材料的规格型号','除有特殊要求的建筑材料、专用设备、工艺生产线等外，设计单位不得指定生产厂、供应商','设计单位应当为建设单位采购材料'],a:'C',e:'设计单位选用的材料设备应注明规格、型号、性能等技术指标，其质量要求必须符合国家标准；除有特殊要求的外，不得指定生产厂、供应商。'},
{id:'fg143',kp:'fg46',t:1,d:2,q:'建设单位应当在工程竣工验收后（ ）内，向城建档案馆报送一套符合规定的建设工程档案。',o:['15日','1个月','3个月','6个月'],a:'C',e:'建设单位应在工程竣工验收后3个月内报送建设工程档案。'},
{id:'fg144',kp:'fg46',t:1,d:2,q:'施工中发现文物，施工单位应保护现场并立即报告当地文物行政部门。文物行政部门接到报告后，如无特殊情况，应当在（ ）内赶赴现场，并在（ ）内提出处理意见。',o:['12小时；3日','24小时；7日','48小时；7日','24小时；15日'],a:'B',e:'《文物保护法》规定为24小时内赶赴现场，7日内提出处理意见。'},
{id:'fg145',kp:'fg47',t:1,d:2,q:'建设单位、设计单位、施工单位、工程监理单位违反国家规定，降低工程质量标准，造成重大安全事故的，构成（ ）。',o:['重大责任事故罪','工程重大安全事故罪','重大劳动安全事故罪','强令违章冒险作业罪'],a:'B',e:'工程重大安全事故罪的主体是建设、设计、施工、监理单位，行为是违反国家规定降低工程质量标准造成重大安全事故。'},
{id:'fg146',kp:'fg47',t:1,d:2,q:'安全生产设施或者安全生产条件不符合国家规定，因而发生重大伤亡事故或者造成其他严重后果的，对直接负责的主管人员和其他直接责任人员，应以（ ）追究刑事责任。',o:['重大责任事故罪','工程重大安全事故罪','重大劳动安全事故罪','玩忽职守罪'],a:'C',e:'这是重大劳动安全事故罪的构成要件。重大责任事故罪是在生产、作业中违反有关安全管理规定发生重大伤亡事故。'},
{id:'fg147',kp:'fg47',t:2,d:2,q:'下列法律责任中，属于行政处罚的有（ ）。',o:['罚款','吊销许可证件','降低资质等级','赔偿损失','责令停产停业'],a:'ABCE',e:'赔偿损失属于民事责任承担方式，不是行政处罚。'}
);

// 建设工程项目管理
KP.push(
{id:'gl01',s:'gl',n:'项目管理的类型与目标',imp:0,tip:'业主方项目管理是建设项目管理的核心；施工方项目管理目标包括施工的安全、成本、进度和质量目标；项目管理的核心任务是项目的目标控制。'},
{id:'gl02',s:'gl',n:'组织结构模式',imp:1,tip:'职能组织：多个矛盾的指令源；线性组织：唯一指令源，大型组织指令路径过长；矩阵组织：两个指令源（纵向职能部门与横向项目部门），适用于大型组织。'},
{id:'gl03',s:'gl',n:'组织工具',imp:1,tip:'项目结构图：反映项目的组成（工作分解）；组织结构图：反映组织系统中各工作部门之间的指令关系；工作流程图：反映工作间的逻辑关系，是动态关系；工作任务分工表、管理职能分工表。'},
{id:'gl04',s:'gl',n:'施工组织设计的编制与审批',imp:1,tip:'施工组织总设计由总承包单位技术负责人审批；单位工程施工组织设计由施工单位技术负责人或其授权技术人员审批；施工方案由项目技术负责人审批；重点、难点分部（分项）工程施工方案由施工单位技术部门组织专家评审，施工单位技术负责人批准。'},
{id:'gl05',s:'gl',n:'动态控制与纠偏措施',imp:1,tip:'纠偏措施：组织措施（调整人员、任务分工、管理职能分工、工作流程）、管理措施（含合同措施，如调整管理方法、改变承发包模式）、经济措施（落实资金、激励）、技术措施（调整设计、改变施工方法和机械）。组织措施最重要。'},
{id:'gl06',s:'gl',n:'项目经理与项目管理责任',imp:0,tip:'项目管理目标责任书由企业法定代表人或其授权人与项目经理协商制定；项目经理是企业法定代表人在项目上的代表人，在授权范围内行使权力。'},
{id:'gl07',s:'gl',n:'项目风险管理',imp:0,tip:'风险类型：组织风险、经济与管理风险、工程环境风险、技术风险。风险量=损失程度×发生概率。风险应对：规避、减轻、自留、转移（保险、担保属于转移）。'},
{id:'gl08',s:'gl',n:'工程监理',imp:0,tip:'未经监理工程师签字，材料设备不得使用，施工单位不得进行下一道工序；未经总监理工程师签字，建设单位不拨付工程款、不进行竣工验收。监理工作形式：旁站、巡视、平行检验。'},
{id:'gl09',s:'gl',n:'施工成本管理与因素分析法',imp:1,tip:'成本管理任务：成本计划、成本控制、成本核算、成本分析、成本考核。因素分析法（连环置换法）按排序依次替换，每次替换的差额即该因素的影响。'},
{id:'gl10',s:'gl',n:'赢得值（挣值）法',imp:1,tip:'BCWS 计划工作预算费用；BCWP 已完工作预算费用（赢得值）；ACWP 已完工作实际费用。CV=BCWP−ACWP（负为超支）；SV=BCWP−BCWS（负为拖后）；CPI=BCWP/ACWP；SPI=BCWP/BCWS。'},
{id:'gl11',s:'gl',n:'网络计划时间参数',imp:1,tip:'TF=LF−EF=LS−ES；FF=紧后工作ES最小值−本工作EF。关键工作是总时差最小的工作；关键线路是总持续时间最长的线路，可能不止一条，执行中可能转移。'},
{id:'gl12',s:'gl',n:'流水施工',imp:1,tip:'固定节拍：T=(m+n−1)t+ΣG+ΣZ−ΣC；加快的成倍节拍：K=各节拍最大公约数，专业队数 bj=tj/K；非节奏流水：累加数列错位相减取大差确定流水步距。时间参数包括流水节拍、流水步距、工期。'},
{id:'gl13',s:'gl',n:'质量管理原理',imp:0,tip:'全面质量管理“三全”：全面、全过程、全员。PDCA：计划、实施、检查、处置。影响质量的因素：人、机械、材料、方法、环境（4M1E）。'},
{id:'gl14',s:'gl',n:'施工质量验收的组织',imp:1,tip:'检验批：专业监理工程师组织施工单位项目专业质量检查员、专业工长；分项：专业监理工程师组织项目专业技术负责人；分部：总监理工程师组织施工单位项目负责人和项目技术、质量负责人；单位工程竣工验收：建设单位项目负责人组织。'},
{id:'gl15',s:'gl',n:'工程质量事故分级与处理',imp:1,tip:'特别重大：死亡30人以上、重伤100人以上或直接经济损失1亿元以上；重大：10~30人、50~100人或5000万~1亿元；较大：3~10人、10~50人或1000万~5000万元；一般：3人以下、10人以下或100万~1000万元（以上含本数，以下不含）。处理方法：返修、加固、返工、限制使用、不作处理、报废。'},
{id:'gl16',s:'gl',n:'安全管理制度与事故处理',imp:1,tip:'三级安全教育：公司（企业）级、项目级、班组级。事故处理“四不放过”：原因未查清不放过、责任人员未处理不放过、有关人员未受到教育不放过、整改措施未落实不放过。'},
{id:'gl17',s:'gl',n:'合同计价方式',imp:1,tip:'固定总价合同承包人风险大；单价合同按实际完成工程量结算，风险合理分担；成本加酬金合同业主风险大，适用于紧急工程、工程内容不明确等情况。'},
{id:'gl18',s:'gl',n:'施工合同文件与索赔程序',imp:1,tip:'2017版施工合同示范文本解释顺序：合同协议书→中标通知书→投标函及附录→专用条款及附件→通用条款→技术标准和要求→图纸→已标价工程量清单或预算书→其他。索赔：知道或应当知道事件后28天内递交索赔意向通知书，再28天内递交索赔报告。'},
{id:'gl19',s:'gl',n:'工程担保',imp:0,tip:'投标担保、履约担保、预付款担保由承包人（投标人）提供；支付担保由发包人提供。'},
{id:'gl20',s:'gl',n:'施工现场文明施工与环境保护',imp:0,tip:'市区主要路段围挡高度不低于2.5m，一般路段不低于1.8m；现场严禁焚烧各类废弃物；土方、易扬尘材料应覆盖。'}
);
QB.push(
{id:'gl001',kp:'gl01',t:1,d:1,q:'在建设工程项目管理中，处于核心地位的是（ ）的项目管理。',o:['施工方','设计方','业主方','供货方'],a:'C',e:'业主方是建设工程项目实施过程（生产过程）的总集成者和总组织者，业主方的项目管理是管理的核心。'},
{id:'gl002',kp:'gl01',t:2,d:1,q:'施工方项目管理的目标包括施工的（ ）目标。',o:['安全','成本','进度','质量','投资'],a:'ABCD',e:'施工方项目管理的目标包括施工的安全管理目标、成本目标、进度目标和质量目标。“投资目标”是业主方的目标。'},
{id:'gl003',kp:'gl02',t:1,d:1,q:'在（ ）组织结构中，每一个工作部门只有一个直接的上级部门，即只有唯一一个指令源。',o:['职能','线性','矩阵','事业部'],a:'B',e:'线性组织结构中每个部门只有唯一的指令源，避免矛盾指令；缺点是大型组织指令路径过长。'},
{id:'gl004',kp:'gl02',t:1,d:2,q:'关于矩阵组织结构的说法，正确的是（ ）。',o:['每一个工作部门只有一个指令源','适用于小型组织系统','每一项纵向和横向交汇的工作有两个指令源','指令路径较长，可能造成组织运行困难'],a:'C',e:'矩阵组织中，纵向职能部门和横向项目部门交汇处的工作有两个指令源，适用于大型组织系统。指令路径长是线性组织在大型组织中的缺点。'},
{id:'gl005',kp:'gl02',t:1,d:2,q:'某企业组织结构中，各职能部门可以在其职能范围内直接向下级部门下达指令，下级部门因此可能接到多个相互矛盾的指令。该组织结构模式是（ ）。',o:['线性组织结构','职能组织结构','矩阵组织结构','项目组织结构'],a:'B',e:'职能组织结构中每个职能部门可根据其管理职能对下级下达指令，因此会产生多个矛盾的指令源。'},
{id:'gl006',kp:'gl03',t:1,d:1,q:'反映一个组织系统中各子系统或各工作部门之间指令关系的组织工具是（ ）。',o:['项目结构图','组织结构图','工作流程图','合同结构图'],a:'B',e:'组织结构图反映指令关系；项目结构图反映项目由哪些子项目组成；合同结构图反映合同关系。'},
{id:'gl007',kp:'gl03',t:1,d:2,q:'通过树状图的方式对一个项目的结构进行逐层分解，以反映组成该项目的所有工作任务的组织工具是（ ）。',o:['组织结构图','项目结构图','工作任务分工表','管理职能分工表'],a:'B',e:'项目结构图（WBS）通过树状图逐层分解项目的工作任务。'},
{id:'gl008',kp:'gl03',t:1,d:2,q:'下列组织工具中，反映组织系统中动态关系的是（ ）。',o:['项目结构图','组织结构图','工作流程图','工作任务分工表'],a:'C',e:'工作流程组织反映一个组织系统中各项工作之间的逻辑关系，是一种动态关系；组织结构模式和组织分工反映的是静态组织关系。'},
{id:'gl009',kp:'gl04',t:1,d:1,q:'根据《建筑施工组织设计规范》，施工组织总设计应由（ ）审批。',o:['总承包单位技术负责人','项目经理','总监理工程师','建设单位项目负责人'],a:'A',e:'施工组织总设计应由总承包单位技术负责人审批。'},
{id:'gl010',kp:'gl04',t:1,d:2,q:'根据《建筑施工组织设计规范》，一般分部（分项）工程施工方案应由（ ）审批。',o:['施工单位技术负责人','项目技术负责人','项目经理','专业监理工程师'],a:'B',e:'施工方案应由项目技术负责人审批；重点、难点分部（分项）工程和专项工程施工方案应由施工单位技术部门组织相关专家评审，施工单位技术负责人批准。'},
{id:'gl011',kp:'gl04',t:2,d:2,q:'单位工程施工组织设计的主要内容包括（ ）。',o:['工程概况','施工部署','施工进度计划','施工现场平面布置','项目投资估算'],a:'ABCD',e:'单位工程施工组织设计一般包括编制依据、工程概况、施工部署、施工进度计划、施工准备与资源配置计划、主要施工方案、施工现场平面布置等。投资估算不属于施工组织设计内容。'},
{id:'gl012',kp:'gl05',t:1,d:1,q:'在项目目标动态控制的纠偏措施中，调整项目管理的任务分工和工作流程属于（ ）。',o:['组织措施','管理措施','经济措施','技术措施'],a:'A',e:'调整管理职能分工、任务分工、工作流程组织和项目管理班子人员等都属于组织措施。'},
{id:'gl013',kp:'gl05',t:1,d:2,q:'为加快施工进度，施工单位将原来的现浇混凝土方案改为预制装配方案，该纠偏措施属于（ ）。',o:['组织措施','管理措施','经济措施','技术措施'],a:'D',e:'改变施工方法、调整设计、改变施工机具等属于技术措施。'},
{id:'gl014',kp:'gl05',t:2,d:2,q:'下列纠偏措施中，属于管理措施（包括合同措施）的有（ ）。',o:['调整进度管理的方法和手段','改变施工管理和强化合同管理','落实加快工程施工进度所需的资金','调整项目管理班子人员','改变承发包模式'],a:'ABE',e:'落实资金属于经济措施；调整项目管理班子人员属于组织措施。'},
{id:'gl015',kp:'gl06',t:1,d:1,q:'项目管理目标责任书应由（ ）与项目经理协商制定。',o:['建设单位项目负责人','企业法定代表人或其授权人','总监理工程师','项目技术负责人'],a:'B',e:'项目管理目标责任书应在项目实施之前，由法定代表人或其授权人与项目经理协商制定。'},
{id:'gl016',kp:'gl07',t:1,d:2,q:'施工单位为施工现场的机械设备投保财产险，这种风险应对策略属于（ ）。',o:['风险规避','风险减轻','风险自留','风险转移'],a:'D',e:'投保是将风险转移给保险公司，属于风险转移。担保也是常见的风险转移方式。'},
{id:'gl017',kp:'gl07',t:1,d:2,q:'下列建设工程项目风险中，属于技术风险的是（ ）。',o:['承包方管理人员的能力不足','工程设计文件存在缺陷','工程资金供应条件变化','地质条件不良'],a:'B',e:'技术风险包括工程设计文件、工程施工方案、工程物资、工程机械等方面的风险。A属于组织风险，C属于经济与管理风险，D属于工程环境风险。'},
{id:'gl018',kp:'gl08',t:1,d:1,q:'根据《建设工程质量管理条例》，未经（ ）签字，建设单位不拨付工程款，不进行竣工验收。',o:['专业监理工程师','总监理工程师','建设单位项目负责人','施工单位项目经理'],a:'B',e:'未经监理工程师签字，建筑材料、构配件和设备不得使用，施工单位不得进行下一道工序；未经总监理工程师签字，建设单位不拨付工程款，不进行竣工验收。'},
{id:'gl019',kp:'gl08',t:1,d:2,q:'监理人员在关键部位、关键工序施工过程中进行的全过程现场跟班监督活动称为（ ）。',o:['巡视','旁站','平行检验','见证取样'],a:'B',e:'旁站是对关键部位、关键工序的施工质量进行的监督活动；巡视是定期或不定期的检查；平行检验是监理利用一定检查检测手段独立进行的检验。'},
{id:'gl020',kp:'gl09',t:1,d:1,q:'施工成本管理的任务中，（ ）是在成本形成过程中，对生产经营所消耗的人力、物质资源和费用开支进行指导、监督、调节和限制。',o:['成本计划','成本控制','成本核算','成本考核'],a:'B',e:'成本控制贯穿于项目从投标到竣工验收的全过程，是成本管理的重要环节。'},
{id:'gl021',kp:'gl09',t:1,d:3,q:'某工程商品混凝土目标产量500m³、单价700元/m³、损耗率4%；实际产量520m³、单价720元/m³、损耗率2.5%。按产量、单价、损耗率顺序用因素分析法，单价提高使成本增加（ ）元。',o:['10400','10816','14560','19760'],a:'B',e:'目标成本500×700×1.04=364000；替换产量：520×700×1.04=378560；替换单价：520×720×1.04=389376。单价影响=389376−378560=10816元。'},
{id:'gl022',kp:'gl10',t:1,d:2,q:'某工程检查时，计划工作预算费用（BCWS）为500万元，已完工作预算费用（BCWP）为450万元，已完工作实际费用（ACWP）为480万元。则费用偏差和进度偏差分别为（ ）万元。',o:['−30；−50','30；50','−20；−30','−50；−30'],a:'A',e:'CV=BCWP−ACWP=450−480=−30（超支）；SV=BCWP−BCWS=450−500=−50（进度拖后）。'},
{id:'gl023',kp:'gl10',t:1,d:2,q:'某工程计算得费用绩效指数CPI=0.94，进度绩效指数SPI=0.90，说明该工程（ ）。',o:['费用节支，进度提前','费用超支，进度拖后','费用节支，进度拖后','费用超支，进度提前'],a:'B',e:'CPI<1表示实际费用高于预算费用，即超支；SPI<1表示实际进度落后于计划进度。'},
{id:'gl024',kp:'gl10',t:1,d:3,q:'某土方工程计划工程量2000m³，预算单价400元/m³；到某月底实际完成2200m³，实际单价380元/m³（计划进度按计划工程量计）。下列结论正确的是（ ）。',o:['费用偏差+4.4万元，进度偏差+8万元','费用偏差−4.4万元，进度偏差+8万元','费用偏差+4.4万元，进度偏差−8万元','费用偏差+8万元，进度偏差+4.4万元'],a:'A',e:'BCWP=2200×400=88万；ACWP=2200×380=83.6万；BCWS=2000×400=80万。CV=88−83.6=+4.4万（节支）；SV=88−80=+8万（进度提前）。'},
{id:'gl025',kp:'gl11',t:1,d:2,q:'某工作最早开始时间为第4天，持续时间5天，最迟完成时间为第12天；其两项紧后工作的最早开始时间分别为第10天和第11天。该工作的总时差和自由时差分别为（ ）天。',o:['3；1','3；2','2；1','4；1'],a:'A',e:'EF=4+5=9；TF=LF−EF=12−9=3天；FF=min(10,11)−9=1天。'},
{id:'gl026',kp:'gl11',t:1,d:3,q:'某工程各工作及持续时间为：A（3天，无紧前）、B（4天，无紧前）、C（5天，紧前A）、D（6天，紧前A、B）、E（4天，紧前C）、F（3天，紧前D）。该网络计划的计算工期为（ ）天。',o:['12','13','14','15'],a:'B',e:'线路：A-C-E=12天；A-D-F=12天；B-D-F=4+6+3=13天。最长线路B-D-F为关键线路，计算工期13天。'},
{id:'gl027',kp:'gl11',t:1,d:3,q:'接上题的网络计划（A3、B4、C5紧前A、D6紧前A和B、E4紧前C、F3紧前D），计划工期等于计算工期，则工作C的总时差为（ ）天。',o:['0','1','2','3'],a:'B',e:'工期13天。E的LF=13，LS=9；C的LF=9，EF=3+5=8，TF=9−8=1天。'},
{id:'gl028',kp:'gl11',t:2,d:2,q:'关于网络计划关键线路的说法，正确的有（ ）。',o:['关键线路上的工作全部是关键工作','一个网络计划中关键线路可能不止一条','非关键线路上的工作全部是非关键工作','关键线路是总持续时间最长的线路','关键线路在网络计划执行过程中不会转移'],a:'ABD',e:'非关键线路上也可能有关键工作（如关键线路与非关键线路共用的工作），C错；计划执行中若非关键工作拖延超过时差，关键线路会发生转移，E错。'},
{id:'gl029',kp:'gl12',t:1,d:1,q:'某工程有4个施工过程，划分为5个施工段，组织固定节拍流水施工，流水节拍为3天，无间歇和搭接，则流水施工工期为（ ）天。',o:['15','21','24','27'],a:'C',e:'T=(m+n−1)t=(5+4−1)×3=24天。'},
{id:'gl030',kp:'gl12',t:1,d:3,q:'某分部工程有A、B两个施工过程，分4个施工段组织非节奏流水施工。A在各段的流水节拍为4、3、2、5天，B为3、4、4、2天，则A、B之间的流水步距为（ ）天。',o:['2','3','4','5'],a:'C',e:'累加数列：A为4、7、9、14；B为3、7、11、13。错位相减：4、7−3=4、9−7=2、14−11=3、0−13=−13，取最大值4天。'},
{id:'gl031',kp:'gl12',t:1,d:3,q:'某工程有3个施工过程，流水节拍分别为2天、4天、6天，划分6个施工段，组织加快的成倍节拍流水施工，则流水施工工期为（ ）天。',o:['18','20','22','24'],a:'C',e:'K=最大公约数2；专业队数分别为1、2、3，共6个；T=(m+n′−1)K=(6+6−1)×2=22天。'},
{id:'gl032',kp:'gl12',t:1,d:1,q:'下列流水施工参数中，属于时间参数的是（ ）。',o:['施工过程','施工段','流水步距','流水强度'],a:'C',e:'工艺参数：施工过程、流水强度；空间参数：工作面、施工段；时间参数：流水节拍、流水步距、流水施工工期。'},
{id:'gl033',kp:'gl13',t:1,d:1,q:'PDCA循环中，“D”代表的是（ ）。',o:['计划','实施','检查','处置'],a:'B',e:'P—计划（Plan），D—实施（Do），C—检查（Check），A—处置（Action）。'},
{id:'gl034',kp:'gl13',t:2,d:1,q:'影响施工质量的主要因素有（ ）。',o:['人','机械','材料','方法','资金'],a:'ABCD',e:'影响施工质量的主要因素是“人、机械、材料、方法、环境”（4M1E）。资金不属于这五大因素。'},
{id:'gl035',kp:'gl14',t:1,d:1,q:'根据《建筑工程施工质量验收统一标准》，分部工程质量验收应由（ ）组织。',o:['专业监理工程师','总监理工程师','建设单位项目负责人','施工单位项目负责人'],a:'B',e:'分部工程由总监理工程师组织施工单位项目负责人和项目技术、质量负责人等进行验收；检验批和分项工程由专业监理工程师组织。'},
{id:'gl036',kp:'gl14',t:1,d:2,q:'单位工程完工后，施工单位自检合格并整改完毕后提交工程竣工报告，单位工程质量竣工验收应由（ ）组织。',o:['总监理工程师','施工单位技术负责人','建设单位项目负责人','质量监督机构'],a:'C',e:'建设单位收到工程竣工报告后，由建设单位项目负责人组织监理、施工、设计、勘察等单位项目负责人进行单位工程验收。质量监督机构负责监督，不负责组织。'},
{id:'gl037',kp:'gl14',t:2,d:3,q:'地基与基础分部工程验收时，除总监理工程师、施工单位项目负责人和项目技术质量负责人外，还应参加验收的有（ ）。',o:['勘察单位项目负责人','设计单位项目负责人','施工单位技术、质量部门负责人','建设行政主管部门负责人','质量监督机构负责人'],a:'ABC',e:'勘察、设计单位项目负责人和施工单位技术、质量部门负责人应参加地基与基础分部工程验收。主体结构、节能分部验收时，设计单位项目负责人和施工单位技术、质量部门负责人应参加。'},
{id:'gl038',kp:'gl15',t:1,d:2,q:'某工程质量事故造成2人死亡，直接经济损失1200万元，根据住建部有关规定，该事故等级为（ ）。',o:['一般事故','较大事故','重大事故','特别重大事故'],a:'B',e:'按人员和损失分别判断后取高者：2人死亡属一般；直接经济损失1000万~5000万元属较大。取较高等级，为较大事故。'},
{id:'gl039',kp:'gl15',t:1,d:1,q:'某混凝土结构表面出现宽度在允许范围内的细小裂缝，经检测鉴定对结构安全和使用功能无影响，通过表面密封处理即可，该质量缺陷的处理方法属于（ ）。',o:['返修处理','加固处理','返工处理','不作处理'],a:'A',e:'对存在一定缺陷但经修补可达到要求标准、又不影响使用功能或外观的，可采用返修处理，如混凝土表面裂缝的封闭处理。'},
{id:'gl040',kp:'gl15',t:1,d:2,q:'某工程质量问题经法定检测单位鉴定合格，或虽未达到规范要求但经原设计单位核算仍能满足结构安全和使用功能，则可采用的处理方式是（ ）。',o:['返工处理','加固处理','不作处理','报废处理'],a:'C',e:'不作处理的情形包括：不影响结构安全和使用功能的；后道工序可以弥补的；经法定检测单位鉴定合格的；经原设计单位核算仍能满足结构安全和使用功能的。'},
{id:'gl041',kp:'gl16',t:1,d:1,q:'施工企业对新入场作业人员进行的三级安全教育是指（ ）。',o:['企业、项目、班组三级','国家、省、市三级','公司、分公司、项目三级','项目、工区、班组三级'],a:'A',e:'三级安全教育通常是指进企业（公司）、进项目、进班组三级。'},
{id:'gl042',kp:'gl16',t:2,d:1,q:'生产安全事故处理应遵循“四不放过”原则，包括（ ）。',o:['事故原因未查清不放过','事故责任人员未受到处理不放过','事故责任人和周围群众没有受到教育不放过','事故没有制定切实可行的整改措施不放过','事故经济损失未赔偿不放过'],a:'ABCD',e:'“四不放过”：原因未查清、责任人员未处理、有关人员未受到教育、整改措施未落实不放过。不包括损失赔偿。'},
{id:'gl043',kp:'gl17',t:1,d:1,q:'下列合同计价方式中，承包人承担风险最大的是（ ）。',o:['固定总价合同','固定单价合同','可调单价合同','成本加酬金合同'],a:'A',e:'固定总价合同下，工程量和价格风险基本由承包人承担；成本加酬金合同下业主承担的风险最大。'},
{id:'gl044',kp:'gl17',t:1,d:2,q:'对于工程内容和技术经济指标尚未明确、或抢险救灾等紧急工程，宜采用的合同计价方式是（ ）。',o:['固定总价合同','固定单价合同','成本加酬金合同','变动总价合同'],a:'C',e:'成本加酬金合同适用于工程特别复杂、技术方案不能预先确定，或时间特别紧迫（如抢险、救灾）而来不及进行详细计划的工程。'},
{id:'gl045',kp:'gl17',t:1,d:2,q:'关于单价合同的说法，正确的是（ ）。',o:['单价合同中工程量的风险由承包人承担','单价合同结算时按实际完成并经确认的工程量计算','单价合同不允许调整单价','单价合同中总价优先于单价'],a:'B',e:'单价合同的特点是单价优先，按实际完成的工程量结算，工程量变化的风险主要由业主承担，风险分担相对合理。'},
{id:'gl046',kp:'gl18',t:1,d:2,q:'根据2017版《建设工程施工合同（示范文本）》，下列合同文件中，解释顺序最优先的是（ ）。',o:['中标通知书','专用合同条款','投标函及其附录','合同协议书'],a:'D',e:'解释顺序：合同协议书、中标通知书、投标函及其附录、专用合同条款及其附件、通用合同条款、技术标准和要求、图纸、已标价工程量清单或预算书、其他合同文件。'},
{id:'gl047',kp:'gl18',t:1,d:1,q:'根据2017版施工合同示范文本，承包人应在知道或应当知道索赔事件发生后（ ）天内，向监理人递交索赔意向通知书。',o:['7','14','28','42'],a:'C',e:'承包人应在知道或应当知道索赔事件发生后28天内递交索赔意向通知书，未在规定期限内发出的，丧失要求追加付款和（或）延长工期的权利；发出意向通知书后28天内递交正式索赔报告。'},
{id:'gl048',kp:'gl18',t:1,d:3,q:'根据2017版施工合同示范文本，监理人应在收到索赔报告后（ ）天内完成审查并报送发包人；发包人应在监理人收到索赔报告后（ ）天内出具索赔处理结果。',o:['7；14','14；28','28；28','14；42'],a:'B',e:'监理人应在收到索赔报告后14天内完成审查并报送发包人；发包人应在监理人收到索赔报告或进一步证明材料后28天内，由监理人向承包人出具经发包人签认的索赔处理结果。'},
{id:'gl049',kp:'gl19',t:1,d:1,q:'下列工程担保中，应由发包人提供的是（ ）。',o:['投标担保','履约担保','预付款担保','支付担保'],a:'D',e:'支付担保是发包人向承包人提供的、保证按合同约定支付工程款的担保。其余三项由承包人（投标人）提供。'},
{id:'gl050',kp:'gl20',t:1,d:1,q:'施工现场必须设置封闭围挡，市区主要路段的围挡高度不得低于（ ）。',o:['1.5m','1.8m','2.0m','2.5m'],a:'D',e:'市区主要路段围挡高度不低于2.5m，一般路段不低于1.8m。'},
{id:'gl051',kp:'gl06',t:1,d:1,q:'关于施工企业项目经理的说法，正确的是（ ）。',o:['项目经理是企业法定代表人在建设工程项目上的代表人','项目经理可以同时担任两个以上在建项目的负责人','项目经理的权限不受企业授权范围的限制','项目管理目标责任书由建设单位与项目经理签订'],a:'A',e:'项目经理是企业法定代表人在项目上的代表人，在企业授权范围内行使权力；项目管理目标责任书由企业法定代表人或其授权人与项目经理协商制定；注册建造师原则上不得同时担任两个及以上项目负责人。'},
{id:'gl052',kp:'gl19',t:1,d:2,q:'承包人向发包人提供的、用于保证发包人支付的预付款能够按合同约定扣回的担保是（ ）。',o:['投标担保','履约担保','预付款担保','支付担保'],a:'C',e:'预付款担保由承包人提供，保证承包人按合同规定正确合理使用发包人支付的预付款并按约定扣回。支付担保则由发包人提供。'},
{id:'gl053',kp:'gl20',t:1,d:1,q:'关于施工现场废弃物处理的做法，错误的是（ ）。',o:['建筑垃圾分类存放、及时清运','在现场空地焚烧包装材料等废弃物','委托合法单位清运处置','对易产生扬尘的堆放物进行覆盖'],a:'B',e:'施工现场严禁焚烧各类废弃物，焚烧会造成大气污染。废弃物应分类存放、及时清运，易扬尘材料应覆盖。'}
);

// 项目管理 第二批
KP.push(
{id:'gl21',s:'gl',n:'项目管理规划',imp:0,tip:'依据GB/T 50326-2017：项目管理规划大纲由组织的管理层或组织委托的项目管理单位编制，是投标和签订合同的依据；项目管理实施规划由项目经理组织编制，是项目实施的依据，应在开工前完成。'},
{id:'gl22',s:'gl',n:'项目经理的权限',imp:0,tip:'项目管理机构负责人（项目经理）权限包括：参与项目招标、投标和合同签订；参与组建项目管理机构；主持项目管理机构工作；决定授权范围内的项目资源使用；参与选择并直接管理具有相应资质的分包人；参与选择大宗资源的供应单位；在授权范围内与项目相关方直接沟通等。'},
{id:'gl23',s:'gl',n:'进度计划系统',imp:0,tip:'施工方进度计划按功能分为控制性进度计划、指导性进度计划和实施性（作业性）进度计划。施工方进度控制的任务是依据施工任务委托合同对施工进度的要求控制施工进度。'},
{id:'gl24',s:'gl',n:'双代号时标网络计划',imp:1,tip:'时标网络计划中，实线箭线长度表示工作持续时间，波形线水平投影长度表示该工作的自由时差；自终点节点逆着箭线方向朝起点节点观察，自始至终不出现波形线的线路为关键线路。'},
{id:'gl25',s:'gl',n:'网络计划优化',imp:1,tip:'工期优化通过压缩关键工作持续时间缩短工期，选择压缩对象应考虑：对质量和安全影响不大、有充足备用资源、增加费用最少；不能将关键工作压缩成非关键工作；有多条关键线路时须同时压缩。资源优化分“资源有限，工期最短”和“工期固定，资源均衡”。费用优化寻求总费用最低时的工期。'},
{id:'gl26',s:'gl',n:'实际进度与计划进度比较',imp:1,tip:'比较方法：横道图比较法、S曲线比较法、香蕉曲线比较法、前锋线比较法。某工作实际进度拖后的时间超过其自由时差，会影响紧后工作最早开始；超过其总时差，会影响总工期。进度计划调整方法：改变某些工作间的逻辑关系、缩短某些工作的持续时间。'},
{id:'gl27',s:'gl',n:'施工成本计划的编制方法',imp:0,tip:'按成本组成（人工费、材料费、机械使用费、措施费、间接费）编制；按项目结构编制；按工程实施阶段（时间）编制，可用S形曲线（时间—成本累积曲线）表示。全部工作按最早开始时间安排对节约贷款利息不利，按最迟开始时间安排可节约贷款利息但降低按期完成的保证率，可在香蕉图范围内调整非关键工作开始时间。'},
{id:'gl28',s:'gl',n:'施工成本分析方法',imp:0,tip:'基本方法：比较法、因素分析法（连环置换法）、差额计算法、比率法。比率法包括相关比率法、构成比率法、动态比率法。'},
{id:'gl29',s:'gl',n:'质量统计分析方法',imp:1,tip:'排列图：累计频率0~80%为A类（主要因素），80%~90%为B类（次要因素），90%~100%为C类（一般因素）。因果分析图用于找出质量问题的原因。直方图判断质量分布状态：折齿型（分组不当或组距不当）、缓坡型（操作中对上限或下限控制太严）、孤岛型（原材料变化或临时他人顶班）、双峰型（两种不同方法、设备或两组工人的数据混在一起）、绝壁型（数据收集不正常，剔除了部分数据）。控制图是动态分析方法。'},
{id:'gl30',s:'gl',n:'质量控制点与工序质量控制',imp:0,tip:'质量控制点应选择对质量影响大、技术要求高、施工难度大、发生质量问题危害大的对象。见证点（W点）：施工到该点时应通知监理人员到场见证；待检点（停止点、H点）：未经监理人员检查认可不得进入下一道工序。'},
{id:'gl31',s:'gl',n:'质量管理体系',imp:0,tip:'GB/T 19000质量管理原则：以顾客为关注焦点、领导作用、全员积极参与、过程方法、改进、循证决策、关系管理。体系文件包括质量手册、程序文件、质量计划、质量记录。认证证书有效期为3年，有效期内定期进行监督审核。'},
{id:'gl32',s:'gl',n:'政府质量监督',imp:0,tip:'工程质量监督机构对建设工程质量实施监督，监督竣工验收的组织形式、验收程序、执行标准；应在工程竣工验收之日起5日内，向备案机关提交工程质量监督报告。'},
{id:'gl33',s:'gl',n:'生产安全事故应急预案',imp:1,tip:'应急预案体系由综合应急预案、专项应急预案和现场处置方案构成。生产经营单位每年至少组织一次综合应急预案演练或专项应急预案演练，每半年至少组织一次现场处置方案演练。'},
{id:'gl34',s:'gl',n:'施工合同示范文本的时间节点',imp:1,tip:'2017版示范文本：监理人应在计划开工日期7天前发出开工通知；因发包人原因造成开工通知在计划开工日期之日起90天内未发出的，承包人有权提出价格调整或解除合同。变更：承包人收到变更指示后14天内提交变更估价申请，监理人收到后7天内审查完毕并报发包人，发包人收到后14天内审批完毕。'},
{id:'gl35',s:'gl',n:'安全检查与安全隐患治理',imp:0,tip:'安全隐患治理原则：冗余安全度治理、单项隐患综合治理、直接隐患与间接隐患并治、预防与减灾并重、重点治理、动态治理。安全检查形式包括全面检查、经常性检查、专项检查、季节性检查、节假日检查、要害部门重点检查等。'}
);
QB.push(
{id:'gl101',kp:'gl21',t:1,d:2,q:'根据《建设工程项目管理规范》，项目管理实施规划应由（ ）组织编制。',o:['组织的管理层','项目经理','企业技术负责人','建设单位'],a:'B',e:'项目管理规划大纲由组织的管理层或组织委托的项目管理单位编制；项目管理实施规划由项目经理组织编制。'},
{id:'gl102',kp:'gl21',t:1,d:2,q:'作为投标人编制投标文件和签订合同依据的项目管理文件是（ ）。',o:['项目管理规划大纲','项目管理实施规划','施工组织设计','项目管理目标责任书'],a:'A',e:'项目管理规划大纲在投标前由组织管理层编制，是投标和签订合同的依据；项目管理实施规划是项目实施的依据。'},
{id:'gl103',kp:'gl22',t:1,d:2,q:'根据《建设工程项目管理规范》，下列权限中，不属于项目管理机构负责人（项目经理）权限的是（ ）。',o:['参与项目招标、投标和合同签订','参与选择并直接管理具有相应资质的分包人','决定授权范围内的项目资源使用','选定工程监理单位'],a:'D',e:'选定监理单位是建设单位的权利，不属于施工方项目经理的权限。'},
{id:'gl104',kp:'gl22',t:2,d:2,q:'根据《建设工程项目管理规范》，项目管理机构负责人的权限有（ ）。',o:['参与组建项目管理机构','主持项目管理机构工作','参与选择大宗资源的供应单位','在授权范围内与项目相关方进行直接沟通','决定企业年度经营目标'],a:'ABCD',e:'决定企业年度经营目标是企业管理层的职权。'},
{id:'gl105',kp:'gl23',t:1,d:1,q:'施工方编制的进度计划中，直接用于组织施工作业的是（ ）。',o:['控制性进度计划','指导性进度计划','实施性进度计划','总进度纲要'],a:'C',e:'实施性（作业性）进度计划是直接组织施工作业的计划；控制性和指导性进度计划用于宏观控制和指导。'},
{id:'gl106',kp:'gl24',t:1,d:1,q:'在双代号时标网络计划中，波形线的水平投影长度表示（ ）。',o:['工作的总时差','工作的自由时差','工作的持续时间','工作的最迟开始时间'],a:'B',e:'时标网络计划中，以波形线表示工作的自由时差；实线箭线长度表示工作持续时间。'},
{id:'gl107',kp:'gl24',t:1,d:2,q:'在双代号时标网络计划中，判断关键线路的方法是（ ）。',o:['自始至终不出现虚箭线的线路','自终点节点逆着箭线方向观察，自始至终不出现波形线的线路','持续时间最短的线路','工作数量最多的线路'],a:'B',e:'时标网络计划中，自终点节点逆着箭线方向朝起点节点观察，自始至终不出现波形线的线路为关键线路。'},
{id:'gl108',kp:'gl25',t:2,d:2,q:'网络计划工期优化时，选择压缩的关键工作应考虑的因素有（ ）。',o:['缩短持续时间对质量和安全影响不大','有充足的备用资源','缩短持续时间所需增加的费用最少','持续时间最长的工作','可以将其压缩成非关键工作以获得更大的工期缩短'],a:'ABC',e:'应选择对质量安全影响小、有备用资源、增加费用最少的关键工作压缩；并非持续时间最长即优先。压缩时不能将关键工作压缩成非关键工作。'},
{id:'gl109',kp:'gl25',t:1,d:2,q:'工期优化过程中，当出现多条关键线路时，应（ ）。',o:['只压缩其中一条关键线路','将各条关键线路的总持续时间压缩相同数值','将关键工作压缩成非关键工作','压缩非关键工作'],a:'B',e:'出现多条关键线路时，必须将各条关键线路的总持续时间压缩相同数值，否则不能有效缩短工期。'},
{id:'gl110',kp:'gl25',t:1,d:1,q:'网络计划资源优化中，“工期固定，资源均衡”的优化目标是（ ）。',o:['在资源有限条件下使工期最短','在工期不变条件下使资源需用量尽可能均衡','使工程总费用最低','使工期最短'],a:'B',e:'资源优化分为“资源有限，工期最短”和“工期固定，资源均衡”两类。'},
{id:'gl111',kp:'gl26',t:1,d:2,q:'某工作总时差为4天，自由时差为2天，检查时发现该工作实际进度拖后3天，则该工作（ ）。',o:['既不影响总工期，也不影响紧后工作','影响紧后工作最早开始1天，不影响总工期','影响总工期1天','影响总工期3天'],a:'B',e:'拖后3天超过自由时差2天，影响紧后工作最早开始1天；未超过总时差4天，不影响总工期。'},
{id:'gl112',kp:'gl26',t:1,d:2,q:'某工作总时差为2天，检查时发现其实际进度拖后5天，若不调整，将使总工期延长（ ）天。',o:['2','3','5','7'],a:'B',e:'拖后时间超过总时差的部分影响总工期：5−2=3天。'},
{id:'gl113',kp:'gl26',t:2,d:1,q:'下列方法中，可以用于实际进度与计划进度比较的有（ ）。',o:['横道图比较法','S曲线比较法','香蕉曲线比较法','前锋线比较法','因果分析图法'],a:'ABCD',e:'因果分析图是质量分析工具，不用于进度比较。'},
{id:'gl114',kp:'gl26',t:1,d:2,q:'进度计划调整时，将依次进行的工作改为平行作业或搭接作业以缩短工期，属于（ ）。',o:['缩短某些工作的持续时间','改变某些工作间的逻辑关系','资源优化','费用优化'],a:'B',e:'进度计划调整的两种方法：改变工作间的逻辑关系（如顺序改平行、搭接）和缩短工作持续时间。'},
{id:'gl115',kp:'gl27',t:1,d:2,q:'用时间—成本累积曲线（S曲线）编制成本计划时，若所有工作都按最迟开始时间开始，则（ ）。',o:['对节约贷款利息不利','可以节约贷款利息，但降低了项目按期竣工的保证率','项目按期竣工的保证率最高','会增加资金占用'],a:'B',e:'全部按最迟开始时间安排，资金使用推后，可节约贷款利息，但非关键工作失去机动时间，降低了按期竣工的保证率。'},
{id:'gl116',kp:'gl27',t:1,d:1,q:'下列施工成本计划的编制方式中，可以按S形曲线表示的是（ ）。',o:['按成本组成编制','按项目结构编制','按工程实施阶段（时间）编制','按合同类型编制'],a:'C',e:'按时间进度编制的成本计划可用时间—成本累积曲线（S形曲线）或横道图表示。'},
{id:'gl117',kp:'gl28',t:1,d:2,q:'通过计算本期实际值与上期实际值的比值来分析成本发展趋势的方法是（ ）。',o:['相关比率法','构成比率法','动态比率法','差额计算法'],a:'C',e:'动态比率法将同类指标不同时期的数值对比，分析发展方向和速度，有基期指数和环比指数两种。构成比率法分析各成本项目占总成本的比重。'},
{id:'gl118',kp:'gl28',t:2,d:1,q:'施工成本分析的基本方法有（ ）。',o:['比较法','因素分析法','差额计算法','比率法','挣值法'],a:'ABCD',e:'挣值法是成本控制中的偏差分析方法，不属于成本分析的四种基本方法。'},
{id:'gl119',kp:'gl29',t:1,d:1,q:'在质量问题排列图中，累计频率在0~80%区间的因素属于（ ）。',o:['A类，主要因素','B类，次要因素','C类，一般因素','D类，可忽略因素'],a:'A',e:'A类0~80%为主要因素，B类80%~90%为次要因素，C类90%~100%为一般因素。'},
{id:'gl120',kp:'gl29',t:1,d:2,q:'采用直方图法分析工程质量时，出现双峰型直方图的原因是（ ）。',o:['分组组数不当','原材料发生变化','两种不同方法或两台设备生产的数据混在一起','剔除了不合格数据'],a:'C',e:'双峰型：两种不同方法、两台设备或两组工人的数据混在一起；折齿型：分组不当；孤岛型：原材料变化或临时他人顶班；绝壁型：剔除了部分数据。'},
{id:'gl121',kp:'gl29',t:1,d:2,q:'下列质量统计分析方法中，属于动态分析方法的是（ ）。',o:['排列图法','直方图法','控制图法','因果分析图法'],a:'C',e:'控制图可以随时间推移监控生产过程是否处于稳定状态，属于动态分析方法；直方图、排列图反映某一时段的静态分布。'},
{id:'gl122',kp:'gl29',t:1,d:2,q:'直方图呈现缓坡型（左缓坡或右缓坡），其原因一般是（ ）。',o:['操作中对上限或下限控制太严','数据分组不当','原材料发生变化','两组工人数据混合'],a:'A',e:'左（右）缓坡型主要是由于操作中对上限（或下限）控制太严造成的。'},
{id:'gl123',kp:'gl30',t:1,d:2,q:'施工质量控制中，未经监理人员检查认可不得越过进入下一道工序的控制点称为（ ）。',o:['见证点','待检点（停止点）','巡视点','平行检验点'],a:'B',e:'待检点（H点、停止点）必须经监理人员检查认可后方可进入下一道工序；见证点（W点）需通知监理人员到场见证。'},
{id:'gl124',kp:'gl30',t:2,d:2,q:'选择施工质量控制点的对象一般有（ ）。',o:['对施工质量影响大的关键工序','施工技术难度大的部位','发生质量问题危害大的部位','采用新技术、新工艺、新材料的部位','施工单位熟练掌握的常规工序'],a:'ABCD',e:'质量控制点应选择关键、重要、难度大、危害大或“四新”应用的部位和环节；熟练掌握的常规工序一般不设为控制点。'},
{id:'gl125',kp:'gl31',t:1,d:2,q:'质量管理体系认证证书的有效期为（ ）年。',o:['1','2','3','5'],a:'C',e:'质量管理体系认证证书有效期为3年，有效期内认证机构定期进行监督审核。'},
{id:'gl126',kp:'gl31',t:2,d:2,q:'GB/T 19000质量管理原则包括（ ）。',o:['以顾客为关注焦点','领导作用','全员积极参与','过程方法','以利润最大化为目标'],a:'ABCD',e:'七项质量管理原则：以顾客为关注焦点、领导作用、全员积极参与、过程方法、改进、循证决策、关系管理。'},
{id:'gl127',kp:'gl32',t:1,d:2,q:'工程质量监督机构应在工程竣工验收之日起（ ）日内，向备案机关提交工程质量监督报告。',o:['3','5','7','15'],a:'B',e:'监督机构应在竣工验收之日起5日内提交工程质量监督报告；建设单位应在竣工验收合格之日起15日内备案。注意两者区别。'},
{id:'gl128',kp:'gl33',t:1,d:1,q:'生产经营单位的应急预案体系由（ ）构成。',o:['综合应急预案、专项应急预案、现场处置方案','总体预案、部门预案、岗位预案','一级预案、二级预案、三级预案','企业预案、项目预案、班组预案'],a:'A',e:'应急预案分为综合应急预案、专项应急预案和现场处置方案。'},
{id:'gl129',kp:'gl33',t:1,d:2,q:'根据《生产安全事故应急预案管理办法》，生产经营单位应当每半年至少组织一次（ ）演练。',o:['综合应急预案','专项应急预案','现场处置方案','全部应急预案'],a:'C',e:'每年至少组织一次综合应急预案或专项应急预案演练，每半年至少组织一次现场处置方案演练。'},
{id:'gl130',kp:'gl34',t:1,d:2,q:'根据2017版施工合同示范文本，监理人应在计划开工日期（ ）天前向承包人发出开工通知。',o:['3','7','14','28'],a:'B',e:'监理人应在计划开工日期7天前发出开工通知，工期自开工通知中载明的开工日期起算。'},
{id:'gl131',kp:'gl34',t:1,d:3,q:'根据2017版施工合同示范文本，因发包人原因造成监理人未能在计划开工日期之日起（ ）天内发出开工通知的，承包人有权提出价格调整要求，或者解除合同。',o:['28','42','56','90'],a:'D',e:'因发包人原因90天内未发出开工通知的，承包人有权提出价格调整或解除合同，发包人应承担由此增加的费用和（或）延误的工期，并支付承包人合理的利润。'},
{id:'gl132',kp:'gl34',t:1,d:2,q:'根据2017版施工合同示范文本，承包人应在收到变更指示后（ ）天内，向监理人提交变更估价申请。',o:['7','14','28','42'],a:'B',e:'承包人收到变更指示后14天内提交变更估价申请；监理人收到后7天内审查完毕并报发包人；发包人收到后14天内审批完毕。'},
{id:'gl133',kp:'gl35',t:1,d:2,q:'安全隐患治理中，对于一个隐患同时采取多种措施，例如既设置防护栏杆又设置安全网，体现的治理原则是（ ）。',o:['冗余安全度治理原则','动态治理原则','重点治理原则','预防与减灾并重原则'],a:'A',e:'冗余安全度治理原则：为确保安全，在治理事故隐患时应考虑设置多道防线，即使发生有一两道防线无效，还有冗余的防线可以控制事故隐患。'},
{id:'gl134',kp:'gl35',t:1,d:2,q:'在雨季、冬季等季节到来之前组织的安全检查属于（ ）。',o:['全面检查','经常性检查','季节性检查','节假日检查'],a:'C',e:'季节性检查针对气候特点（如冬季、雨季、台风季节）可能给施工带来的危害而组织。'}
);

// 公路工程管理与实务
KP.push(
{id:'gs01',s:'gs',n:'路基填料的选择',imp:1,tip:'泥炭、淤泥、冻土、强膨胀土、有机质土及易溶盐超过允许含量的土，不得直接用于填筑路基；液限大于50%、塑性指数大于26的细粒土，不得直接作为路堤填料。路床填料最大粒径应小于100mm，路堤填料最大粒径应小于150mm。'},
{id:'gs02',s:'gs',n:'路基压实度标准',imp:1,tip:'高速公路、一级公路土质路基压实度（重型击实）：上路床、下路床≥96%，上路堤≥94%，下路堤≥93%。压实度=现场干密度/最大干密度。'},
{id:'gs03',s:'gs',n:'路基路面检测方法',imp:1,tip:'压实度：灌砂法（最常用，适用路基土、基层、砂石路面）、环刀法（细粒土）、核子密度湿度仪法（快速，需对比标定）。最佳含水量：轻型、重型击实试验；振动台法和表面振动压实仪法适用于无黏性自由排水粗粒土和巨粒土。弯沉：贝克曼梁法（静态回弹弯沉）、自动弯沉仪法、落锤弯沉仪法（动态弯沉，可反算模量）。'},
{id:'gs04',s:'gs',n:'软土地基处理',imp:1,tip:'浅层处理：换填、抛石挤淤、稳定剂处理；竖向排水体（袋装砂井、塑料排水板）配合堆载预压或真空预压；复合地基：粒料桩、加固土桩（粉喷桩、浆喷桩）、CFG桩、刚性桩；强夯和强夯置换。抛石挤淤适用于常年积水、排水困难、表层无硬壳、片石能沉达底部的泥沼或较薄软土。'},
{id:'gs05',s:'gs',n:'路基冬期施工',imp:0,tip:'在反复冻融地区，昼夜平均温度在−3℃以下、连续10d以上时进行路基施工，称为路基冬期施工。不宜冬期施工：高速、一级公路的土质路堤，地质不良地区二级及以下公路的路堤，铲除原地面草皮、挖填方台阶，整修路基边坡，河滩低洼地带将被水淹没的填土路堤。适宜冬期施工：泥沼地带冻结后换填，含水率高的流动土质、流沙地段路堑开挖，岩石地段路堑开挖等。'},
{id:'gs06',s:'gs',n:'路基排水',imp:1,tip:'地面排水：边沟、截水沟、排水沟、跌水与急流槽、拦水带、蒸发池等；地下排水：暗沟（管）、渗沟、渗井、检查井等。截水沟设在挖方路基边坡坡顶以外或山坡路堤上方，拦截上方坡面水；边沟设在挖方路基和低填路堤的路肩外侧；渗沟用于降低地下水位或拦截地下水。'},
{id:'gs07',s:'gs',n:'路基防护与支挡',imp:0,tip:'坡面防护：植物防护、骨架植物防护、圬工防护（喷射混凝土、护面墙等）。支挡结构：重力式挡土墙依靠墙身自重抵抗土压力；加筋土挡土墙适用于填方路段；锚杆挡土墙多用于岩质路堑；悬臂式、扶壁式为钢筋混凝土结构，适用于石料缺乏地区。'},
{id:'gs08',s:'gs',n:'路面结构层',imp:0,tip:'路面结构层一般为面层、基层、底基层、垫层。垫层设置在季节性冰冻地区的中湿、潮湿路段或地下水位高、排水不良路段，起排水、隔水、防冻、防污作用。'},
{id:'gs09',s:'gs',n:'无机结合料稳定基层',imp:1,tip:'水泥、石灰、工业废渣稳定材料属于半刚性基层，设计以7d无侧限抗压强度为控制指标。养护期不宜少于7d，可采用洒水、覆盖土工布、薄膜等方式；养护期间除洒水车外应封闭交通。水泥稳定材料应在容许延迟时间内完成碾压。'},
{id:'gs10',s:'gs',n:'透层、粘层与封层',imp:1,tip:'透层：在非沥青材料层（级配碎石、无机结合料稳定基层）上浇洒低黏度液体沥青或乳化沥青，透入表面；粘层：使沥青层与沥青层之间、沥青层与水泥混凝土路面之间粘结成整体；封层：上封层铺在面层上封闭表面空隙、防水，下封层铺在基层上、面层下。'},
{id:'gs11',s:'gs',n:'沥青混合料压实与接缝',imp:1,tip:'压实分初压、复压、终压。初压紧跟摊铺机，用钢轮压路机静压；复压紧接初压，密级配混合料宜优先用重型轮胎压路机；终压用钢轮压路机消除轮迹。碾压原则：紧跟、慢压、高频、低幅。SMA不宜采用轮胎压路机（易粘轮、泛油）。高速、一级公路表面层横向接缝应采用垂直的平接缝。'},
{id:'gs12',s:'gs',n:'沥青混合料结构类型',imp:0,tip:'密实—悬浮结构（如AC型）：密实度高、黏聚力大，但高温稳定性较差；骨架—空隙结构（如OGFC排水沥青混合料）：内摩擦角大、排水抗滑好，但耐久性较差；骨架—密实结构（如SMA）：高温稳定性和低温抗裂性均较好。'},
{id:'gs13',s:'gs',n:'水泥混凝土路面接缝',imp:1,tip:'纵缝设置拉杆（螺纹钢筋），防止板块横向位移和纵缝张开；胀缝设置传力杆（光圆钢筋，一端涂沥青或加套管可自由滑动）传递荷载；横向缩缝一般为假缝，采用切缝法施工。'},
{id:'gs14',s:'gs',n:'桥梁分类与基本术语',imp:1,tip:'按多孔跨径总长L/单孔跨径Lk：特大桥L>1000m或Lk>150m；大桥100≤L≤1000m或40≤Lk≤150m；中桥30<L<100m或20≤Lk<40m；小桥8≤L≤30m或5≤Lk<20m；涵洞Lk<5m（圆管涵、箱涵不论管径跨径孔数均称涵洞）。建筑高度：桥面（轨顶）标高至桥跨结构最下缘的距离；桥下净空高度：设计洪水位或计算通航水位至桥跨结构最下缘的距离；计算跨径：有支座的桥梁为相邻支座中心之间的距离。'},
{id:'gs15',s:'gs',n:'钻孔灌注桩',imp:1,tip:'护筒作用：固定桩位、引导钻头、隔离地表水、保护孔口、保持孔内水头防坍孔。泥浆作用：护壁、悬浮钻渣、冷却润滑钻头。水下混凝土采用导管法：首批混凝土灌注后导管埋深不小于1.0m；灌注过程中导管埋深宜控制在2~6m。'},
{id:'gs16',s:'gs',n:'预应力混凝土施工',imp:1,tip:'先张法：先张拉预应力筋并临时锚固，再浇筑混凝土，达到强度后放张；后张法：先浇筑构件并预留孔道，达到强度后张拉、锚固、压浆。张拉采用双控：以应力控制为主，以伸长值校核，实际伸长值与理论伸长值差值应控制在±6%以内。设计未规定时，张拉时构件混凝土强度不应低于设计强度等级值的80%。'},
{id:'gs17',s:'gs',n:'悬臂浇筑与合龙',imp:0,tip:'挂篮质量与梁段混凝土质量的比值宜控制在0.3~0.5，特殊情况下不应超过0.7。连续梁合龙顺序一般为先边跨、后次跨、再中跨；合龙段宜在一天中气温最低时浇筑。'},
{id:'gs18',s:'gs',n:'隧道围岩分级与新奥法',imp:1,tip:'公路隧道围岩分为I~VI级，I级最好、VI级最差。新奥法基本原则：少扰动、早喷锚、勤量测、紧封闭。复合式衬砌由初期支护（喷射混凝土、锚杆、钢筋网、钢架）和二次衬砌组成，二次衬砌在围岩和初期支护变形基本稳定后施作。'},
{id:'gs19',s:'gs',n:'隧道监控量测与超前地质预报',imp:1,tip:'必测项目：洞内外观察、周边位移（收敛）、拱顶下沉、地表沉降（浅埋段）等；围岩压力、钢架内力、锚杆轴力、围岩内部位移、衬砌内力、爆破振动等为选测项目。超前地质预报方法：地质调查法、物探法（TSP地震波反射法、地质雷达法等）、超前钻探法、超前导洞法。TSP适用于较长距离预报，地质雷达适用于短距离预报。'},
{id:'gs20',s:'gs',n:'隧道开挖方法与洞口施工',imp:0,tip:'全断面法适用于I~III级围岩；台阶法应用广泛；CD法、CRD法、双侧壁导坑法用于软弱围岩、浅埋、大跨度隧道，双侧壁导坑法适用于地表沉降要求严格的情况。洞口施工遵循“早进晚出”，边仰坡自上而下开挖，宜避开雨季和融雪期。'},
{id:'gs21',s:'gs',n:'交通安全设施',imp:0,tip:'交通安全设施包括交通标志、交通标线、护栏、隔离栅、防眩设施、视线诱导设施、防落物网、避险车道等。防眩设施防止夜间对向车灯眩目；隔离栅阻止人畜进入或横穿公路；轮廓标属于视线诱导设施。'},
{id:'gs22',s:'gs',n:'公路工程质量检验评定',imp:1,tip:'依据JTG F80/1-2017：工程质量评定分合格、不合格两个等级，以分项工程为基本评定单元，按分项、分部、单位工程逐级评定。分项工程检验内容：基本要求、实测项目、外观质量、质量保证资料。实测项目合格判定：关键项目合格率不低于95%（机电工程为100%），一般项目合格率不低于80%，有规定极值的项目任一单个检测值不得突破极值。土方路基实测关键项目为压实度和弯沉。'},
{id:'gs23',s:'gs',n:'公路工程交工与竣工验收',imp:1,tip:'交工验收由项目法人组织，主要检查合同执行情况和工程质量；竣工验收由交通运输主管部门按项目管理权限组织。竣工验收条件之一是通车试运营2年以上。竣工验收工程质量评分≥90分为优良，75~90分为合格，<75分为不合格。'},
{id:'gs24',s:'gs',n:'公路工程设计变更',imp:0,tip:'设计变更分重大、较大和一般设计变更。重大设计变更由交通运输部负责审批；较大设计变更由省级交通运输主管部门负责审批；一般设计变更由项目法人审查确认。特大桥数量或结构型式发生变化、特长隧道数量或通风方案变化、连续10km以上路线方案调整等属于重大设计变更；路面结构类型、宽度和厚度变化，大中桥数量或结构型式变化等属于较大设计变更。'},
{id:'gs25',s:'gs',n:'公路工程安全生产费用与安全管理',imp:0,tip:'按财资〔2022〕136号，建设工程施工企业以建筑安装工程造价为依据提取安全生产费用：公路工程、市政公用工程、港口与航道工程为1.5%；房屋建筑、铁路、城市轨道交通工程为3%；矿山工程为3.5%。安全生产费用不得作为竞争性报价，专款专用。'},
{id:'gs26',s:'gs',n:'涵洞与通道',imp:0,tip:'涵洞按构造形式分为管涵、拱涵、盖板涵、箱涵；单孔跨径小于5m的称为涵洞，圆管涵和箱涵不论管径、跨径大小和孔数多少均称为涵洞。'}
);
QB.push(
{id:'gs001',kp:'gs01',t:1,d:1,q:'下列土中，可以直接用于填筑路基的是（ ）。',o:['泥炭','淤泥','砂性土','强膨胀土'],a:'C',e:'泥炭、淤泥、冻土、强膨胀土、有机质土及易溶盐超过允许含量的土不得直接用于填筑路基。砂性土是良好的路基填料。'},
{id:'gs002',kp:'gs01',t:1,d:2,q:'根据《公路路基施工技术规范》，液限大于（ ）、塑性指数大于（ ）的细粒土，不得直接作为路堤填料。',o:['40%；20','50%；26','50%；20','60%；26'],a:'B',e:'液限大于50%、塑性指数大于26的细粒土，以及含水率不符合要求的土，不得直接作为路堤填料，需经处理后方可使用。'},
{id:'gs003',kp:'gs01',t:1,d:2,q:'路床填料的最大粒径应小于（ ）。',o:['50mm','100mm','150mm','200mm'],a:'B',e:'路床填料最大粒径应小于100mm；路堤填料最大粒径应小于150mm。'},
{id:'gs004',kp:'gs02',t:1,d:1,q:'高速公路土方路基上路床（0~0.3m）的压实度（重型击实标准）应不小于（ ）。',o:['93%','94%','95%','96%'],a:'D',e:'高速、一级公路上路床和下路床压实度均≥96%，上路堤≥94%，下路堤≥93%。'},
{id:'gs005',kp:'gs02',t:1,d:2,q:'某高速公路路堤填筑，距路床顶面深度为2.0m的下路堤部分，其压实度（重型击实标准）应不小于（ ）。',o:['93%','94%','95%','96%'],a:'A',e:'路床顶面以下1.5m以下为下路堤，高速、一级公路下路堤压实度≥93%。'},
{id:'gs006',kp:'gs02',t:1,d:2,q:'某路基现场测得干密度为1.86g/cm³，室内重型击实试验得最大干密度为1.95g/cm³，则该点压实度约为（ ）。',o:['93.5%','95.4%','96.0%','104.8%'],a:'B',e:'压实度=现场干密度/最大干密度=1.86/1.95≈95.4%。'},
{id:'gs007',kp:'gs03',t:1,d:1,q:'路基施工现场测定压实度最常用的方法是（ ）。',o:['环刀法','灌砂法','核子密度湿度仪法','贝克曼梁法'],a:'B',e:'灌砂法适用于路基土、基层、砂石路面等各种材料压实层密度的现场测定，是最常用的方法。贝克曼梁法用于测定弯沉。'},
{id:'gs008',kp:'gs03',t:1,d:2,q:'下列弯沉检测方法中，属于动态检测、可以反算路面结构层模量的是（ ）。',o:['贝克曼梁法','自动弯沉仪法','落锤弯沉仪法','3m直尺法'],a:'C',e:'落锤弯沉仪（FWD）模拟行车荷载冲击作用测定动态弯沉，可反算模量；贝克曼梁法测静态回弹弯沉；3m直尺用于测平整度。'},
{id:'gs009',kp:'gs03',t:1,d:3,q:'对于无黏性自由排水的粗粒土和巨粒土，确定其最大干密度和最佳含水率宜采用（ ）。',o:['轻型击实试验','重型击实试验','振动台法或表面振动压实仪法','灌砂法'],a:'C',e:'振动台法和表面振动压实仪法适用于通过0.075mm筛的干颗粒质量百分数不大于15%的无黏性自由排水粗粒土和巨粒土；击实试验主要适用于细粒土和部分粗粒土。灌砂法测现场密度，不测最大干密度。'},
{id:'gs010',kp:'gs03',t:2,d:2,q:'下列检测方法中，可用于测定路基压实度的有（ ）。',o:['灌砂法','环刀法','核子密度湿度仪法','落锤弯沉仪法','连续式平整度仪法'],a:'ABC',e:'落锤弯沉仪测弯沉，连续式平整度仪测平整度，均不能测压实度。核子仪法测定快速，但使用前应与灌砂法等进行对比标定。'},
{id:'gs011',kp:'gs04',t:1,d:1,q:'下列软土地基处理方法中，属于浅层处理的是（ ）。',o:['塑料排水板','换填垫层','水泥搅拌桩','CFG桩'],a:'B',e:'浅层处理包括换填、抛石挤淤、稳定剂处理等。塑料排水板属于竖向排水体，水泥搅拌桩和CFG桩属于复合地基。'},
{id:'gs012',kp:'gs04',t:1,d:2,q:'常年积水的洼地，排水困难，泥炭呈流动状态，表层无硬壳，片石能沉达底部的泥沼或较薄软土，宜采用的处理方法是（ ）。',o:['强夯','抛石挤淤','真空预压','粒料桩'],a:'B',e:'抛石挤淤适用于上述条件：用片石将软土挤出，片石沉达底部形成稳定的基础。'},
{id:'gs013',kp:'gs04',t:1,d:2,q:'袋装砂井、塑料排水板处理软土地基，其主要作用是（ ）。',o:['置换软土','提高地基土的抗剪强度，形成复合地基','缩短排水路径，加速地基固结','挤密地基土'],a:'C',e:'竖向排水体缩短了孔隙水的排水路径，与堆载预压或真空预压配合，加速软土固结、提高强度、减少工后沉降。'},
{id:'gs014',kp:'gs05',t:1,d:1,q:'在反复冻融地区，昼夜平均温度在（ ）以下、连续（ ）以上时进行路基施工，称为路基冬期施工。',o:['0℃；5d','−3℃；10d','−5℃；7d','5℃；5d'],a:'B',e:'《公路路基施工技术规范》规定：昼夜平均温度在−3℃以下，连续10d以上时进行路基施工称为冬期施工。注意与混凝土冬期施工的定义区别。'},
{id:'gs015',kp:'gs05',t:1,d:2,q:'下列路基工程中，可以在冬期施工的是（ ）。',o:['高速公路土质路堤','整修路基边坡','含水率高的流动土质、流沙地段的路堑开挖','河滩低洼地带将被水淹没的填土路堤'],a:'C',e:'含水率高的流动土质、流沙地段路堑可利用冻结期开挖。其余三项均属于不宜冬期施工的项目。'},
{id:'gs016',kp:'gs06',t:1,d:1,q:'设置在挖方路基边坡坡顶以外，用于拦截上方坡面水的排水设施是（ ）。',o:['边沟','截水沟','排水沟','渗沟'],a:'B',e:'截水沟设在挖方路基坡顶以外或山坡路堤上方，拦截并排除路基上方的地面径流。'},
{id:'gs017',kp:'gs06',t:1,d:2,q:'下列路基排水设施中，属于地下排水设施的是（ ）。',o:['跌水','急流槽','渗沟','拦水带'],a:'C',e:'渗沟属于地下排水设施，用于降低地下水位或拦截地下水；跌水、急流槽、拦水带属于地面排水设施。'},
{id:'gs018',kp:'gs06',t:2,d:2,q:'下列排水设施中，属于路基地面排水设施的有（ ）。',o:['边沟','截水沟','暗沟','急流槽','渗井'],a:'ABD',e:'暗沟（管）和渗井属于地下排水设施。'},
{id:'gs019',kp:'gs07',t:1,d:1,q:'依靠墙身自重抵抗土压力的挡土墙是（ ）。',o:['重力式挡土墙','锚杆挡土墙','加筋土挡土墙','扶壁式挡土墙'],a:'A',e:'重力式挡土墙依靠墙身自重抵抗土压力，形式简单、施工方便，是公路上最常用的挡土墙。'},
{id:'gs020',kp:'gs07',t:1,d:2,q:'加筋土挡土墙一般适用于（ ）。',o:['挖方路段','填方路段','岩质路堑','滑坡地段'],a:'B',e:'加筋土挡土墙由面板、拉筋和填料组成，适用于填方路段，在挖方路段一般不采用。锚杆挡土墙多用于岩质路堑。'},
{id:'gs021',kp:'gs08',t:1,d:2,q:'路面结构中设置垫层的主要作用不包括（ ）。',o:['排水','隔水','防冻','直接承受行车荷载磨耗'],a:'D',e:'垫层位于基层（底基层）与土基之间，起排水、隔水、防冻、防污作用。直接承受行车荷载和磨耗的是面层。'},
{id:'gs022',kp:'gs09',t:1,d:1,q:'无机结合料稳定材料基层的养护期不宜少于（ ）。',o:['3d','7d','14d','28d'],a:'B',e:'无机结合料稳定材料养护期不宜少于7d，养护期间除洒水车外应封闭交通。'},
{id:'gs023',kp:'gs09',t:1,d:2,q:'水泥稳定碎石基层设计时，通常以（ ）作为强度控制指标。',o:['28d抗压强度','7d无侧限抗压强度','CBR值','回弹模量'],a:'B',e:'半刚性基层（无机结合料稳定材料）以7d无侧限抗压强度作为设计和施工质量控制的强度指标。'},
{id:'gs024',kp:'gs10',t:1,d:1,q:'在级配碎石或水泥稳定碎石基层上浇洒低黏度液体沥青或乳化沥青，使其透入基层表面而形成的薄层称为（ ）。',o:['透层','粘层','上封层','下封层'],a:'A',e:'透层是在非沥青材料层上浇洒、透入表面的沥青薄层，使沥青面层与基层结合良好。'},
{id:'gs025',kp:'gs10',t:1,d:2,q:'新建沥青路面双层式结构中，在下面层与上面层之间应设置（ ）。',o:['透层','粘层','下封层','防水层'],a:'B',e:'粘层用于使沥青层与沥青层之间、沥青层与水泥混凝土路面之间粘结成整体。'},
{id:'gs026',kp:'gs10',t:2,d:2,q:'关于透层、粘层、封层的说法，正确的有（ ）。',o:['透层设置在非沥青材料基层上','粘层用于沥青层与沥青层之间的粘结','上封层铺筑在沥青面层上，起封闭表面空隙、防水作用','下封层铺筑在沥青面层之上','透层可以替代粘层使用'],a:'ABC',e:'下封层铺筑在基层上、沥青面层下（D错）。透层与粘层功能不同，不能相互替代（E错）。'},
{id:'gs027',kp:'gs11',t:1,d:1,q:'沥青混合料路面碾压的正确顺序是（ ）。',o:['复压→初压→终压','初压→复压→终压','初压→终压→复压','终压→初压→复压'],a:'B',e:'碾压分初压、复压、终压三个阶段。初压紧跟摊铺机静压稳定；复压是压实的主要阶段；终压消除轮迹。'},
{id:'gs028',kp:'gs11',t:1,d:2,q:'SMA沥青玛蹄脂碎石混合料路面碾压时，不宜采用的压路机是（ ）。',o:['钢轮压路机','振动压路机','轮胎压路机','双钢轮压路机'],a:'C',e:'SMA沥青用量大、粘性强，采用轮胎压路机容易粘轮并揉搓出沥青玛蹄脂导致泛油，因此不宜使用。'},
{id:'gs029',kp:'gs11',t:1,d:2,q:'沥青混合料路面碾压应遵循的原则是（ ）。',o:['紧跟、快压、低频、高幅','紧跟、慢压、高频、低幅','滞后、慢压、高频、高幅','紧跟、慢压、低频、高幅'],a:'B',e:'沥青混合料碾压应“紧跟、慢压、高频、低幅”，保证在合适的温度下压实。'},
{id:'gs030',kp:'gs11',t:1,d:2,q:'高速公路沥青路面表面层的横向接缝应采用（ ）。',o:['斜接缝','阶梯形接缝','垂直的平接缝','搭接缝'],a:'C',e:'高速公路和一级公路的表面层横向接缝应采用垂直的平接缝，其他等级公路的各层可采用斜接缝。上下层横向接缝应错位1m以上。'},
{id:'gs031',kp:'gs12',t:1,d:2,q:'下列沥青混合料中，属于骨架—密实结构的是（ ）。',o:['AC型沥青混凝土','SMA沥青玛蹄脂碎石','OGFC排水沥青混合料','沥青贯入式'],a:'B',e:'SMA属于骨架—密实结构，高温稳定性和低温抗裂性都较好；AC型属密实—悬浮结构；OGFC属骨架—空隙结构。'},
{id:'gs032',kp:'gs12',t:1,d:2,q:'密实—悬浮结构沥青混合料的主要缺点是（ ）。',o:['密实度低','黏聚力小','高温稳定性较差','透水性大'],a:'C',e:'密实—悬浮结构细料多、粗集料悬浮其中，密实度高、黏聚力大，但内摩擦角小，高温稳定性较差。'},
{id:'gs033',kp:'gs13',t:1,d:1,q:'水泥混凝土路面纵缝中设置的拉杆，一般采用（ ）。',o:['光圆钢筋','螺纹钢筋','钢绞线','角钢'],a:'B',e:'拉杆采用螺纹钢筋，作用是防止板块横向位移和纵缝张开；传力杆采用光圆钢筋，要求能滑动以适应板的伸缩。'},
{id:'gs034',kp:'gs13',t:1,d:2,q:'水泥混凝土路面胀缝中设置传力杆的主要作用是（ ）。',o:['防止板块横向位移','传递荷载并允许板端自由伸缩','加强板的抗弯能力','防止纵缝张开'],a:'B',e:'传力杆采用光圆钢筋，一端固定、另一端涂沥青或加套管可滑动，既传递相邻板块间的荷载，又不妨碍板的伸缩。'},
{id:'gs035',kp:'gs14',t:1,d:1,q:'某桥多孔跨径总长为120m，单孔最大跨径为30m，按规定该桥属于（ ）。',o:['特大桥','大桥','中桥','小桥'],a:'B',e:'大桥：100m≤L≤1000m或40m≤Lk≤150m。按总长120m属于大桥（单孔30m属中桥），取较高者为大桥。'},
{id:'gs036',kp:'gs14',t:1,d:2,q:'某桥多孔跨径总长80m，单孔最大跨径45m，按规定该桥属于（ ）。',o:['特大桥','大桥','中桥','小桥'],a:'B',e:'总长80m属中桥（30<L<100），单孔45m属大桥（40≤Lk≤150）。两项标准中满足其一即可，按较高者定为大桥。'},
{id:'gs037',kp:'gs14',t:1,d:2,q:'桥面（或轨顶）标高至桥跨结构最下缘之间的距离称为（ ）。',o:['桥下净空高度','桥梁高度','建筑高度','容许建筑高度'],a:'C',e:'建筑高度是桥上行车路面（或轨顶）标高至桥跨结构最下缘的距离；桥下净空高度是设计洪水位或计算通航水位至桥跨结构最下缘的距离；桥梁高度是桥面与低水位（或地面）之间的高差。'},
{id:'gs038',kp:'gs14',t:1,d:1,q:'单孔跨径为4m的盖板式构造物应称为（ ）。',o:['小桥','涵洞','通道桥','中桥'],a:'B',e:'单孔跨径小于5m的称为涵洞；小桥为单孔跨径5m≤Lk<20m。'},
{id:'gs039',kp:'gs15',t:1,d:1,q:'钻孔灌注桩水下混凝土灌注时，首批混凝土灌注后导管埋入混凝土中的深度不应小于（ ）。',o:['0.5m','1.0m','2.0m','6.0m'],a:'B',e:'首批混凝土的数量应满足导管初次埋置深度不小于1.0m和填充导管底部间隙的需要。'},
{id:'gs040',kp:'gs15',t:1,d:2,q:'钻孔灌注桩水下混凝土灌注过程中，导管埋入混凝土中的深度宜控制在（ ）。',o:['0.5~1m','1~2m','2~6m','6~10m'],a:'C',e:'导管埋深宜控制在2~6m。埋深过浅易拔脱导管造成断桩，过深则提管困难、可能堵管。'},
{id:'gs041',kp:'gs15',t:2,d:2,q:'钻孔灌注桩施工中，护筒的作用有（ ）。',o:['固定桩位','引导钻头方向','隔离地表水','保护孔口防止坍塌','增加桩的承载力'],a:'ABCD',e:'护筒还能保持孔内水头高于地下水位，起稳定孔壁作用。护筒是临时设施，不增加桩的承载力。'},
{id:'gs042',kp:'gs15',t:1,d:2,q:'钻孔灌注桩施工中，泥浆的作用不包括（ ）。',o:['护壁','悬浮钻渣','冷却和润滑钻头','提高桩身混凝土强度'],a:'D',e:'泥浆主要起护壁防坍、悬浮携带钻渣、冷却润滑钻头的作用，与桩身混凝土强度无关。'},
{id:'gs043',kp:'gs16',t:1,d:1,q:'预应力筋张拉时，应采用的控制方式是（ ）。',o:['以伸长值控制为主，应力校核','以应力控制为主，伸长值校核','只控制应力','只控制伸长值'],a:'B',e:'预应力张拉采用双控，以应力控制为主，以伸长值进行校核。'},
{id:'gs044',kp:'gs16',t:1,d:2,q:'预应力筋张拉时，实际伸长值与理论伸长值的差值应控制在（ ）以内。',o:['±3%','±5%','±6%','±10%'],a:'C',e:'实际伸长值与理论伸长值的差值应控制在±6%以内，超出时应暂停张拉，查明原因并采取措施后方可继续。'},
{id:'gs045',kp:'gs16',t:1,d:2,q:'后张法预应力施工，设计未规定时，张拉时构件混凝土强度不应低于设计强度等级值的（ ）。',o:['70%','75%','80%','100%'],a:'C',e:'施加预应力时，构件混凝土强度应符合设计规定；设计未规定时，不应低于设计强度等级值的80%。'},
{id:'gs046',kp:'gs16',t:1,d:1,q:'先浇筑混凝土构件并预留孔道，待混凝土达到规定强度后再穿束张拉、锚固并压浆的预应力施工方法是（ ）。',o:['先张法','后张法','无粘结预应力法','体外预应力法'],a:'B',e:'后张法先浇筑构件预留孔道，后张拉锚固并孔道压浆；先张法先张拉预应力筋并锚固在台座上，再浇筑混凝土。'},
{id:'gs047',kp:'gs17',t:1,d:2,q:'悬臂浇筑施工中，挂篮质量与梁段混凝土质量的比值宜控制在（ ）。',o:['0.1~0.3','0.3~0.5','0.5~0.7','0.7~1.0'],a:'B',e:'挂篮质量与梁段混凝土的质量比值宜控制在0.3~0.5，特殊情况下不应超过0.7。'},
{id:'gs048',kp:'gs17',t:1,d:2,q:'多跨连续梁悬臂浇筑施工的合龙顺序一般为（ ）。',o:['先中跨，后次跨，再边跨','先边跨，后次跨，再中跨','先次跨，后边跨，再中跨','各跨同时合龙'],a:'B',e:'合龙顺序一般为先边跨、后次跨、再中跨，合龙段宜在一天中气温最低时浇筑。'},
{id:'gs049',kp:'gs18',t:1,d:1,q:'新奥法施工的基本原则是（ ）。',o:['少扰动、早喷锚、勤量测、紧封闭','强爆破、快出渣、晚支护、厚衬砌','先衬砌、后开挖','大断面、快速度、少支护'],a:'A',e:'新奥法充分利用围岩自承能力，基本原则为“少扰动、早喷锚、勤量测、紧封闭”。'},
{id:'gs050',kp:'gs18',t:1,d:1,q:'公路隧道围岩分级中，稳定性最差的是（ ）级围岩。',o:['I','III','V','VI'],a:'D',e:'公路隧道围岩分为I~VI级，I级最好，VI级最差。'},
{id:'gs051',kp:'gs18',t:1,d:2,q:'复合式衬砌隧道的二次衬砌，应在（ ）后施作。',o:['开挖完成','初期支护施作完成','围岩和初期支护变形基本稳定','仰拱施工前'],a:'C',e:'二次衬砌应在围岩和初期支护变形基本稳定后施作；对于围岩变形大、流变特性明显的地段，应加强初期支护并适时施作。'},
{id:'gs052',kp:'gs19',t:1,d:2,q:'下列隧道监控量测项目中，属于选测项目的是（ ）。',o:['洞内外观察','周边位移','拱顶下沉','围岩压力'],a:'D',e:'洞内外观察、周边位移、拱顶下沉、地表沉降（浅埋段）等为必测项目；围岩压力、钢架内力、锚杆轴力等为选测项目。'},
{id:'gs053',kp:'gs19',t:1,d:2,q:'隧道超前地质预报中，TSP（隧道地震波预报）属于（ ）。',o:['地质调查法','物探法','超前钻探法','超前导洞法'],a:'B',e:'TSP利用地震波反射原理探测前方地质情况，属于物探法，适用于较长距离预报；地质雷达也属物探法，适用于短距离预报。'},
{id:'gs054',kp:'gs20',t:1,d:2,q:'隧道全断面开挖法一般适用于（ ）围岩。',o:['I~III级','IV~V级','V~VI级','所有级别'],a:'A',e:'全断面法适用于I~III级围岩，工序简单、作业空间大；软弱围岩宜采用台阶法、CD/CRD法或双侧壁导坑法。'},
{id:'gs055',kp:'gs20',t:1,d:1,q:'隧道洞口施工应遵循的原则是（ ）。',o:['早进早出','早进晚出','晚进早出','晚进晚出'],a:'B',e:'洞口施工遵循“早进晚出”原则，尽量减少对洞口边仰坡的开挖扰动，保证洞口稳定。'},
{id:'gs056',kp:'gs20',t:1,d:3,q:'某城市浅埋大跨度隧道穿越软弱围岩，地表有重要建筑物，对地表沉降控制要求严格，宜采用的开挖方法是（ ）。',o:['全断面法','台阶法','双侧壁导坑法','环形开挖留核心土法'],a:'C',e:'双侧壁导坑法将断面分块开挖、及时封闭，对围岩扰动小、沉降控制效果好，适用于浅埋、大跨、软弱围岩及地表沉降要求严格的情况。'},
{id:'gs057',kp:'gs21',t:1,d:1,q:'用于防止夜间行车时对向车辆前照灯造成眩目的交通安全设施是（ ）。',o:['隔离栅','防眩设施','轮廓标','防落物网'],a:'B',e:'防眩设施设置在中央分隔带上，遮挡对向车灯眩光。隔离栅阻止人畜进入；轮廓标属视线诱导设施。'},
{id:'gs058',kp:'gs21',t:2,d:1,q:'下列设施中，属于公路交通安全设施的有（ ）。',o:['交通标志','交通标线','护栏','收费系统','隔离栅'],a:'ABCE',e:'收费系统属于机电工程（交通机电设施），不属于交通安全设施。'},
{id:'gs059',kp:'gs22',t:1,d:1,q:'根据JTG F80/1-2017，公路工程质量检验评定的基本单元是（ ）。',o:['单位工程','分部工程','分项工程','检验批'],a:'C',e:'工程质量检验评定以分项工程为基本单元，采用合格率评定法，逐级评定分部工程、单位工程和合同段、建设项目。'},
{id:'gs060',kp:'gs22',t:1,d:2,q:'根据JTG F80/1-2017，土建工程分项工程实测项目中，关键项目的合格率不应低于（ ），一般项目的合格率不应低于（ ）。',o:['90%；80%','95%；80%','95%；85%','100%；90%'],a:'B',e:'关键项目合格率不低于95%（机电工程为100%），一般项目合格率不低于80%；有规定极值的检查项目，任一单个检测值不得突破极值。'},
{id:'gs061',kp:'gs22',t:1,d:2,q:'根据JTG F80/1-2017，土方路基实测项目中的关键项目是（ ）。',o:['纵断高程和中线偏位','压实度和弯沉','宽度和平整度','横坡和边坡'],a:'B',e:'土方路基的关键项目为压实度和弯沉，其余为一般项目。'},
{id:'gs062',kp:'gs22',t:1,d:1,q:'根据JTG F80/1-2017，公路工程质量评定等级分为（ ）。',o:['优良、合格、不合格','合格、不合格','优秀、良好、合格、不合格','甲、乙、丙'],a:'B',e:'2017版评定标准中，工程质量等级只分合格与不合格两级。'},
{id:'gs063',kp:'gs23',t:1,d:1,q:'公路工程交工验收由（ ）负责组织。',o:['施工单位','监理单位','项目法人','交通运输主管部门'],a:'C',e:'交工验收由项目法人组织；竣工验收由交通运输主管部门按项目管理权限组织。'},
{id:'gs064',kp:'gs23',t:1,d:2,q:'公路工程竣工验收应在通车试运营（ ）以上后进行。',o:['6个月','1年','2年','3年'],a:'C',e:'通车试运营2年以上是公路工程竣工验收的条件之一。'},
{id:'gs065',kp:'gs23',t:1,d:2,q:'公路工程竣工验收时，工程质量评分为86分，则工程质量等级为（ ）。',o:['优良','合格','不合格','良好'],a:'B',e:'竣工验收工程质量评分≥90分为优良，75分≤评分<90分为合格，<75分为不合格。86分为合格。'},
{id:'gs066',kp:'gs24',t:1,d:2,q:'某高速公路施工中，特大桥的结构型式发生变化，该设计变更属于（ ），应由（ ）审批。',o:['重大设计变更；交通运输部','较大设计变更；省级交通运输主管部门','一般设计变更；项目法人','重大设计变更；省级交通运输主管部门'],a:'A',e:'特大桥数量或结构型式发生变化属于重大设计变更，由交通运输部负责审批。'},
{id:'gs067',kp:'gs24',t:1,d:2,q:'公路工程路面结构类型、宽度和厚度发生变化，属于（ ）。',o:['重大设计变更','较大设计变更','一般设计变更','不属于设计变更'],a:'B',e:'路面结构类型、宽度和厚度发生变化属于较大设计变更，由省级交通运输主管部门负责审批。'},
{id:'gs068',kp:'gs25',t:1,d:2,q:'根据财资〔2022〕136号，公路工程施工企业安全生产费用的提取标准为建筑安装工程造价的（ ）。',o:['1.5%','2.0%','3.0%','3.5%'],a:'A',e:'公路工程、市政公用工程、港口与航道工程为1.5%；房屋建筑工程、铁路工程、城市轨道交通工程为3%；矿山工程为3.5%。'},
{id:'gs069',kp:'gs25',t:1,d:1,q:'关于施工企业安全生产费用的说法，正确的是（ ）。',o:['可以作为竞争性报价','应专款专用，不得挪作他用','可由施工单位自行决定是否提取','只能用于支付安全管理人员工资'],a:'B',e:'安全生产费用应按规定标准提取、专款专用，不得作为竞争性报价，不得挪用。'},
{id:'gs070',kp:'gs26',t:1,d:1,q:'下列构造物中，不论跨径大小和孔数多少均称为涵洞的是（ ）。',o:['盖板涵','拱涵','箱涵','板桥'],a:'C',e:'圆管涵和箱涵不论管径或跨径大小、孔数多少，均称为涵洞。盖板涵、拱涵单孔跨径小于5m时称为涵洞。'}
);

// 建设工程经济
KP.push(
{id:'jj01',s:'jj',n:'资金时间价值与单利/复利',imp:0,tip:'影响资金时间价值的因素：使用时间、数量多少、投入与回收特点、周转速度。复利 F=P(1+i)^n；单利 F=P(1+n·i)。'},
{id:'jj02',s:'jj',n:'名义利率与有效利率',imp:1,tip:'有效年利率 i_eff=(1+r/m)^m−1；计息周期小于一年时，有效利率>名义利率，计息次数越多差距越大。'},
{id:'jj03',s:'jj',n:'资金等值计算',imp:1,tip:'F=P(1+i)^n；F=A[(1+i)^n−1]/i；P=A[1−(1+i)^−n]/i。现金流量图三要素：大小、方向、作用点。'},
{id:'jj04',s:'jj',n:'经济效果评价指标体系',imp:1,tip:'静态：总投资收益率、资本金净利润率、静态投资回收期；动态：财务净现值、财务内部收益率、动态回收期。FNPV≥0、FIRR≥ic 可行；ic 提高 FNPV 减小，FIRR 不变。'},
{id:'jj05',s:'jj',n:'静态投资回收期',imp:1,tip:'Pt=(累计净现金流量出现正值的年份−1)+上一年累计净现金流量绝对值/当年净现金流量。缺点：未考虑回收期以后的现金流量。'},
{id:'jj06',s:'jj',n:'财务净现值',imp:1,tip:'FNPV=Σ(CI−CO)t(1+ic)^−t；寿命期相同的互斥方案，选 FNPV 最大者。'},
{id:'jj07',s:'jj',n:'盈亏平衡分析',imp:1,tip:'BEP(Q)=年固定成本/(单价−单位可变成本−单位产品税金及附加)；生产能力利用率=BEP(Q)/设计生产能力。盈亏平衡点越低，抗风险能力越强。'},
{id:'jj08',s:'jj',n:'敏感性分析',imp:0,tip:'敏感度系数 S=(ΔA/A)/(ΔF/F)，绝对值越大越敏感；临界点越低越敏感。敏感性分析不能说明不确定因素发生的概率。'},
{id:'jj09',s:'jj',n:'设备磨损、补偿与经济寿命',imp:1,tip:'有形磨损：第一种（使用中）、第二种（闲置中自然力）；无形磨损：第一种（再生产价值降低）、第二种（出现更先进设备）。局部补偿：有形→修理，无形→现代化改装；完全补偿→更新。沉没成本=账面价值−当前市场价值。经济寿命：年平均使用成本最低的年限。'},
{id:'jj10',s:'jj',n:'设备租赁',imp:0,tip:'附加率法：R=P(1+N·i)/N+P·r。租赁不足：承租人无所有权，不能担保抵押；总费用通常高于购置；长年支付租金形成长期负债。'},
{id:'jj11',s:'jj',n:'价值工程',imp:1,tip:'V=F/C；核心是功能分析；提高价值五途径（双向型、改进型、节约型、投资型、牺牲型）。V<1 表示成本偏高，应作为改进对象。'},
{id:'jj12',s:'jj',n:'会计要素与会计基础',imp:0,tip:'资产=负债+所有者权益（静态）；收入−费用=利润（动态）。会计核算以权责发生制为基础。'},
{id:'jj13',s:'jj',n:'成本与费用',imp:1,tip:'期间费用：管理费用、销售费用、财务费用（利息支出、汇兑损失、手续费等）。项目经理部为组织管理施工发生的费用计入工程成本中的间接费用；企业行政管理部门的费用计入管理费用。'},
{id:'jj14',s:'jj',n:'收入的确认（履约进度）',imp:1,tip:'收入确认五步法：识别合同→识别履约义务→确定交易价格→分摊交易价格→履行履约义务时确认收入。某一时段内履行的履约义务按履约进度确认收入。'},
{id:'jj15',s:'jj',n:'利润的计算',imp:0,tip:'利润总额=营业利润+营业外收入−营业外支出；净利润=利润总额−所得税费用。罚款、公益性捐赠、非常损失属于营业外支出。'},
{id:'jj16',s:'jj',n:'财务分析指标',imp:1,tip:'流动比率=流动资产/流动负债；速动比率=(流动资产−存货)/流动负债；杜邦：净资产收益率=销售净利率×总资产周转率×权益乘数，权益乘数=1/(1−资产负债率)。'},
{id:'jj17',s:'jj',n:'资金成本',imp:0,tip:'资金成本=资金占用费/(筹资总额−筹资费)；借款资金成本=年利率×(1−所得税率)/(1−筹资费率)。利息、股利属占用费；手续费、发行费属筹资费。'},
{id:'jj18',s:'jj',n:'营运资金管理',imp:0,tip:'放弃现金折扣成本=折扣率/(1−折扣率)×360/(信用期−折扣期)；成本分析模式下最佳现金持有量是机会成本、管理成本、短缺成本之和最小；经济订货量 Q*=√(2KD/K2)。'},
{id:'jj19',s:'jj',n:'建设项目总投资与预备费',imp:1,tip:'建设投资=工程费用（建安工程费+设备及工器具购置费）+工程建设其他费用+预备费；总投资还包括建设期利息和流动资金。基本预备费=(工程费用+工程建设其他费用)×费率。'},
{id:'jj20',s:'jj',n:'建设期利息',imp:1,tip:'贷款年内均衡发放时，当年借款按半年计息：qj=(Pj−1+Aj/2)×i，上年利息计入下年本金。'},
{id:'jj21',s:'jj',n:'建筑安装工程费用构成（按要素）',imp:1,tip:'依据建标〔2013〕44号：人工费、材料费、施工机具使用费、企业管理费、利润、规费、税金。检验试验费、工会经费、职工教育经费、劳动保护费等属于企业管理费；职工福利费不属于人工费。'},
{id:'jj22',s:'jj',n:'工程量清单计价',imp:0,tip:'安全文明施工费不得作为竞争性费用。暂列金额用于签约时尚未确定或不可预见的采购、变更、价款调整、索赔、签证等费用。'},
{id:'jj23',s:'jj',n:'预付款、进度款与质量保证金',imp:1,tip:'预付款原则上不低于合同金额10%、不高于30%；政府机关、事业单位、国有企业工程进度款支付不低于已完工程价款的80%（财建〔2022〕183号）；质量保证金不超过结算总额3%；缺陷责任期一般1年，最长不超过2年。'},
{id:'jj24',s:'jj',n:'工程定额',imp:0,tip:'时间定额×产量定额=1；材料总消耗量=净用量×(1+损耗率)，损耗率=损耗量/净用量。施工定额属于企业定额性质，项目划分最细，是编制预算定额的基础。'},
{id:'jj25',s:'jj',n:'固定资产折旧',imp:0,tip:'年数总和法：(原值−净残值)×尚可使用年数/年数总和；双倍余额递减法：年折旧率=2/年限，按期初账面净值计提（最后两年改直线法）。'}
);
QB.push(
{id:'jj001',kp:'jj01',t:1,d:1,q:'某施工企业向银行借款100万元，年利率6%，按年复利计息，3年末一次还本付息，应还本利和为（ ）万元。',o:['118.00','119.10','112.36','106.00'],a:'B',e:'F=P(1+i)^n=100×1.06³=119.10万元。118.00是按单利计算的结果（100×(1+3×6%)），属于常见干扰项。'},
{id:'jj002',kp:'jj01',t:1,d:2,q:'某企业借款1000万元，期限3年，年利率8%，按年复利计息，到期一次还本付息，则3年共需支付的利息为（ ）万元。',o:['240.00','259.71','1259.71','280.49'],a:'B',e:'利息=本利和−本金=1000×(1.08³−1)=259.71万元。240.00为单利利息；1259.71是本利和而非利息，注意审题。'},
{id:'jj003',kp:'jj01',t:2,d:1,q:'影响资金时间价值的主要因素有（ ）。',o:['资金的使用时间','资金数量的多少','资金投入和回收的特点','资金周转的速度','资金的来源渠道'],a:'ABCD',e:'影响资金时间价值的因素包括：资金的使用时间、资金数量的多少、资金投入和回收的特点、资金周转的速度。资金来源渠道不影响资金时间价值。'},
{id:'jj004',kp:'jj02',t:1,d:1,q:'名义年利率为12%，按月复利计息，则有效年利率为（ ）。',o:['12.00%','12.36%','12.55%','12.68%'],a:'D',e:'i_eff=(1+12%/12)^12−1=12.68%。12.36%是按半年计息、12.55%是按季度计息的结果。'},
{id:'jj005',kp:'jj02',t:1,d:2,q:'年名义利率为8%，按季度复利计息，则半年的有效利率为（ ）。',o:['4.00%','4.04%','8.24%','8.00%'],a:'B',e:'季度利率=8%/4=2%，半年含2个计息周期，半年有效利率=(1+2%)²−1=4.04%。8.24%是有效年利率。'},
{id:'jj006',kp:'jj02',t:1,d:1,q:'当计息周期小于一年时，关于名义利率与有效年利率的说法，正确的是（ ）。',o:['有效年利率小于名义利率','有效年利率等于名义利率','有效年利率大于名义利率，且一年内计息次数越多，有效年利率越大','有效年利率与计息次数无关'],a:'C',e:'计息周期小于一年时，由于周期内利息再生利息，有效年利率大于名义利率；年内计息次数越多，有效年利率越高。只有按年计息时两者才相等。'},
{id:'jj007',kp:'jj03',t:1,d:1,q:'某人每年年末存入银行10万元，年利率5%，按年复利计息，第5年末可得本利和为（ ）万元。',o:['50.00','52.50','55.26','63.81'],a:'C',e:'等额支付终值 F=A[(1+i)^n−1]/i=10×(1.05^5−1)/0.05=55.26万元。'},
{id:'jj008',kp:'jj03',t:1,d:2,q:'某项目希望在今后5年内每年年末等额回收20万元，年利率8%，按年复利计息，则现在应投资（ ）万元。',o:['79.85','100.00','92.59','117.33'],a:'A',e:'等额支付现值 P=A[1−(1+i)^−n]/i=20×(1−1.08^−5)/0.08=79.85万元。117.33是把20万元按5年等额终值计算的结果，方向错了。'},
{id:'jj009',kp:'jj03',t:1,d:1,q:'某企业计划在第3年末获得100万元，年利率6%，按年复利计息，现在应一次存入（ ）万元。',o:['82.00','83.96','94.34','119.10'],a:'B',e:'P=F/(1+i)^n=100/1.06³=83.96万元。'},
{id:'jj010',kp:'jj03',t:1,d:1,q:'绘制现金流量图时，需要把握的现金流量三要素是（ ）。',o:['现金流量的大小、方向和作用点','现金流量的大小、利率和期数','现金流入、现金流出和净现金流量','现值、终值和年值'],a:'A',e:'现金流量三要素：现金流量的大小（数额）、方向（流入或流出）和作用点（发生的时间点）。'},
{id:'jj011',kp:'jj04',t:1,d:1,q:'下列技术方案经济效果评价指标中，属于动态评价指标的是（ ）。',o:['总投资收益率','静态投资回收期','财务内部收益率','资本金净利润率'],a:'C',e:'动态评价指标考虑资金时间价值，包括财务净现值、财务内部收益率、动态投资回收期等。其余三项均为静态指标。'},
{id:'jj012',kp:'jj04',t:2,d:2,q:'关于财务净现值指标的说法，正确的有（ ）。',o:['FNPV≥0时，技术方案在经济上可行','计算FNPV需要事先确定基准收益率','FNPV能够直接说明技术方案单位投资的使用效率','FNPV考虑了技术方案整个计算期内的经济状况','FNPV不受基准收益率高低的影响'],a:'ABD',e:'FNPV是绝对指标，不能直接说明单位投资的使用效率（C错）；其计算依赖基准收益率，ic越高FNPV越小（E错）。'},
{id:'jj013',kp:'jj04',t:1,d:2,q:'对于常规技术方案，若基准收益率提高，则方案的财务净现值和财务内部收益率的变化是（ ）。',o:['FNPV减小，FIRR不变','FNPV增大，FIRR不变','FNPV减小，FIRR减小','FNPV不变，FIRR增大'],a:'A',e:'FIRR由方案自身现金流量决定，与基准收益率无关；常规方案的FNPV随折现率提高而减小。'},
