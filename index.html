{id:'jj014',kp:'jj04',t:1,d:3,q:'某常规技术方案，当折现率为10%时FNPV=50万元，当折现率为12%时FNPV=−30万元，用线性内插法求得FIRR近似为（ ）。',o:['10.75%','11.00%','11.25%','11.50%'],a:'C',e:'FIRR≈10%+(12%−10%)×50/(50+30)=11.25%。'},
{id:'jj015',kp:'jj05',t:1,d:1,q:'某项目建设期1年，第1年投资1000万元；第2年起每年净收益250万元。自建设开始年算起，静态投资回收期为（ ）年。',o:['4','4.5','5','6'],a:'C',e:'投产后需1000/250=4年收回投资，加上1年建设期，自建设开始年算起为5年。注意题目问的是从哪一年算起。'},
{id:'jj016',kp:'jj05',t:1,d:2,q:'某项目各年净现金流量（万元）为：第1年−600，第2年−400，第3年300，第4年400，第5年500，第6年500。该项目静态投资回收期为（ ）年。',o:['4.0','4.4','4.6','5.0'],a:'C',e:'累计净现金流量：−600、−1000、−700、−300、200……第5年转正。Pt=(5−1)+300/500=4.6年。'},
{id:'jj017',kp:'jj05',t:1,d:1,q:'静态投资回收期指标的主要缺点是（ ）。',o:['计算复杂，不易理解','不能反映资本的周转速度','没有考虑投资回收以后的现金流量','需要事先确定基准收益率'],a:'C',e:'静态投资回收期简单直观，能反映资本周转速度；缺点是不考虑资金时间价值，且只考虑回收之前的效果，不能反映回收以后的情况。'},
{id:'jj018',kp:'jj06',t:1,d:2,q:'某方案第0年初始投资1000万元，第1~5年每年末净现金流量300万元，基准收益率10%，则该方案的财务净现值为（ ）万元。（(P/A,10%,5)=3.7908）',o:['137.24','500.00','−137.24','372.48'],a:'A',e:'FNPV=−1000+300×3.7908=137.24万元。500是未折现的净现金流量合计。'},
{id:'jj019',kp:'jj06',t:1,d:1,q:'对于计算期相同的互斥方案，用财务净现值进行比选时，应选择（ ）的方案。',o:['财务净现值最大','财务净现值最小','投资额最小','财务净现值等于零'],a:'A',e:'计算期相同的互斥方案，在FNPV≥0的前提下，选财务净现值最大的方案。'},
{id:'jj020',kp:'jj07',t:1,d:2,q:'某项目设计年产量10万件，年固定成本1500万元，单位产品售价600元，单位产品可变成本300元，单位产品税金及附加50元。以产量表示的盈亏平衡点为（ ）万件。',o:['5.0','6.0','6.5','7.5'],a:'B',e:'BEP(Q)=15000000/(600−300−50)=60000件=6万件。'},
{id:'jj021',kp:'jj07',t:1,d:1,q:'某项目设计生产能力10万件，以产量表示的盈亏平衡点为6万件，则以生产能力利用率表示的盈亏平衡点为（ ）。',o:['40%','60%','66.7%','166.7%'],a:'B',e:'BEP(%)=BEP(Q)/设计生产能力=6/10=60%。'},
{id:'jj022',kp:'jj07',t:1,d:1,q:'关于盈亏平衡点的说法，正确的是（ ）。',o:['盈亏平衡点越高，方案抗风险能力越强','盈亏平衡点越低，方案抗风险能力越强','盈亏平衡点与固定成本无关','盈亏平衡分析能揭示风险产生的根源'],a:'B',e:'盈亏平衡点越低，达到此点的产量越少，方案投产后盈利的可能性越大，适应市场变化和抗风险能力越强。盈亏平衡分析不能揭示风险根源。'},
{id:'jj023',kp:'jj08',t:1,d:2,q:'某方案分析中，当建设投资增加10%时，财务净现值由200万元降至160万元，则FNPV对建设投资的敏感度系数为（ ）。',o:['−2.0','2.0','−0.5','0.5'],a:'A',e:'S=(ΔA/A)/(ΔF/F)=(−40/200)/10%=−20%/10%=−2.0。负号表示评价指标与不确定因素反方向变化。'},
{id:'jj024',kp:'jj08',t:2,d:2,q:'关于敏感性分析的说法，正确的有（ ）。',o:['敏感度系数绝对值越大，评价指标对该因素越敏感','敏感度系数为正，说明评价指标与不确定因素同方向变化','临界点百分比越高，说明该因素越敏感','敏感性分析可以确定不确定因素发生变动的概率','临界点可以用临界点百分比或临界值表示'],a:'ABE',e:'临界点越低（百分比越小），说明该因素越敏感，C错；敏感性分析不能说明不确定因素发生变动的可能性大小（概率），D错。'},
{id:'jj025',kp:'jj09',t:1,d:1,q:'由于技术进步，社会上出现了结构更先进、效率更高的同类设备，使原有设备相对贬值，这种磨损属于（ ）。',o:['第一种有形磨损','第二种有形磨损','第一种无形磨损','第二种无形磨损'],a:'D',e:'第二种无形磨损由技术进步、出现更先进设备引起；第一种无形磨损是同类设备再生产价值降低。'},
{id:'jj026',kp:'jj09',t:1,d:1,q:'设备在闲置过程中受自然力作用产生的实体磨损，如金属件生锈、橡胶件老化，属于（ ）。',o:['第一种有形磨损','第二种有形磨损','第一种无形磨损','第二种无形磨损'],a:'B',e:'使用过程中外力作用产生的为第一种有形磨损；闲置中受自然力作用产生的为第二种有形磨损。'},
{id:'jj027',kp:'jj09',t:1,d:2,q:'设备无形磨损的局部补偿方式是（ ）。',o:['大修理','日常维修','现代化改装','更新'],a:'C',e:'有形磨损的局部补偿是修理，无形磨损的局部补偿是现代化改装，两种磨损的完全补偿都是更新。'},
{id:'jj028',kp:'jj09',t:1,d:2,q:'某设备原值100万元，已计提折旧60万元，目前市场价值为25万元，进行更新分析时，该设备的沉没成本为（ ）万元。',o:['15','25','40','60'],a:'A',e:'沉没成本=设备账面价值−当前市场价值=(100−60)−25=15万元。更新决策时不应考虑沉没成本。'},
{id:'jj029',kp:'jj09',t:1,d:1,q:'设备的经济寿命是指（ ）。',o:['设备从投入使用到报废为止的全部时间','设备从投入使用到因技术落后被淘汰的时间','设备从投入使用到年平均使用成本最低的使用年限','设备从投入使用到折旧计提完毕的时间'],a:'C',e:'A为自然寿命（物质寿命），B为技术寿命，C为经济寿命。经济寿命是确定设备最佳更新时机的依据。'},
{id:'jj030',kp:'jj10',t:1,d:2,q:'某设备价格68万元，租期5年，每年年末支付租金，折现率10%，附加率4%，按附加率法计算每年租金为（ ）万元。',o:['16.32','20.40','23.12','27.20'],a:'C',e:'R=P(1+N·i)/N+P·r=68×(1+5×10%)/5+68×4%=20.40+2.72=23.12万元。'},
{id:'jj031',kp:'jj10',t:1,d:1,q:'下列属于设备租赁不足之处的是（ ）。',o:['需要一次性支付大量资金','不能获得税收方面的好处','在租赁期间承租人对设备没有所有权，不能用于担保、抵押贷款','设备陈旧过时的风险全部由承租人承担'],a:'C',e:'租赁的优点包括少占用资金、租金可在税前扣除、可减少设备陈旧过时的风险等；不足包括无所有权不能担保抵押、总费用通常比购置高、长期支付租金形成长期负债。'},
{id:'jj032',kp:'jj11',t:1,d:1,q:'价值工程的核心是（ ）。',o:['降低成本','提高功能','对研究对象进行功能分析','确定价值系数'],a:'C',e:'价值工程的核心是对产品进行功能分析，以最低的寿命周期成本可靠地实现必要功能。'},
{id:'jj033',kp:'jj11',t:2,d:1,q:'下列情形中，能够提高价值的途径有（ ）。',o:['功能提高，成本不变','功能不变，成本降低','功能大幅提高，成本较少提高','功能降低，成本提高','功能略有下降，成本大幅度降低'],a:'ABCE',e:'V=F/C。D项功能降低而成本提高，价值必然下降。E项为“牺牲型”途径，在满足用户需求的前提下可以采用。'},
{id:'jj034',kp:'jj11',t:1,d:2,q:'某部件功能评价系数为0.20，成本系数为0.25，则其价值系数及改进方向为（ ）。',o:['0.80，成本偏高，应作为改进对象','1.25，功能偏高，应降低功能','0.80，功能过剩，应提高成本','1.25，成本偏高，应降低成本'],a:'A',e:'V=0.20/0.25=0.80<1，说明成本比重大于功能比重，成本偏高，应列为改进对象，着重降低成本。'},
{id:'jj035',kp:'jj12',t:1,d:1,q:'反映企业某一时点财务状况的会计等式是（ ）。',o:['收入−费用=利润','资产=负债+所有者权益','资产+负债=所有者权益','收入=费用+利润−所得税'],a:'B',e:'资产=负债+所有者权益是静态会计等式（编制资产负债表的依据）；收入−费用=利润是动态会计等式（编制利润表的依据）。'},
{id:'jj036',kp:'jj12',t:2,d:1,q:'下列会计要素中，反映企业经营成果的有（ ）。',o:['收入','资产','费用','利润','负债'],a:'ACD',e:'反映财务状况的要素：资产、负债、所有者权益；反映经营成果的要素：收入、费用、利润。'},
{id:'jj037',kp:'jj12',t:1,d:2,q:'某企业2026年12月一次性支付2027年全年的财产保险费，按照权责发生制，该笔费用应（ ）。',o:['全部计入2026年12月的费用','全部计入2027年1月的费用','在2027年各月分摊确认为费用','不确认为费用'],a:'C',e:'权责发生制以权利义务是否发生为标准确认收入费用，不以款项收付为准。保险费受益期为2027年全年，应在2027年各月分摊。'},
{id:'jj038',kp:'jj13',t:1,d:1,q:'下列施工企业发生的支出中，应计入财务费用的是（ ）。',o:['短期借款的利息支出','行政管理人员工资','广告费','业务招待费'],a:'A',e:'财务费用包括利息支出、汇兑损失、相关手续费等；行政管理人员工资和业务招待费属于管理费用；广告费属于销售费用。'},
{id:'jj039',kp:'jj13',t:1,d:2,q:'施工企业项目经理部管理人员的工资，应计入（ ）。',o:['管理费用','工程成本中的间接费用','工程成本中的人工费','销售费用'],a:'B',e:'项目经理部为组织和管理工程施工发生的费用计入工程成本的间接费用；企业行政管理部门发生的管理人员工资计入管理费用。直接人工费仅指直接从事施工的工人工资。'},
{id:'jj040',kp:'jj14',t:1,d:1,q:'按照企业会计准则，收入确认“五步法”的第一步是（ ）。',o:['确定交易价格','识别合同中的单项履约义务','识别与客户订立的合同','履行履约义务时确认收入'],a:'C',e:'五步法顺序：识别与客户订立的合同→识别单项履约义务→确定交易价格→将交易价格分摊至各单项履约义务→履行各单项履约义务时确认收入。'},
{id:'jj041',kp:'jj14',t:1,d:3,q:'某施工合同总价款5000万元，预计总成本4000万元，按已发生成本占预计总成本的比例确定履约进度。第1年末累计发生成本1200万元，第2年末累计发生成本2800万元（预计总成本不变），则第2年应确认的收入为（ ）万元。',o:['1500','2000','2800','3500'],a:'B',e:'第1年进度30%，确认收入1500万元；第2年末累计进度70%，累计收入3500万元；第2年应确认3500−1500=2000万元。'},
{id:'jj042',kp:'jj15',t:1,d:2,q:'某企业年度营业收入8000万元，营业成本6000万元，税金及附加200万元，管理费用500万元，财务费用100万元，营业外收入50万元，营业外支出30万元，则利润总额为（ ）万元。',o:['1200','1220','1250','1170'],a:'B',e:'营业利润=8000−6000−200−500−100=1200万元；利润总额=1200+50−30=1220万元。'},
{id:'jj043',kp:'jj15',t:1,d:1,q:'下列支出中，属于营业外支出的是（ ）。',o:['罚款支出','材料采购运杂费','借款利息','管理人员差旅费'],a:'A',e:'营业外支出是与日常经营活动无直接关系的支出，如罚款支出、公益性捐赠支出、非常损失等。'},
{id:'jj044',kp:'jj16',t:1,d:1,q:'某企业流动资产1200万元，其中存货400万元，流动负债800万元，则速动比率为（ ）。',o:['0.50','1.00','1.50','2.00'],a:'B',e:'速动比率=(流动资产−存货)/流动负债=(1200−400)/800=1.00；流动比率=1200/800=1.50。'},
{id:'jj045',kp:'jj16',t:1,d:3,q:'某企业销售净利率5%，总资产周转率1.2次，资产负债率50%，根据杜邦分析体系，其净资产收益率为（ ）。',o:['3%','6%','12%','15%'],a:'C',e:'权益乘数=1/(1−50%)=2；净资产收益率=5%×1.2×2=12%。'},
{id:'jj046',kp:'jj16',t:2,d:1,q:'下列财务分析指标中，用于分析企业偿债能力的有（ ）。',o:['资产负债率','总资产周转率','流动比率','净资产收益率','速动比率'],a:'ACE',e:'偿债能力：资产负债率、流动比率、速动比率；营运能力：总资产周转率等；盈利能力：净资产收益率等。'},
{id:'jj047',kp:'jj17',t:1,d:2,q:'某企业取得长期借款1000万元，年利率6%，筹资费率0.5%，企业所得税税率25%，则该借款的资金成本率为（ ）。',o:['4.50%','4.52%','6.00%','6.03%'],a:'B',e:'K=6%×(1−25%)/(1−0.5%)=4.5%/0.995≈4.52%。借款利息可在税前扣除，因此要乘以(1−所得税率)。'},
{id:'jj048',kp:'jj17',t:1,d:1,q:'下列各项中，属于资金占用费的是（ ）。',o:['借款手续费','股票发行费','借款利息','资信评估费'],a:'C',e:'资金成本包括筹资费和资金占用费。占用费是使用资金过程中支付的报酬，如利息、股利；手续费、发行费等是筹资费。'},
{id:'jj049',kp:'jj18',t:1,d:2,q:'某供应商给出的信用条件为“2/10，n/30”，企业若放弃现金折扣，其放弃现金折扣的成本约为（ ）。（一年按360天计）',o:['2.00%','24.49%','36.73%','73.47%'],a:'C',e:'放弃现金折扣成本=2%/(1−2%)×360/(30−10)=36.73%。'},
{id:'jj050',kp:'jj18',t:1,d:2,q:'采用成本分析模式确定最佳现金持有量时，与现金持有量呈同方向变化的成本是（ ）。',o:['机会成本','短缺成本','转换成本','管理成本'],a:'A',e:'持有现金越多，机会成本越大；短缺成本则随持有量增加而减少；管理成本属固定成本。最佳持有量是三者之和最小时的持有量。'},
{id:'jj051',kp:'jj18',t:1,d:3,q:'某企业年需要某材料7200吨，每次订货的变动成本为400元，单位材料年储存成本16元/吨，则经济订货批量为（ ）吨。',o:['300','450','600','900'],a:'C',e:'Q*=√(2KD/K2)=√(2×400×7200/16)=√360000=600吨。'},
{id:'jj052',kp:'jj19',t:1,d:1,q:'某项目工程费用8000万元，工程建设其他费用1500万元，基本预备费率5%，则基本预备费为（ ）万元。',o:['400','475','75','500'],a:'B',e:'基本预备费=(工程费用+工程建设其他费用)×费率=(8000+1500)×5%=475万元。'},
{id:'jj053',kp:'jj19',t:2,d:2,q:'下列费用中，属于建设投资的有（ ）。',o:['设备及工器具购置费','建筑安装工程费','建设期利息','基本预备费','流动资金'],a:'ABD',e:'建设投资=工程费用（建安工程费+设备及工器具购置费）+工程建设其他费用+预备费。建设期利息和流动资金属于总投资，但不属于建设投资。'},
{id:'jj054',kp:'jj19',t:1,d:3,q:'某项目建设前期1年，建设期2年，年度静态投资计划为第1年2000万元、第2年3000万元，年均投资价格上涨率5%，则建设期价差预备费约为（ ）万元。',o:['250.00','541.04','389.18','151.86'],a:'B',e:'PFt=It[(1+f)^m(1+f)^0.5(1+f)^(t−1)−1]，m=1。第1年：2000×(1.05^1.5−1)=151.86；第2年：3000×(1.05^2.5−1)=389.18；合计541.04万元。'},
{id:'jj055',kp:'jj20',t:1,d:2,q:'某项目建设期2年，第1年贷款600万元，第2年贷款400万元，年利率8%，贷款在年内均衡发放，建设期只计息不支付，则建设期利息合计为（ ）万元。',o:['80.00','89.92','65.92','96.00'],a:'B',e:'q1=600/2×8%=24万元；q2=(600+24+400/2)×8%=65.92万元；合计89.92万元。'},
{id:'jj056',kp:'jj21',t:1,d:2,q:'根据建标〔2013〕44号文，按费用构成要素划分，下列费用中不包含在材料单价中的是（ ）。',o:['材料原价','运杂费','运输损耗费','检验试验费'],a:'D',e:'材料单价由材料原价、运杂费、运输损耗费、采购及保管费组成。一般鉴定、检查发生的检验试验费列入企业管理费。'},
{id:'jj057',kp:'jj21',t:2,d:2,q:'根据建标〔2013〕44号文，下列费用中属于企业管理费的有（ ）。',o:['工会经费','职工教育经费','施工机械检修费','劳动保护费','住房公积金'],a:'ABD',e:'施工机械检修费属于施工机具使用费（台班单价组成）；住房公积金属于规费。'},
{id:'jj058',kp:'jj21',t:1,d:1,q:'按费用构成要素划分，下列费用中不属于人工费的是（ ）。',o:['加班加点工资','节约奖','流动施工津贴','职工福利费'],a:'D',e:'人工费包括计时/计件工资、奖金、津贴补贴、加班加点工资、特殊情况下支付的工资。职工福利费属于企业管理费中的“劳动保险和职工福利费”。'},
{id:'jj059',kp:'jj22',t:1,d:1,q:'采用工程量清单计价时，下列措施费用中不得作为竞争性费用的是（ ）。',o:['安全文明施工费','夜间施工增加费','二次搬运费','冬雨季施工增加费'],a:'A',e:'安全文明施工费必须按国家或省级、行业建设主管部门的规定计算，不得作为竞争性费用。'},
{id:'jj060',kp:'jj22',t:1,d:2,q:'招标人在工程量清单中暂定并包括在合同价款中，用于施工合同签订时尚未确定或不可预见的材料设备服务采购、工程变更、价款调整以及索赔、现场签证等的费用是（ ）。',o:['暂估价','暂列金额','计日工','总承包服务费'],a:'B',e:'这是暂列金额的定义。暂估价是用于支付必然发生但暂时不能确定价格的材料、设备或专业工程的金额。'},
{id:'jj061',kp:'jj23',t:1,d:1,q:'根据《建设工程质量保证金管理办法》，发包人累计预留的质量保证金不得高于工程价款结算总额的（ ）。',o:['3%','5%','10%','2%'],a:'A',e:'保证金总预留比例不得高于工程价款结算总额的3%。'},
{id:'jj062',kp:'jj23',t:1,d:1,q:'建设工程缺陷责任期一般为（ ），最长不超过（ ）。',o:['6个月；1年','1年；2年','2年；5年','1年；3年'],a:'B',e:'缺陷责任期一般为1年，最长不超过2年，由发承包双方在合同中约定，从工程通过竣工验收之日起计。'},
{id:'jj063',kp:'jj23',t:1,d:2,q:'根据财建〔2022〕183号，政府机关、事业单位、国有企业建设工程进度款支付应不低于已完成工程价款的（ ）。',o:['60%','70%','80%','90%'],a:'C',e:'该文件将进度款支付比例下限提高到已完成工程价款的80%。'},
{id:'jj064',kp:'jj23',t:1,d:2,q:'根据工程价款结算有关规定，包工包料工程的预付款原则上（ ）。',o:['不低于合同金额的10%，不高于合同金额的30%','不低于合同金额的5%，不高于合同金额的20%','不低于合同金额的20%，不高于合同金额的40%','不高于合同金额的10%'],a:'A',e:'包工包料工程的预付款按合同约定拨付，原则上预付比例不低于合同金额的10%，不高于合同金额的30%（对重大工程项目，按年度工程计划逐年预付）。'},
{id:'jj065',kp:'jj24',t:1,d:1,q:'某工序的时间定额为0.5工日/m³，则其产量定额为（ ）m³/工日。',o:['0.5','1.0','2.0','5.0'],a:'C',e:'时间定额与产量定额互为倒数：产量定额=1/0.5=2m³/工日。'},
{id:'jj066',kp:'jj24',t:1,d:2,q:'某材料净用量为100kg，损耗率为2%（损耗率=损耗量/净用量），则该材料总消耗量为（ ）kg。',o:['98','100','102','102.04'],a:'C',e:'总消耗量=净用量×(1+损耗率)=100×1.02=102kg。102.04是误把损耗率当作占总消耗量比例算出的结果。'},
{id:'jj067',kp:'jj24',t:1,d:1,q:'下列定额中，项目划分最细、属于企业定额性质、是编制预算定额基础的是（ ）。',o:['施工定额','预算定额','概算定额','投资估算指标'],a:'A',e:'施工定额是施工企业内部使用的生产性定额，项目划分最细，是定额中的基础性定额。'},
{id:'jj068',kp:'jj25',t:1,d:2,q:'某设备原值100万元，预计净残值4万元，使用年限5年，采用年数总和法计提折旧，第2年的折旧额为（ ）万元。',o:['19.20','25.60','32.00','38.40'],a:'B',e:'年数总和=15，第2年尚可使用年数为4。折旧额=(100−4)×4/15=25.60万元。'},
{id:'jj069',kp:'jj25',t:1,d:2,q:'某设备原值50万元，使用年限5年，采用双倍余额递减法计提折旧，第2年的折旧额为（ ）万元。',o:['20','12','10','8'],a:'B',e:'年折旧率=2/5=40%。第1年：50×40%=20；第2年：(50−20)×40%=12万元。双倍余额递减法前几年不考虑净残值。'},
{id:'jj070',kp:'jj20',t:1,d:1,q:'某项目建设期1年，贷款1000万元在年内均衡发放，年利率6%，建设期只计息不支付，则建设期利息为（ ）万元。',o:['30','60','15','0'],a:'A',e:'当年借款按半年计息：q=1000/2×6%=30万元。60万元是按全年计息的错误结果。'}
);

// 工程经济 第二批
KP.push(
{id:'jj26',s:'jj',n:'投资收益率与资本金净利润率',imp:1,tip:'总投资收益率ROI=技术方案正常年份年息税前利润或运营期内年平均息税前利润/技术方案总投资；资本金净利润率ROE=正常年份年净利润或运营期内年平均净利润/技术方案资本金。'},
{id:'jj27',s:'jj',n:'偿债能力指标',imp:0,tip:'利息备付率=息税前利润/当期应付利息，正常情况下应大于1；偿债备付率=(息税折旧摊销前利润−企业所得税)/当期应还本付息金额，正常情况下应大于1。'},
{id:'jj28',s:'jj',n:'新技术应用方案的经济分析',imp:1,tip:'增量投资收益率R=(C1−C2)/(I2−I1)，大于基准收益率时投资大的方案可行。折算费用法：Zj=Cj+Pj×Rc，选折算费用最小的方案。'},
{id:'jj29',s:'jj',n:'设备经济寿命的静态估算',imp:0,tip:'设备年平均使用成本=资产消耗成本+年平均运行成本；低劣化数值法估算经济寿命：N0=√[2(P−LN)/λ]，P为设备实际价值，LN为残值，λ为年低劣化值。设备更新应站在客观立场比较，不考虑沉没成本，逐年滚动比较。'},
{id:'jj30',s:'jj',n:'会计假设与会计信息质量要求',imp:0,tip:'会计基本假设：会计主体、持续经营、会计分期、货币计量。会计信息质量要求：可靠性、相关性、可理解性、可比性、实质重于形式、重要性、谨慎性、及时性。计提资产减值准备体现谨慎性；融资租入资产视为自有资产核算体现实质重于形式。'},
{id:'jj31',s:'jj',n:'所有者权益与财务报表',imp:0,tip:'所有者权益包括实收资本（股本）、资本公积、其他综合收益、盈余公积和未分配利润，其中盈余公积和未分配利润合称留存收益。资产负债表反映某一时点的财务状况；利润表反映一定期间的经营成果；现金流量表将现金流量分为经营活动、投资活动、筹资活动三类。'},
{id:'jj32',s:'jj',n:'现金流量表的分类',imp:1,tip:'经营活动：销售商品提供劳务收到的现金、购买商品接受劳务支付的现金、支付给职工的现金、支付的各项税费等；投资活动：购建固定资产、无形资产，取得或收回投资等；筹资活动：吸收投资、取得借款、偿还债务、分配股利利润、偿付利息等。'},
{id:'jj33',s:'jj',n:'营运能力指标',imp:0,tip:'总资产周转率=营业收入/总资产平均余额；应收账款周转率=营业收入/应收账款平均余额；存货周转率=营业成本/存货平均余额。周转率越高，周转天数越短，营运能力越强。'},
{id:'jj34',s:'jj',n:'筹资方式与短期借款',imp:0,tip:'商业信用的形式：应付账款、应付票据、预收账款。短期借款信用条件中，补偿性余额使实际利率=名义利率/(1−补偿性余额比例)；贴现法付息的实际利率=名义利率/(1−名义利率)。长期筹资包括吸收直接投资、发行股票、长期借款、发行债券、融资租赁等。'},
{id:'jj35',s:'jj',n:'投资估算与设计概算方法',imp:0,tip:'生产能力指数法：C2=C1(Q2/Q1)^x·f。单位建筑工程概算编制方法：概算定额法、概算指标法、类似工程预算法；设备安装工程概算编制方法：预算单价法、扩大单价法、设备价值百分比法、综合吨位指标法。设计概算分单位工程概算、单项工程综合概算、建设项目总概算三级。'},
{id:'jj36',s:'jj',n:'设备购置费与工程建设其他费用',imp:0,tip:'设备购置费=设备原价+设备运杂费。工程建设其他费用包括建设用地费、与项目建设有关的其他费用（建设管理费、可行性研究费、勘察设计费、研究试验费、场地准备及临时设施费、工程保险费等）、与未来生产经营有关的费用（联合试运转费、专利及专有技术使用费、生产准备费等）。联合试运转费=试运转支出−试运转收入。'},
{id:'jj37',s:'jj',n:'施工机械台班单价',imp:0,tip:'施工机械台班单价由折旧费、检修费、维护费、安拆费及场外运费、人工费、燃料动力费、其他费（车船税、保险费、年检费等）七项组成。'},
{id:'jj38',s:'jj',n:'工人与机械工作时间分类',imp:1,tip:'工人工作时间：必需消耗的时间（有效工作时间——基本工作、辅助工作、准备与结束工作时间；休息时间；不可避免的中断时间）和损失时间（多余和偶然工作、停工、违背劳动纪律损失的时间）。定额时间=有效工作时间+休息时间+不可避免的中断时间。机械台班产量定额=机械纯工作1h正常生产率×工作班延续时间×机械时间利用系数。'},
{id:'jj39',s:'jj',n:'合同价款调整（物价变化）',imp:1,tip:'价格指数调整公式：ΔP=P0[A+(B1×Ft1/F01+B2×Ft2/F02+…)−1]，A为定值权重，B为可调因子变值权重，Ft为现行价格指数，F0为基本价格指数。'},
{id:'jj40',s:'jj',n:'竣工结算审查期限',imp:0,tip:'依据财建〔2004〕369号，单项工程竣工结算报告的审查时限：500万元以下20天；500万~2000万元30天；2000万~5000万元45天；5000万元以上60天（自接到竣工结算报告和完整结算资料之日起）。'},
{id:'jj41',s:'jj',n:'增值税与工程造价',imp:0,tip:'建筑服务增值税一般计税方法税率为9%，工程造价=税前造价×(1+9%)，税前造价各要素均以不含可抵扣进项税额的价格计算；简易计税方法征收率为3%。'},
{id:'jj42',s:'jj',n:'工程计量与变更价款',imp:1,tip:'不予计量：不符合合同要求、质量不合格的工程，超出图纸范围或承包人原因造成返工的工程量。变更价款确定原则：已标价工程量清单中有适用于变更工程项目的，采用该项目单价；没有适用但有类似项目的，参照类似项目单价；既无适用也无类似的，由承包人按成本加利润的原则提出，报发包人确认。'}
);
QB.push(
{id:'jj101',kp:'jj26',t:1,d:1,q:'某技术方案总投资5000万元，正常生产年份年息税前利润600万元，则该方案的总投资收益率为（ ）。',o:['8%','10%','12%','15%'],a:'C',e:'总投资收益率=年息税前利润/总投资=600/5000=12%。'},
{id:'jj102',kp:'jj26',t:1,d:2,q:'某技术方案资本金2000万元，正常年份年净利润300万元，年息税前利润500万元，则资本金净利润率为（ ）。',o:['10%','15%','20%','25%'],a:'B',e:'资本金净利润率=年净利润/资本金=300/2000=15%。注意用净利润而非息税前利润。'},
{id:'jj103',kp:'jj27',t:1,d:2,q:'某技术方案某年息税前利润为600万元，当期应付利息200万元，则该年利息备付率为（ ）。',o:['0.33','2.0','3.0','4.0'],a:'C',e:'利息备付率=息税前利润/应付利息=600/200=3.0，大于1说明付息能力有保障。'},
{id:'jj104',kp:'jj27',t:1,d:1,q:'关于偿债备付率的说法，正确的是（ ）。',o:['正常情况下应小于1','正常情况下应大于1','是反映盈利能力的指标','计算时分子为利润总额'],a:'B',e:'偿债备付率=(息税折旧摊销前利润−所得税)/应还本付息金额，正常情况下应大于1；属偿债能力指标。'},
{id:'jj105',kp:'jj28',t:1,d:2,q:'某工程有两个新技术方案：方案1投资120万元，年生产成本30万元；方案2投资160万元，年生产成本22万元。基准收益率10%，用增量投资收益率法比较，结论正确的是（ ）。',o:['增量投资收益率20%，应选方案2','增量投资收益率20%，应选方案1','增量投资收益率5%，应选方案1','增量投资收益率5%，应选方案2'],a:'A',e:'R=(30−22)/(160−120)=20%>10%，说明增加的投资经济合理，应选投资大的方案2。'},
{id:'jj106',kp:'jj28',t:1,d:2,q:'接上题，用折算费用法（Rc=10%）计算，方案1和方案2的折算费用分别为（ ）万元。',o:['42；38','30；22','150；182','12；16'],a:'A',e:'Z1=30+120×10%=42万元；Z2=22+160×10%=38万元。方案2折算费用低，应选方案2，与增量投资收益率法结论一致。'},
{id:'jj107',kp:'jj29',t:1,d:3,q:'某设备目前实际价值60000元，预计残值6000元，第1年使用费3000元，此后每年低劣化增加值为3000元，用低劣化数值法估算的设备经济寿命为（ ）年。',o:['5','6','7','8'],a:'B',e:'N0=√[2(P−LN)/λ]=√[2×(60000−6000)/3000]=√36=6年。'},
{id:'jj108',kp:'jj29',t:2,d:2,q:'设备更新方案比选的原则有（ ）。',o:['站在客观立场分析问题','不考虑沉没成本','逐年滚动比较','以旧设备的原始价值作为比较依据','只比较设备的购置价格'],a:'ABC',e:'设备更新比选应站在客观立场，不考虑沉没成本（旧设备按现行市场价值计），并逐年滚动比较确定最佳更新时机。'},
{id:'jj109',kp:'jj30',t:1,d:2,q:'企业对可能发生的资产损失计提资产减值准备，体现的会计信息质量要求是（ ）。',o:['可靠性','谨慎性','可比性','重要性'],a:'B',e:'谨慎性要求不高估资产或收益、不低估负债或费用，计提资产减值准备是典型体现。'},
{id:'jj110',kp:'jj30',t:1,d:1,q:'下列不属于会计基本假设的是（ ）。',o:['会计主体','持续经营','会计分期','权责发生制'],a:'D',e:'四项基本假设：会计主体、持续经营、会计分期、货币计量。权责发生制是会计核算基础，不是基本假设。'},
{id:'jj111',kp:'jj31',t:1,d:2,q:'企业所有者权益中的留存收益包括（ ）。',o:['实收资本和资本公积','盈余公积和未分配利润','资本公积和盈余公积','实收资本和未分配利润'],a:'B',e:'留存收益是企业从历年实现的利润中提取或留存于企业的内部积累，包括盈余公积和未分配利润。'},
{id:'jj112',kp:'jj31',t:1,d:1,q:'反映企业在某一特定日期财务状况的报表是（ ）。',o:['利润表','现金流量表','资产负债表','所有者权益变动表'],a:'C',e:'资产负债表是时点报表，反映特定日期的财务状况；利润表和现金流量表是时期报表。'},
{id:'jj113',kp:'jj32',t:1,d:2,q:'施工企业支付给本企业施工人员的工资，在现金流量表中应列入（ ）。',o:['经营活动产生的现金流量','投资活动产生的现金流量','筹资活动产生的现金流量','汇率变动对现金的影响'],a:'A',e:'支付给职工以及为职工支付的现金属于经营活动现金流出。'},
{id:'jj114',kp:'jj32',t:2,d:2,q:'下列现金流量中，属于筹资活动产生的现金流量的有（ ）。',o:['取得银行借款收到的现金','分配股利支付的现金','偿付利息支付的现金','购建固定资产支付的现金','吸收投资收到的现金'],a:'ABCE',e:'购建固定资产支付的现金属于投资活动现金流量。'},
{id:'jj115',kp:'jj33',t:1,d:2,q:'某企业年度营业收入6000万元，应收账款年初余额900万元、年末余额1100万元，则应收账款周转率为（ ）次。',o:['5.0','5.5','6.0','6.7'],a:'C',e:'应收账款平均余额=(900+1100)/2=1000万元；周转率=6000/1000=6次。'},
{id:'jj116',kp:'jj34',t:1,d:2,q:'某企业从银行取得一年期借款，名义利率8%，银行要求保持10%的补偿性余额，则该借款的实际利率约为（ ）。',o:['7.20%','8.00%','8.80%','8.89%'],a:'D',e:'实际利率=名义利率/(1−补偿性余额比例)=8%/(1−10%)≈8.89%。'},
{id:'jj117',kp:'jj34',t:1,d:2,q:'下列筹资方式中，属于商业信用的是（ ）。',o:['短期借款','应付票据','发行短期融资券','融资租赁'],a:'B',e:'商业信用是企业在商品交易中因延期付款或预收货款形成的借贷关系，包括应付账款、应付票据、预收账款。'},
{id:'jj118',kp:'jj34',t:1,d:3,q:'某企业取得一年期借款，名义利率10%，银行采用贴现法付息，则实际利率约为（ ）。',o:['9.09%','10.00%','11.11%','12.00%'],a:'C',e:'贴现法是银行先从本金中扣除利息，企业实际可用资金减少。实际利率=10%/(1−10%)≈11.11%。'},
{id:'jj119',kp:'jj35',t:1,d:3,q:'已建类似项目年生产能力20万吨，投资5000万元；拟建项目年生产能力30万吨，生产能力指数0.6，综合调整系数1.1，则拟建项目投资估算约为（ ）万元。',o:['6633','7015','7500','8250'],a:'B',e:'C2=C1(Q2/Q1)^x·f=5000×1.5^0.6×1.1≈7015万元。'},
{id:'jj120',kp:'jj35',t:1,d:2,q:'当初步设计深度不够，不能准确计算工程量，但工程设计采用的技术比较成熟而又有类似工程概算指标可以利用时，编制单位建筑工程概算宜采用（ ）。',o:['概算定额法','概算指标法','预算单价法','扩大单价法'],a:'B',e:'概算指标法适用于初步设计深度不够、不能准确计算工程量，但技术成熟、有类似工程概算指标可利用的情况。概算定额法要求初步设计达到一定深度。预算单价法、扩大单价法用于设备安装工程概算。'},
{id:'jj121',kp:'jj35',t:1,d:1,q:'设计概算的三级概算是指（ ）。',o:['单位工程概算、单项工程综合概算、建设项目总概算','分项工程概算、分部工程概算、单位工程概算','投资估算、设计概算、施工图预算','建筑工程概算、安装工程概算、设备概算'],a:'A',e:'三级概算：单位工程概算→单项工程综合概算→建设项目总概算。'},
{id:'jj122',kp:'jj36',t:1,d:1,q:'设备购置费的组成是（ ）。',o:['设备原价+设备运杂费','设备原价+安装费','设备原价+运杂费+安装费','设备出厂价+增值税'],a:'A',e:'设备购置费=设备原价+设备运杂费。设备安装费属于建筑安装工程费。'},
{id:'jj123',kp:'jj36',t:1,d:2,q:'某项目联合试运转支出200万元，试运转期间产品销售收入80万元，则应计入工程建设其他费用的联合试运转费为（ ）万元。',o:['80','120','200','280'],a:'B',e:'联合试运转费=试运转支出−试运转收入=200−80=120万元。'},
{id:'jj124',kp:'jj36',t:1,d:2,q:'下列费用中，属于与未来生产经营有关的工程建设其他费用的是（ ）。',o:['建设管理费','勘察设计费','生产准备费','场地准备及临时设施费'],a:'C',e:'与未来生产经营有关的其他费用包括联合试运转费、专利及专有技术使用费、生产准备费等；A、B、D属于与项目建设有关的其他费用。'},
{id:'jj125',kp:'jj37',t:2,d:2,q:'施工机械台班单价的组成内容包括（ ）。',o:['折旧费','检修费','安拆费及场外运费','燃料动力费','施工机械进出场的过路费以外的罚款'],a:'ABCD',e:'台班单价七项：折旧费、检修费、维护费、安拆费及场外运费、人工费、燃料动力费、其他费。罚款不属于台班单价组成。'},
{id:'jj126',kp:'jj38',t:1,d:1,q:'下列工人工作时间中，属于损失时间的是（ ）。',o:['准备与结束工作时间','休息时间','不可避免的中断时间','违背劳动纪律损失的时间'],a:'D',e:'损失时间包括多余和偶然工作时间、停工时间、违背劳动纪律损失时间。A、B、C均为必需消耗的时间，计入定额。'},
{id:'jj127',kp:'jj38',t:2,d:2,q:'下列工人工作时间中，应计入定额时间的有（ ）。',o:['基本工作时间','辅助工作时间','休息时间','不可避免的中断时间','多余工作时间'],a:'ABCD',e:'定额时间=有效工作时间（基本、辅助、准备与结束）+休息时间+不可避免的中断时间。多余工作时间属于损失时间。'},
{id:'jj128',kp:'jj38',t:1,d:3,q:'某混凝土搅拌机一次循环的组成部分（上料、搅拌、卸料）不可交叠，时间分别为1min、3min、1min，每次搅拌产量0.5m³，工作班8h，机械时间利用系数0.85，则该搅拌机台班产量定额为（ ）m³/台班。',o:['34.0','40.8','48.0','96.0'],a:'B',e:'一次循环5min，纯工作1h循环12次，正常生产率=12×0.5=6m³/h；台班产量=6×8×0.85=40.8m³/台班。'},
{id:'jj129',kp:'jj39',t:1,d:3,q:'某合同约定采用价格指数调整价格差额。本期完成合同价款1000万元，定值权重0.2，可调部分权重0.8，可调因子现行价格指数与基本价格指数之比为1.1，则本期应调整的价格差额为（ ）万元。',o:['20','80','88','100'],a:'B',e:'ΔP=P0[A+B×Ft/F0−1]=1000×[0.2+0.8×1.1−1]=80万元。'},
{id:'jj130',kp:'jj39',t:1,d:2,q:'采用价格指数调整价格差额时，价格调整公式中的定值权重A表示（ ）。',o:['可调因子在合同价中所占比例','合同价中不调部分的权重','现行价格指数','基本价格指数'],a:'B',e:'A为定值权重（即不调部分的权重），B1、B2…为各可调因子的变值权重，A与各B之和为1。'},
{id:'jj131',kp:'jj40',t:1,d:2,q:'某单项工程竣工结算报告金额为3000万元，根据财建〔2004〕369号，发包人的审查期限为自接到竣工结算报告和完整的竣工结算资料之日起（ ）天。',o:['20','30','45','60'],a:'C',e:'500万元以下20天；500万~2000万元30天；2000万~5000万元45天；5000万元以上60天。3000万元为45天。'},
{id:'jj132',kp:'jj41',t:1,d:1,q:'采用一般计税方法时，建筑业增值税税率为（ ）。',o:['3%','6%','9%','13%'],a:'C',e:'建筑服务适用9%税率；简易计税方法征收率为3%。'},
{id:'jj133',kp:'jj41',t:1,d:2,q:'某工程采用一般计税方法，税前造价1000万元（不含可抵扣进项税额），则含税工程造价为（ ）万元。',o:['1030','1060','1090','1130'],a:'C',e:'工程造价=税前造价×(1+9%)=1000×1.09=1090万元。'},
{id:'jj134',kp:'jj42',t:1,d:2,q:'下列工程量中，发包人应予计量的是（ ）。',o:['承包人原因造成返工的工程量','超出施工图纸范围的工程量','经监理人确认的、因设计变更增加的工程量','质量不合格的工程量'],a:'C',e:'不符合合同要求、质量不合格、超出图纸范围或承包人原因造成返工的工程量不予计量；经确认的设计变更增加的工程量应予计量。'},
{id:'jj135',kp:'jj42',t:1,d:2,q:'因工程变更引起已标价工程量清单项目发生变化，已标价工程量清单中没有适用但有类似于变更工程项目的，应（ ）。',o:['采用该项目的单价','在合理范围内参照类似项目的单价','由承包人按成本加利润原则提出单价','由发包人自行确定单价'],a:'B',e:'有适用的采用适用单价；无适用但有类似的参照类似单价；无适用也无类似的，由承包人根据变更工程资料、计量规则和计价办法、信息价格和承包人报价浮动率提出变更单价，报发包人确认。'}
);

// 专业工程管理与实务（各专业通用考点）
KP.push(
{id:'sw01',s:'sw',n:'危大工程范围与专家论证界限',imp:1,tip:'依据建办质〔2018〕31号。基坑：开挖深度≥3m为危大，≥5m需专家论证。模板支撑：搭设高度≥5m（或跨度≥10m、施工总荷载≥10kN/m²、集中线荷载≥15kN/m）为危大；≥8m（或≥18m、≥15kN/m²、≥20kN/m）需论证。非常规起重：单件≥10kN为危大，≥100kN需论证。落地式钢管脚手架≥24m为危大，≥50m需论证。人工挖孔桩均为危大，开挖深度≥16m需论证。'},
{id:'sw02',s:'sw',n:'专项方案论证结论、交底与验收',imp:1,tip:'论证结论：通过／修改后通过／不通过。“修改后通过”的，施工单位修改后重新履行审核程序；“不通过”的，修改后重新组织专家论证。方案交底：编制人员或项目技术负责人向现场管理人员交底；安全技术交底：现场管理人员向作业人员交底，双方和项目专职安全员共同签字。危大工程验收合格经施工单位项目技术负责人及总监理工程师签字确认后，方可进入下一道工序。'},
{id:'sw03',s:'sw',n:'高处作业安全',imp:0,tip:'在坠落高度基准面2m及以上有可能坠落的高处进行的作业为高处作业。临边防护栏杆上杆离地1.2m，挡脚板高度不小于180mm，立杆间距不大于2m。遇六级及以上强风、浓雾、沙尘暴等天气，不得进行露天攀登与悬空高处作业。安全带应高挂低用。'},
{id:'sw04',s:'sw',n:'施工现场动火与临时用电',imp:0,tip:'动火作业应办理动火许可证，签发人应到现场查验防火措施落实后签发；动火作业应配备灭火器材并设动火监护人；五级（含）以上风力应停止室外动火作业。动火证当日有效，动火地点变换应重新办理。临时用电现行标准为JGJ/T 46-2024（2025年1月1日起实施），专用变压器供电的低压系统采用TN-S接零保护系统。'},
{id:'sw05',s:'sw',n:'混凝土养护与试块',imp:1,tip:'依据GB 50666：硅酸盐、普通硅酸盐、矿渣硅酸盐水泥混凝土养护不少于7d；掺缓凝型外加剂或大掺量矿物掺合料、抗渗混凝土、C60及以上混凝土不少于14d；后浇带混凝土不少于14d。标准养护：温度20±2℃、相对湿度95%以上，龄期28d。混凝土强度达到1.2MPa前不得在其上踩踏、堆放荷载、安装模板及支架。'},
{id:'sw06',s:'sw',n:'大体积混凝土温控',imp:0,tip:'依据GB 50496：混凝土浇筑体里表温差（不含收缩当量温度）不宜大于25℃；降温速率不宜大于2.0℃/d；浇筑体在入模温度基础上的温升值不宜大于50℃。'},
{id:'sw07',s:'sw',n:'工期索赔与费用索赔计算',imp:1,tip:'发包人原因造成关键工作延误，可索赔工期；非关键工作延误时间超过其总时差的部分可索赔工期。费用索赔按实际影响计算：人工窝工按窝工补偿标准；自有机械窝工按台班折旧费，租赁机械按租赁费，而非台班单价。承包人自身原因造成的延误不予补偿。'},
{id:'sw08',s:'sw',n:'不可抗力的风险分担',imp:1,tip:'2017版示范文本：永久工程、已运至现场的材料和工程设备损坏及由此造成的第三人伤亡和财产损失由发包人承担；承包人施工设备损坏由承包人承担；双方各自承担人员伤亡和财产损失；工期应顺延，停工费用合理分担，停工期间必须支付的工人工资由发包人承担；发包人要求赶工的费用由发包人承担；按发包人要求照管、清理、修复工程的费用由发包人承担。'},
{id:'sw09',s:'sw',n:'隐蔽工程检查与重新检查',imp:1,tip:'2017版示范文本：承包人自检确认具备覆盖条件后，在共同检查前48小时书面通知监理人；监理人不能按时检查的，应在检查前24小时书面提交延期要求，延期不超过48小时；未按时检查也未提出延期的，承包人可自行完成覆盖，视为检查合格。监理人对已覆盖部位要求重新检查：合格的，由发包人承担增加的费用和（或）延误的工期并支付合理利润；不合格的，由承包人承担。承包人私自覆盖的，监理人可要求钻孔探测或揭开检查，费用工期均由承包人承担。'},
{id:'sw10',s:'sw',n:'起重机械与特种作业人员管理',imp:0,tip:'施工起重机械和整体提升脚手架、模板等自升式架设设施，由具有相应资质的单位安装拆卸；施工单位应自验收合格之日起30日内，向建设行政主管部门或其他有关部门登记。垂直运输机械作业人员、起重信号工、登高架设作业人员等特种作业人员必须经专门安全作业培训并取得特种作业操作资格证书后上岗。'},
{id:'sw11',s:'sw',n:'见证取样与材料进场检验',imp:0,tip:'涉及结构安全的试块、试件以及有关材料，应在建设单位或监理单位监督下现场取样送检；见证取样和送检的比例不得低于有关技术标准中规定应取样数量的30%。'}
);
QB.push(
{id:'sw001',kp:'sw01',t:1,d:1,q:'某工程基坑开挖深度4m，周边环境简单。根据住建部有关规定，关于该基坑工程的说法，正确的是（ ）。',o:['不属于危大工程，无需编制专项施工方案','属于危大工程，应编制专项施工方案，无需组织专家论证','属于超过一定规模的危大工程，应组织专家论证','只需编制一般施工方案，由项目技术负责人审批'],a:'B',e:'开挖深度超过3m（含3m）的基坑工程属于危大工程，需编制专项施工方案；开挖深度超过5m（含5m）才属于超过一定规模的危大工程，需组织专家论证。'},
{id:'sw002',kp:'sw01',t:1,d:2,q:'下列混凝土模板支撑工程中，需要组织专家对专项施工方案进行论证的是（ ）。',o:['搭设高度6m的模板支撑工程','搭设跨度12m的模板支撑工程','搭设高度8m的模板支撑工程','施工总荷载（设计值）12kN/m²的模板支撑工程'],a:'C',e:'混凝土模板支撑工程搭设高度8m及以上，或跨度18m及以上，或施工总荷载（设计值）15kN/m²及以上，或集中线荷载（设计值）20kN/m及以上，属于超过一定规模的危大工程，需专家论证。A、B、D属于危大工程但未达到论证标准。'},
{id:'sw003',kp:'sw01',t:2,d:3,q:'下列分部分项工程中，属于超过一定规模的危大工程、需要组织专家论证的有（ ）。',o:['开挖深度6m的基坑工程','搭设高度30m的落地式钢管脚手架工程','搭设高度10m的混凝土模板支撑工程','开挖深度18m的人工挖孔桩工程','采用非常规起重方法、单件起吊重量50kN的起重吊装工程'],a:'ACD',e:'落地式钢管脚手架≥50m才需论证（B仅属危大）；非常规起重单件≥100kN才需论证（E仅属危大）。'},
{id:'sw004',kp:'sw01',t:1,d:2,q:'采用非常规起重设备、方法进行起重吊装，单件起吊重量达到（ ）及以上的，属于超过一定规模的危险性较大的分部分项工程。',o:['10kN','50kN','100kN','300kN'],a:'C',e:'单件起吊重量10kN及以上属于危大工程；100kN及以上属于超过一定规模的危大工程。'},
{id:'sw005',kp:'sw02',t:1,d:2,q:'超过一定规模的危大工程专项施工方案经专家论证，结论为“修改后通过”，施工单位正确的做法是（ ）。',o:['直接按原方案组织实施','根据论证报告修改完善后，重新履行审核程序后实施','修改后重新组织专家论证','报建设行政主管部门批准后实施'],a:'B',e:'论证结论为“修改后通过”的，施工单位应根据论证报告修改完善后，重新履行施工单位技术负责人审核、总监理工程师审查的程序；结论为“不通过”的，修改后应重新组织专家论证。'},
{id:'sw006',kp:'sw02',t:1,d:2,q:'危大工程专项施工方案实施前，应由（ ）向施工现场管理人员进行方案交底。',o:['施工单位技术负责人','编制人员或者项目技术负责人','总监理工程师','项目专职安全生产管理人员'],a:'B',e:'专项施工方案实施前，编制人员或项目技术负责人应向施工现场管理人员进行方案交底；施工现场管理人员应向作业人员进行安全技术交底，并由双方和项目专职安全生产管理人员共同签字确认。'},
{id:'sw007',kp:'sw02',t:1,d:3,q:'对于按规定需要验收的危大工程，验收合格后经（ ）签字确认，方可进入下一道工序。',o:['施工单位技术负责人及建设单位项目负责人','施工单位项目技术负责人及总监理工程师','项目经理及专业监理工程师','专职安全员及监理员'],a:'B',e:'危大工程验收合格的，经施工单位项目技术负责人及总监理工程师签字确认后，方可进入下一道工序；验收合格后应在现场明显位置设置验收标识牌。'},
{id:'sw008',kp:'sw03',t:1,d:1,q:'根据国家标准，在坠落高度基准面（ ）及以上有可能坠落的高处进行的作业，称为高处作业。',o:['1.5m','2m','2.5m','3m'],a:'B',e:'凡在坠落高度基准面2m及以上有可能坠落的高处进行的作业，均称为高处作业。'},
{id:'sw009',kp:'sw03',t:1,d:2,q:'根据《建筑施工高处作业安全技术规范》，临边作业防护栏杆的上杆离地高度应为（ ），挡脚板高度不应小于（ ）。',o:['1.0m；150mm','1.2m；180mm','1.2m；150mm','1.5m；200mm'],a:'B',e:'防护栏杆由横杆、立杆及挡脚板组成，上杆离地高度1.2m，下杆在上杆和挡脚板中间设置；挡脚板高度不应小于180mm；立杆间距不应大于2m。'},
{id:'sw010',kp:'sw03',t:1,d:1,q:'遇有（ ）及以上强风、浓雾、沙尘暴等恶劣气候，不得进行露天攀登与悬空高处作业。',o:['四级','五级','六级','七级'],a:'C',e:'遇有六级及以上强风、浓雾、沙尘暴等恶劣气候，不得进行露天攀登与悬空高处作业；雨雪天气后应对设施进行检查。'},
{id:'sw011',kp:'sw04',t:1,d:2,q:'根据《建设工程施工现场消防安全技术规范》，风力达到（ ）时，应停止焊接、切割等室外动火作业。',o:['三级（含）以上','四级（含）以上','五级（含）以上','六级（含）以上'],a:'C',e:'五级（含五级）以上风力时，应停止焊接、切割等室外动火作业；确需动火作业时，应采取可靠的挡风措施。'},
{id:'sw012',kp:'sw04',t:2,d:1,q:'关于施工现场动火作业管理的说法，正确的有（ ）。',o:['动火作业应办理动火许可证','动火许可证签发人应到现场查验防火措施落实后再签发','动火作业现场应配备灭火器材并设动火监护人','动火作业前应对作业现场的可燃物进行清理','动火证可连续使用一周'],a:'ABCD',e:'动火证当日有效，动火地点发生变化应重新办理动火审批手续，不能连续使用一周（E错）。'},
{id:'sw013',kp:'sw04',t:1,d:2,q:'在建筑与市政工程施工现场专用变压器供电的低压配电系统中，应采用的接零保护系统是（ ）。',o:['TN-C系统','TN-S系统','TT系统','IT系统'],a:'B',e:'施工现场专用变压器供电的TN接零保护系统中，电气设备外露可导电部分应与保护零线（PE线）连接，即采用TN-S系统（工作零线N与保护零线PE分开）。现行标准为JGJ/T 46-2024。'},
{id:'sw014',kp:'sw05',t:1,d:1,q:'采用普通硅酸盐水泥配制的混凝土，浇筑后的养护时间不应少于（ ）。',o:['3d','7d','14d','28d'],a:'B',e:'采用硅酸盐水泥、普通硅酸盐水泥或矿渣硅酸盐水泥配制的混凝土，养护时间不应少于7d。'},
{id:'sw015',kp:'sw05',t:2,d:2,q:'根据《混凝土结构工程施工规范》，下列混凝土的养护时间不应少于14d的有（ ）。',o:['采用缓凝型外加剂配制的混凝土','大掺量矿物掺合料配制的混凝土','抗渗混凝土','强度等级C60及以上的混凝土','采用普通硅酸盐水泥配制的C30混凝土'],a:'ABCD',e:'普通硅酸盐水泥配制的普通混凝土养护不少于7d（E）。后浇带混凝土的养护时间也不应少于14d。'},
{id:'sw016',kp:'sw05',t:1,d:2,q:'混凝土标准养护试件的养护条件为（ ）。',o:['温度20±2℃，相对湿度95%以上','温度20±5℃，相对湿度90%以上','温度25±2℃，相对湿度95%以上','与现场结构同条件养护'],a:'A',e:'标准养护条件为温度20±2℃、相对湿度95%以上，标准龄期28d。同条件养护试件用于确定拆模、张拉等时机及结构实体强度检验。'},
{id:'sw017',kp:'sw05',t:1,d:2,q:'混凝土强度达到（ ）前，不得在其上踩踏、堆放荷载、安装模板及支架。',o:['1.0MPa','1.2MPa','2.5MPa','5.0MPa'],a:'B',e:'《混凝土结构工程施工规范》规定，混凝土强度达到1.2MPa前，不得在其上踩踏、堆放荷载、安装模板及支架。'},
{id:'sw018',kp:'sw06',t:1,d:2,q:'大体积混凝土施工温控指标中，混凝土浇筑体的里表温差（不含混凝土收缩当量温度）不宜大于（ ）。',o:['15℃','20℃','25℃','30℃'],a:'C',e:'GB 50496规定：里表温差不宜大于25℃，降温速率不宜大于2.0℃/d，浇筑体在入模温度基础上的温升值不宜大于50℃。'},
{id:'sw019',kp:'sw06',t:1,d:3,q:'大体积混凝土浇筑体的降温速率不宜大于（ ）。',o:['1.0℃/d','2.0℃/d','3.0℃/d','5.0℃/d'],a:'B',e:'降温速率不宜大于2.0℃/d。降温过快容易因温度应力产生裂缝，因此需保温保湿养护并进行测温。'},
{id:'sw020',kp:'sw07',t:1,d:2,q:'某工程网络计划中，工作M的总时差为3天。因发包人提供图纸延误，工作M推迟开始7天，其他工作正常。承包人可索赔的工期为（ ）天。',o:['3','4','7','10'],a:'B',e:'非关键工作的延误只有超过其总时差的部分才影响总工期。可索赔工期=7−3=4天。'},
{id:'sw021',kp:'sw07',t:1,d:3,q:'因发包人原因，某工作停工7天，造成现场20名工人窝工，窝工补偿标准100元/工日；一台租赁机械闲置，租赁费600元/天（台班单价900元）。该工作总时差为3天。则承包人可索赔的费用为（ ）元。',o:['8400','10400','18200','20300'],a:'C',e:'费用索赔按实际窝工天数计算，与总时差无关：人工20×100×7=14000元；租赁机械按租赁费计600×7=4200元；合计18200元。20300是错用台班单价计算的结果。'},
{id:'sw022',kp:'sw07',t:1,d:2,q:'施工过程中，承包人自有施工机械因发包人原因窝工，其费用索赔一般按（ ）计算。',o:['机械台班单价','机械台班折旧费','机械租赁市场价','机械台班人工费'],a:'B',e:'自有机械窝工按台班折旧费（或停置台班费）计算，租赁机械按实际租金计算，不能按完整的台班单价计算，因为窝工时并不发生燃料动力等费用。'},
{id:'sw023',kp:'sw07',t:1,d:1,q:'下列事件中，承包人既不能索赔工期也不能索赔费用的是（ ）。',o:['发包人未按约定提供施工场地','设计变更导致关键工作工程量增加','承包人施工机械故障导致关键工作延误','监理人要求剥离检查已覆盖部位，检查结果合格'],a:'C',e:'承包人自身原因（如机械故障、管理不善）造成的延误，由承包人自行承担。其余三项均属发包人应承担的责任或风险。'},
{id:'sw024',kp:'sw08',t:2,d:2,q:'根据2017版施工合同示范文本，因不可抗力造成的下列损失中，应由发包人承担的有（ ）。',o:['永久工程的损坏','已运至施工现场的材料和工程设备的损坏','承包人施工设备的损坏','停工期间必须支付的工人工资','承包人在停工期间按照发包人要求照管、清理和修复工程的费用'],a:'ABDE',e:'承包人施工设备的损坏由承包人承担（C）。人员伤亡由双方各自承担。'},
{id:'sw025',kp:'sw08',t:1,d:2,q:'因不可抗力导致承包人项目部人员受伤，根据2017版施工合同示范文本，该损失应由（ ）。',o:['发包人承担','承包人承担','发包人和承包人平均分担','保险公司全部承担'],a:'B',e:'不可抗力事件中，发包人和承包人承担各自人员伤亡和财产的损失。承包人人员受伤由承包人承担。'},
{id:'sw026',kp:'sw09',t:1,d:2,q:'根据2017版施工合同示范文本，承包人自检确认隐蔽部位具备覆盖条件后，应在共同检查前（ ）小时书面通知监理人检查。',o:['12','24','48','72'],a:'C',e:'承包人应在共同检查前48小时书面通知监理人；监理人不能按时检查的，应在检查前24小时向承包人提交书面延期要求，延期不能超过48小时。'},
{id:'sw027',kp:'sw09',t:1,d:3,q:'隐蔽工程经监理人检查合格并覆盖后，监理人对质量有疑问，要求承包人揭开重新检查，结果合格。由此增加的费用和延误的工期应（ ）。',o:['由承包人承担','由发包人承担费用，工期不予顺延','由发包人承担费用和工期，并支付承包人合理利润','由监理人承担'],a:'C',e:'重新检查证明工程质量符合合同要求的，由发包人承担由此增加的费用和（或）延误的工期，并支付承包人合理的利润；不符合要求的，由承包人承担。'},
{id:'sw028',kp:'sw09',t:1,d:2,q:'承包人未通知监理人到场检查，私自将隐蔽部位覆盖。监理人指示承包人钻孔探测或揭开检查，经检查质量合格。由此增加的费用和延误的工期应由（ ）承担。',o:['发包人','承包人','发包人和承包人共同','监理人'],a:'B',e:'承包人未通知监理人到场检查私自覆盖的，监理人有权要求钻孔探测或揭开检查，无论质量是否合格，由此增加的费用和（或）延误的工期均由承包人承担。'},
{id:'sw029',kp:'sw10',t:1,d:2,q:'根据《建设工程安全生产管理条例》，施工单位应当自施工起重机械验收合格之日起（ ）日内，向建设行政主管部门或者其他有关部门登记。',o:['7','15','30','60'],a:'C',e:'施工单位应自施工起重机械和整体提升脚手架、模板等自升式架设设施验收合格之日起30日内登记，登记标志应置于或附着于该设备的显著位置。'},
{id:'sw030',kp:'sw10',t:1,d:1,q:'垂直运输机械作业人员、安装拆卸工、爆破作业人员、起重信号工、登高架设作业人员等特种作业人员，上岗前必须（ ）。',o:['经项目部内部培训合格','按照国家有关规定经过专门的安全作业培训，并取得特种作业操作资格证书','由班组长带班即可','签订安全责任书'],a:'B',e:'《建设工程安全生产管理条例》规定，特种作业人员必须按照国家有关规定经过专门的安全作业培训，并取得特种作业操作资格证书后，方可上岗作业。'},
{id:'sw031',kp:'sw11',t:1,d:2,q:'房屋建筑和市政基础设施工程实行见证取样和送检时，见证取样和送检的比例不得低于有关技术标准中规定应取样数量的（ ）。',o:['10%','20%','30%','50%'],a:'C',e:'见证取样和送检的比例不得低于有关技术标准中规定应取样数量的30%。'},
{id:'sw032',kp:'sw11',t:1,d:1,q:'涉及结构安全的试块、试件以及有关材料，应当在（ ）监督下现场取样，并送具有相应资质等级的质量检测单位进行检测。',o:['施工单位技术负责人','建设单位或者工程监理单位','质量监督机构','设计单位'],a:'B',e:'《建设工程质量管理条例》规定，施工人员对涉及结构安全的试块、试件以及有关材料，应当在建设单位或者工程监理单位监督下现场取样，并送具有相应资质等级的质量检测单位进行检测。'}
);

</script>
<script>
(function(){
'use strict';
var SUBJ={jj:'工程经济',gl:'项目管理',fg:'法规',gs:'公路实务',sw:'实务通用'};
var SKEYS=['jj','gl','fg','gs','sw'];
var INT=[0,1,2,4,7,15,30];
var KEY='yjian_daily_v1';
var KPM={},QM={},QBYKP={};
KP.forEach(function(k){KPM[k.id]=k;QBYKP[k.id]=[];});
QB.forEach(function(q){q.s=KPM[q.kp].s;QM[q.id]=q;QBYKP[q.kp].push(q);});

/* ---------- 日期 ---------- */
function pad(n){return (n<10?'0':'')+n}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return fmt(new Date())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/86400000)}

/* ---------- 存储 ---------- */
function blank(){return {v:1,settings:{goal:10,exam:'2027-09-11'},qs:{},kps:{},days:{},cur:null,flags:{},wrong:{},created:today()}}
var S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
  var b=blank();for(var k in b){if(S[k]===undefined)S[k]=b[k]}}
function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushRemote()}
/* ---------- 云端同步（发布为在线网页时生效） ---------- */
var RDOC=null,syncState='local',pushTimer=null,pushing=false,pushAgain=false;
function setSync(s){syncState=s;var e=document.getElementById('sync');if(e)e.textContent=syncLabel()}
function syncLabel(){return {local:'',ok:'☁ 已同步',ing:'☁ 同步中…',err:'☁ 同步失败，已存本机'}[syncState]||''}
function pushRemote(){if(!RDOC)return;clearTimeout(pushTimer);pushTimer=setTimeout(doPush,1200)}
function doPush(){if(!RDOC)return;if(pushing){pushAgain=true;return}pushing=true;setSync('ing');
  RDOC.set({json:JSON.stringify(S),updated:S.updated}).then(function(){setSync('ok')},function(){setSync('err')})
  .then(function(){pushing=false;if(pushAgain){pushAgain=false;doPush()}})}
function initRemote(){
  if(!window.claude||!window.claude.use)return;
  var tm=setTimeout(function(){},10000);
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return;
    return Promise.resolve(user.id()).then(function(id){
      if(!id)return;RDOC=db.collection('data/users/'+id).doc('progress');setSync('ing');
      return RDOC.get().then(function(snap){
        var d=snap&&(typeof snap.data==='function'?snap.data():snap);
        if(d&&d.json&&(d.updated||0)>(S.updated||0)){try{S=JSON.parse(d.json);load2();localStorage.setItem(KEY,d.json)}catch(e){}if(view!=='quiz')render();setSync('ok')}
        else{doPush()}
      });
    });
  }).catch(function(){setSync('err')}).then(function(){clearTimeout(tm)});
}
load();

/* ---------- 工具 ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(id){return document.getElementById(id)}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}
function mastered(k){return k&&k.box>=5}

/* ---------- 难度递进 ---------- */
function level(){
  var seen={1:0,2:0,3:0},tot={1:0,2:0,3:0};
  QB.forEach(function(q){tot[q.d]++;if(S.qs[q.id])seen[q.d]++});
  var lv=1;
  if(seen[1]>=tot[1]*0.5)lv=2;
  if(lv===2&&seen[2]>=tot[2]*0.5)lv=3;
  return lv;
}

/* ---------- 组题 ---------- */
function dueKps(subj){
  var t=today();
  return Object.keys(S.kps).filter(function(id){var k=S.kps[id];return k.due<=t&&(!subj||KPM[id].s===subj)})
   .sort(function(a,b){var A=S.kps[a],B=S.kps[b];
     var ma=mastered(A)?1:0,mb=mastered(B)?1:0; if(ma!==mb)return ma-mb;
     var ia=KPM[a].imp?0:1,ib=KPM[b].imp?0:1; if(ia!==ib)return ia-ib;
     if(A.box!==B.box)return A.box-B.box; return A.due<B.due?-1:1;});
}
function pickForKp(kp,used){
  var k=S.kps[kp]||{};
  var c=QBYKP[kp].filter(function(q){return !used[q.id]});
  if(!c.length)return null;
  var unseen=shuffle(c.filter(function(q){return !S.qs[q.id]}));
  if(unseen.length){unseen.sort(function(a,b){return a.d-b.d});return unseen[0]}
  var alt=c.filter(function(q){return q.id!==k.lastWrong});
  if(alt.length)c=alt;
  c=shuffle(c).sort(function(a,b){return (S.qs[a.id].last||'')<(S.qs[b.id].last||'')?-1:1});
  return c[0];
}
function buildSet(n,mode,subj){
  var used={},out=[],lv=level();
  var due=dueKps(subj);
  if(mode==='wrong'){
    var wk={};Object.keys(S.wrong).forEach(function(q){var kp=QM[q]&&QM[q].kp;if(kp&&!mastered(S.kps[kp]))wk[kp]=1});
    due=Object.keys(wk).sort(function(a,b){return (S.kps[a].due<S.kps[b].due)?-1:1});
    due.forEach(function(kp){if(out.length<n){var q=pickForKp(kp,used);if(q){used[q.id]=1;out.push(q.id)}}});
    return shuffle(out);
  }
  var quota=Math.min(due.length,Math.ceil(n*(mode==='daily'?0.6:0.4)));
  for(var i=0;i<due.length&&out.length<quota;i++){var q=pickForKp(due[i],used);if(q){used[q.id]=1;out.push(q.id)}}
  // 新题：按科目轮换，先易后难
  var pools={};SKEYS.forEach(function(s){
    pools[s]=shuffle(QB.filter(function(q){return q.s===s&&!S.qs[q.id]&&q.d<=lv&&!used[q.id]}))
      .sort(function(a,b){var ka=S.kps[a.kp]?1:0,kb=S.kps[b.kp]?1:0;return a.d-b.d||ka-kb})});
  var order=subj?[subj]:shuffle(SKEYS);
  function kpIn(kp){return out.some(function(x){return QM[x].kp===kp})}
  [true,false].forEach(function(distinct){ // 先尽量让同一组里知识点不重复
    var progress=true;
    while(out.length<n&&progress){progress=false;
      for(var j=0;j<order.length&&out.length<n;j++){var p=pools[order[j]];
        for(var i=0;i<p.length;i++){var q2=p[i];if(used[q2.id])continue;if(distinct&&kpIn(q2.kp))continue;
          used[q2.id]=1;out.push(q2.id);p.splice(i,1);progress=true;break;}}}
  });
  // 题不够时，补充掌握度最低的知识点
  if(out.length<n){
    var ks=KP.filter(function(k){return !subj||k.s===subj}).map(function(k){return k.id})
      .sort(function(a,b){return ((S.kps[a]||{box:0}).box)-((S.kps[b]||{box:0}).box)});
    for(var m=0;m<ks.length&&out.length<n;m++){var q3=pickForKp(ks[m],used);if(q3){used[q3.id]=1;out.push(q3.id)}}
  }
  return shuffle(out);
}
function newSession(mode,subj){
  var n=mode==='daily'?S.settings.goal:10;
  var ids=buildSet(n,mode,subj);
  if(!ids.length){toast(mode==='wrong'?'暂无需要复习的错题':'没有可练习的题目');return null}
  var sess={mode:mode,subj:subj||null,date:today(),ids:ids,idx:0,ans:{},ord:{}};
  ids.forEach(function(id){sess.ord[id]=shuffle(QM[id].o.map(function(_,i){return i}))});
  return sess;
}

/* ---------- 判分与记忆调度 ---------- */
function grade(q,sel){ // sel: 原始选项下标数组
  var ans=q.a.split('').map(function(c){return c.charCodeAt(0)-65});
  if(q.t===1){var ok=sel[0]===ans[0];return {ok:ok,score:ok?1:0,full:1,part:false}}
  var wrong=sel.some(function(i){return ans.indexOf(i)<0});
  if(wrong)return {ok:false,score:0,full:2,part:false};
  if(sel.length===ans.length)return {ok:true,score:2,full:2,part:false};
  return {ok:false,score:0.5*sel.length,full:2,part:true};
}
function record(q,r){
  var t=today();
  var qs=S.qs[q.id]||(S.qs[q.id]={n:0,c:0,w:0,last:''});
  qs.n++;qs.last=t;if(r.ok)qs.c++;else{qs.w++;if(!S.wrong[q.id])S.wrong[q.id]=t}
  var k=S.kps[q.kp];var first=!k;
  if(!k)k=S.kps[q.kp]={box:0,due:t,w:0,n:0,last:''};
  k.n++;k.last=t;
  if(r.ok){
    k.box=(first&&k.w===0)?3:Math.min(k.box+1,6);
    var f=(KPM[q.kp].imp?0.7:1)/(1+0.25*Math.min(k.w,4));
    k.due=addDays(t,Math.max(1,Math.round(INT[k.box]*f)));
  }else{
    k.box=1;k.w++;k.lastWrong=q.id;k.due=addDays(t,1);
  }
  var d=S.days[t]||(S.days[t]={n:0,c:0,done:false});
  d.n++;if(r.ok)d.c++;
}
function streak(){
  var t=today(),c=0,d=S.days[t]&&S.days[t].done?t:addDays(t,-1);
  while(S.days[d]&&S.days[d].done){c++;d=addDays(d,-1)}
  return c;
}
function bestStreak(){
  var ds=Object.keys(S.days).filter(function(d){return S.days[d].done}).sort(),b=0,c=0,prev=null;
  ds.forEach(function(d){c=(prev&&diffDays(prev,d)===1)?c+1:1;if(c>b)b=c;prev=d});return b;
}

/* ---------- 路由 ---------- */
var tab='home',view=null; // view: 'quiz' | 'summary'
document.querySelectorAll('nav.tabs button').forEach(function(b){b.onclick=function(){
  if(view==='quiz'&&S.cur&&S.cur.mode!=='daily'){/* 练习中切走：保留进度 */}
  view=null;tab=b.dataset.tab;render();window.scrollTo(0,0)}});
function render(){
  document.querySelectorAll('nav.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab&&!view)});
  var app=$('app');document.body.classList.toggle('quiz',view==='quiz');
  if(view==='quiz')return renderQuiz(app);
  if(view==='summary')return renderSummary(app);
  ({home:renderHome,practice:renderPractice,wrong:renderWrong,stats:renderStats,settings:renderSettings})[tab](app);
}

/* ---------- 今日 ---------- */
function dailySession(){
  var t=today();
  if(S.cur&&S.cur.mode==='daily'&&S.cur.date===t)return S.cur;
  if(S.daily&&S.daily.date===t)return S.daily;
  return null;
}
function renderHome(app){
  var t=today(),goal=S.settings.goal,d=S.days[t]||{n:0,c:0,done:false};
  var ds=dailySession(),doneN=ds?Object.keys(ds.ans).length:0,total=ds?ds.ids.length:goal;
  var dueN=dueKps().filter(function(id){return !mastered(S.kps[id])}).length;
  var mk=KP.filter(function(k){return mastered(S.kps[k.id])}).length;
  var exam=S.settings.exam,left=exam?diffDays(t,exam):null;
  var wd=['日','一','二','三','四','五','六'][new Date().getDay()];
  var h='<header class="top"><h1>一建每日刷题</h1><span class="date">'+t.slice(5).replace('-','月')+'日 周'+wd+'<span class="sync" id="sync">'+syncLabel()+'</span></span></header>';
  h+='<div class="card"><div class="row"><div class="stat"><div class="big">'+streak()+'</div><div class="lbl">连续打卡（天）</div></div>'
    +'<div class="stat"><div class="big">'+doneN+'<span class="muted" style="font-size:16px"> / '+total+'</span></div><div class="lbl">今日任务</div></div>'
    +(left!==null?'<div class="stat"><div class="big">'+(left>=0?left:0)+'</div><div class="lbl">距考试（天）</div></div>':'')+'</div>';
  h+='<div class="bar" style="margin:8px 0 14px"><i style="width:'+Math.min(100,doneN/total*100)+'%"></i></div>';
  if(d.done){
    h+='<div class="res ok" style="text-align:center">✓ 今日已打卡，正确率 '+(d.n?Math.round(d.c/d.n*100):0)+'%</div><button class="btn ghost" id="more">再练一组（10题）</button>';
  }else{
    h+='<button class="btn" id="go">'+(doneN?'继续今日任务':'开始今日任务')+'</button>';
  }
  h+='</div>';
  h+='<div class="row"><div class="card stat"><div class="big" style="font-size:24px">'+dueN+'</div><div class="lbl">今日待复习知识点</div></div>'
    +'<div class="card stat"><div class="big" style="font-size:24px">'+mk+'<span class="muted" style="font-size:14px">/'+KP.length+'</span></div><div class="lbl">已掌握知识点</div></div></div>';
  // 打卡日历（近5周）
  var start=addDays(t,-(new Date().getDay())-28);
  h+='<div class="card"><div style="display:flex;justify-content:space-between"><b>打卡记录</b><span class="muted">最长连续 '+bestStreak()+' 天</span></div><div class="cal">';

  h+='</div></div>';
  h+='<div class="card"><b>各科进度</b>';
  SKEYS.forEach(function(s){var qs=QB.filter(function(q){return q.s===s}),seen=qs.filter(function(q){return S.qs[q.id]}).length;
    h+='<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>'+SUBJ[s]+'</span><span class="muted">'+seen+' / '+qs.length+' 题</span></div><div class="bar"><i style="width:'+(seen/qs.length*100)+'%"></i></div></div>'});
  h+='<p class="muted" style="margin:12px 0 0">当前难度：'+['','基础','进阶','综合'][level()]+'（基础题做过一半后自动加入进阶题，进阶题做过一半后加入综合题）</p></div>';

  if($('go'))$('go').onclick=function(){
    var s=dailySession();

    S.cur=s;save();view='quiz';render();window.scrollTo(0,0)};

/* ---------- 做题 ---------- */
var pick=[];
function renderQuiz(app){
  var s=S.cur;if(!s){view=null;return render()}
  if(s.idx>=s.ids.length){view='summary';return render()}
  var id=s.ids[s.idx],q=QM[id],ord=s.ord[id],done=s.ans[id];
  var ans=q.a.split('').map(function(c){return c.charCodeAt(0)-65});
  var modeName={daily:'今日任务',extra:'加练',practice:'专项练习',wrong:'错题重练'}[s.mode];
  var h='<div class="qhead"><button class="x" id="quit">‹ 返回</button><span class="muted">'+modeName+' · '+(s.idx+1)+' / '+s.ids.length+'</span><span style="width:40px"></span></div>';
  h+='<div class="bar" style="height:5px"><i style="width:'+(s.idx/s.ids.length*100)+'%"></i></div>';
  h+='<div class="card" style="margin-top:12px"><span class="tag '+q.s+'">'+SUBJ[q.s]+'</span><span class="tag">'+(q.t===1?'单选题':'多选题')+'</span><span class="tag d'+q.d+'">'+['','基础','进阶','综合'][q.d]+'</span>'+(S.qs[id]?'':'<span class="tag" style="background:#fff7d6;color:#a16207">新题</span>');
  h+='<div class="qtext">'+esc(q.q)+'</div>';
  if(q.t===2&&!done)h+='<p class="muted" style="margin:-6px 0 10px">多选：至少2个正确选项；错选不得分，少选每个正确选项得0.5分</p>';
  ord.forEach(function(oi,pos){
    var cls='opt'+(q.t===2?' multi':'');
    if(done){var inA=ans.indexOf(oi)>=0,inS=done.sel.indexOf(oi)>=0;
      if(inA&&inS)cls+=' right';else if(!inA&&inS)cls+=' wrong';else if(inA)cls+=(q.t===2?' miss':' right');}
    else if(pick.indexOf(oi)>=0)cls+=' sel';
    h+='<button class="'+cls+'" data-oi="'+oi+'"><span class="k">'+String.fromCharCode(65+pos)+'</span><span>'+esc(q.o[oi])+'</span></button>';
  });
  if(done){
    var r=done.r,lettersA=ord.map(function(oi,pos){return ans.indexOf(oi)>=0?String.fromCharCode(65+pos):''}).join('');
    var lettersS=ord.map(function(oi,pos){return done.sel.indexOf(oi)>=0?String.fromCharCode(65+pos):''}).join('');
    h+='<div class="res '+(r.ok?'ok':(r.part?'part':'bad'))+'">'+(r.ok?'✓ 回答正确':(r.part?'△ 少选，得 '+r.score+' 分（满分2分）':'✗ 回答错误'))+'<span style="font-weight:400;margin-left:8px">正确答案 '+lettersA+(r.ok?'':'，你选 '+lettersS)+'</span></div>';
    h+='<div class="exp"><h4>解析</h4>'+esc(q.e)+'</div>';
    var k=KPM[q.kp],ks=S.kps[q.kp];
    h+='<div class="kpbox"><b>知识点：'+esc(k.n)+(k.imp?' · 重点':'')+'</b>'+esc(k.tip)+'</div>';
    h+='<div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">'+(r.ok?'下次复习：'+ks.due:'该知识点明天会换一道题再考你')+'</span><button class="flag" id="flag">'+(S.flags[id]?'已报错 ✓':'⚑ 题目有误？')+'</button></div>';
  }
  h+='</div><div class="actions">';
  h+=done?'<button class="btn" id="next">'+(s.idx+1>=s.ids.length?'查看本组结果':'下一题')+'</button>':'<button class="btn" id="sub" '+(pick.length?'':'disabled')+'>提交答案</button>';
  h+='</div>';
  app.innerHTML=h;
  $('quit').onclick=function(){view=null;pick=[];render()};
  if(!done){
    app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var oi=+b.dataset.oi;
      if(q.t===1)pick=[oi];else{var i=pick.indexOf(oi);if(i>=0)pick.splice(i,1);else pick.push(oi)}
      renderQuiz(app)}});
    $('sub').onclick=function(){
      var r=grade(q,pick);record(q,r);s.ans[id]={sel:pick.slice(),r:r};pick=[];
      if(s.mode==='daily'&&Object.keys(s.ans).length>=s.ids.length){var d=S.days[today()];if(!d.done){d.done=true;s.justDone=true}}
      save();renderQuiz(app);
    };
  }else{
    $('next').onclick=function(){s.idx++;save();renderQuiz(app);window.scrollTo(0,0)};
    $('flag').onclick=function(){flagSheet(id)};
  }
}
function flagSheet(id){
  var m=document.createElement('div');m.className='mask';
  m.innerHTML='<div class="sheet"><h3>报告题目问题</h3><p class="muted">题号 '+id+'。写下你认为有误的地方（答案、解析或题干），这些记录可以在「设置」里一键复制发给我修正。</p><textarea id="fnote" placeholder="例如：答案应为C，依据……">'+esc((S.flags[id]||{}).note||'')+'</textarea><div class="row" style="margin-top:12px"><button class="btn line" id="fc">取消</button><button class="btn" id="fs">保存</button></div></div>';
  document.body.appendChild(m);
  m.onclick=function(e){if(e.target===m)m.remove()};
  $('fc').onclick=function(){m.remove()};
  $('fs').onclick=function(){S.flags[id]={note:$('fnote').value.trim(),date:today()};save();m.remove();toast('已记录');render()};
}
function renderSummary(app){
  var s=S.cur,ids=s.ids,c=0,wr=[];
  ids.forEach(function(id){var a=s.ans[id];if(a&&a.r.ok)c++;else wr.push(id)});

  if(s.mode==='daily'){h+='<div class="e">🎉</div><h2 style="margin:6px 0">今日打卡完成</h2><p class="muted">已连续打卡 '+streak()+' 天</p>'}

    wr.forEach(function(id){h+='<div class="it" data-id="'+id+'"><span class="tag '+QM[id].s+'">'+SUBJ[QM[id].s]+'</span><div class="t">'+esc(QM[id].q)+'</div></div>'});h+='</div></div>'}

  app.innerHTML=h;
  app.querySelectorAll('.it').forEach(function(e){e.onclick=function(){showQ(e.dataset.id)}});

}

}

/* ---------- 错题 ---------- */
var wf='ing',ws='all';
function renderWrong(app){
  var ids=Object.keys(S.wrong).filter(function(id){return QM[id]});

  var list=ids.filter(function(id){var m=mastered(S.kps[QM[id].kp]);return (wf==='all'||(wf==='ing'?!m:m))&&(ws==='all'||QM[id].s===ws)})
    .sort(function(a,b){return S.wrong[a]<S.wrong[b]?1:-1});

  else{h+='<div class="card list">';list.forEach(function(id){var q=QM[id],qs=S.qs[id]||{w:0},m=mastered(S.kps[q.kp]);

  app.querySelectorAll('.seg [data-s]').forEach(function(b){b.onclick=function(){ws=b.dataset.s;render()}});
  app.querySelectorAll('.it').forEach(function(e){e.onclick=function(){showQ(e.dataset.id)}});
  $('redo').onclick=function(){var s=newSession('wrong');if(!s)return;stashDaily();S.cur=s;save();view='quiz';render();window.scrollTo(0,0)};

  $('cpb').onclick=function(){copy(JSON.stringify(S))};
  $('psb').onclick=function(){var m=document.createElement('div');m.className='mask';m.innerHTML='<div class="sheet"><h3>粘贴备份文本</h3><textarea id="bk" placeholder="把之前复制的备份文本粘贴到这里"></textarea><div class="row" style="margin-top:12px"><button class="btn line" id="bc">取消</button><button class="btn" id="bs">恢复</button></div></div>';document.body.appendChild(m);$('bc').onclick=function(){m.remove()};$('bs').onclick=function(){restore($('bk').value);m.remove()}};
  if($('cpf'))$('cpf').onclick=function(){var t=fl.map(function(id){return id+'｜'+QM[id].q.slice(0,30)+'…｜'+(S.flags[id].note||'')}).join('\n');copy('一建题库报错：\n'+t)};
  if($('clf'))$('clf').onclick=function(){ask('清空报错记录？',function(){S.flags={};save();render()})};
  app.querySelectorAll('.it').forEach(function(e){e.onclick=function(){showQ(e.dataset.id)}});
  $('reset').onclick=function(){ask('确定清空全部做题记录和打卡记录吗？此操作不可恢复。',function(){var st=S.settings;S=blank();S.settings=st;save();toast('已清空');render()})};
}
function restore(txt){try{var o=JSON.parse(txt);if(!o||!o.qs||!o.kps)throw 0;ask('恢复将覆盖当前所有做题记录，确定吗？',function(){S=o;load2();save();toast('恢复成功');render()})}catch(e){toast('备份内容格式不对')}}
function ask(msg,ok){var m=document.createElement('div');m.className='mask';m.innerHTML='<div class="sheet"><p style="margin:4px 0 14px">'+esc(msg)+'</p><div class="row"><button class="btn line" id="ak0">取消</button><button class="btn" id="ak1">确定</button></div></div>';document.body.appendChild(m);$('ak0').onclick=function(){m.remove()};$('ak1').onclick=function(){m.remove();ok()}}
function load2(){var b=blank();for(var k in b){if(S[k]===undefined)S[k]=b[k]}}
function copy(t){
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){toast('已复制')},function(){fallback()})}else fallback();
  function fallback(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已复制')}catch(e){toast('复制失败，请手动选择')}ta.remove()}
}

/* ---------- 启动 ---------- */
// 跨天时清理昨日的每日任务
if(S.cur&&S.cur.mode==='daily'&&S.cur.date!==today())S.cur=null;
if(S.daily&&S.daily.date!==today())S.daily=null;
save();render();initRemote();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.host))navigator.serviceWorker.register('sw.js')}catch(e){}
window.__yj={S:function(){return S},QB:QB,KP:KP,buildSet:buildSet,level:level};
})();
</script>
